<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目选择器刷新稳定性演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#18243b;font:15px system-ui}main{max-width:1200px;margin:36px auto;padding:20px}h1{font-size:23px}p{line-height:1.7;color:#526078}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;border:1px solid #c7d0df;background:white;border-radius:7px;padding:9px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #879cff}button.active{background:#344ed6;color:white}.board{border:1px solid #ced8e7;border-radius:12px;overflow:hidden;background:white}.top{display:flex;align-items:center;gap:18px;padding:18px}.brand{margin-right:auto;white-space:nowrap}.nav{display:flex;gap:5px}.slot{width:240px;flex:0 0 240px;display:flex}.slot select{width:100%;text-overflow:ellipsis}.slot.broken{width:40px;flex-basis:40px}.hint{min-height:70px;padding:18px;background:#eaf0ff;color:#34456c}.content{padding:32px;min-height:160px}.muted{font-size:13px;color:#59667d}output{display:block;margin:20px 0;line-height:1.6}select:disabled{opacity:1;color:#59667d;background:#f1f3f7}@media(max-width:850px){.top{flex-wrap:wrap}.brand{width:100%}.nav{width:100%;overflow:auto}.slot{max-width:100%}.controls{flex-direction:column}}
</style>
<main><h1>刷新时，项目选择器应保持稳定</h1><p>概念演示 · 数据完全本地模拟。缺陷模式模拟用户反馈的空白与缩窄，不代表已完成真实复现。</p>
<div class="controls"><label>对照模式 <select id="mode"><option value="fixed">期望修复</option><option value="broken">缺陷模拟</option></select></label><label>状态 <select id="phase"><option value="normal">正常</option><option value="loading">加载</option><option value="empty">空</option><option value="error">失败</option></select></label><button id="refresh">模拟刷新（1.5 秒）</button></div>
<div class="board"><div class="top"><strong class="brand">Agent Team Board</strong><nav class="nav" aria-label="模块"><button class="active">需求</button><button>发布</button><button>任务</button><button>命令</button></nav><div class="slot" id="slot"><select id="projects" aria-label="选择项目"></select></div><button id="manage">管理项目</button></div><div class="hint" role="status"><span id="hint"></span> <button id="retry" hidden>重试</button></div><div class="content"><strong id="module">需求模块</strong><p>观察加载过程中上方页签与选择器的位置。</p><span class="muted">示例项目不连接真实目录，不写入任何看板数据。</span></div></div><output id="result" aria-live="polite"></output></main>
<script>
const mode=document.querySelector('#mode'),phase=document.querySelector('#phase'),slot=document.querySelector('#slot'),projects=document.querySelector('#projects'),hint=document.querySelector('#hint'),retry=document.querySelector('#retry'),result=document.querySelector('#result');let timer,chosen='agent-team-board';
function render(){const s=phase.value,b=mode.value==='broken'&&s==='loading';slot.classList.toggle('broken',b);projects.replaceChildren();projects.disabled=s!=='normal';const names=s==='normal'?['agent-team-board','very-long-project-name-for-layout-check']: [b?'':({loading:'加载项目中…',empty:'暂无项目',error:'项目加载失败'})[s]];for(const name of names){const o=document.createElement('option');o.textContent=name;o.value=name;projects.append(o)}if(s==='normal')projects.value=chosen;projects.title=s==='normal'?'/示例项目/'+chosen:names[0];hint.textContent=({normal:'项目已加载，可选择项目或切换模块。',loading:'正在加载项目，请稍候。',empty:'没有可用项目，请通过管理项目添加。',error:'项目请求失败，请重试；此状态不是暂无项目。'})[s];retry.hidden=s!=='error';result.textContent='当前：'+mode.selectedOptions[0].text+' / '+phase.selectedOptions[0].text+'。'+(b?'选择器缩小并显示空白，观察页签位移。':'选择区域保留相同宽度；窄屏按响应式布局展示。')}
function refresh(){clearTimeout(timer);phase.value='loading';render();timer=setTimeout(()=>{phase.value='normal';render()},1500)}mode.onchange=()=>{clearTimeout(timer);render()};phase.onchange=()=>{clearTimeout(timer);render()};document.querySelector('#refresh').onclick=refresh;retry.onclick=refresh;projects.onchange=()=>{chosen=projects.value;render()};document.querySelector('#manage').onclick=()=>{hint.textContent='模拟项目管理入口已打开：实际产品沿用现有管理面板。'};document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>{document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b===button));document.querySelector('#module').textContent=button.textContent+'模块'});render();
</script></html>
