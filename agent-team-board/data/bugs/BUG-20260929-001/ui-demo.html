<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUG-20260929-001 · 已发布版本只读演示</title><style>
:root{font:15px/1.6 system-ui;color:#203047;background:#f1f4f8}body{margin:0;padding:28px}h1{font-size:23px}h2{font-size:19px}button,input,select{font:inherit;padding:8px 12px;border:1px solid #aebdce;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed;background:#e5e9ef}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #326af5}label{display:inline-block;margin:6px 18px 12px 0}.board{display:grid;grid-template-columns:280px 1fr;gap:20px}.card,main{background:white;border:1px solid #ccd7e4;border-radius:12px;padding:20px}.card{align-self:start;border-color:#4476db}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.chip{background:#d9f3e5;color:#176440;border-radius:20px;padding:3px 10px;font-size:13px}.note{padding:12px;background:#edf3ff;border-radius:7px}.muted{color:#627186;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}nav button[aria-selected=true]{background:#244e9e;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.row{padding:12px;background:#f4f6fa;border-radius:7px}.error{color:#a72a28;background:#fff0ee;padding:14px}#feedback{min-height:26px;margin-top:20px;color:#254f9f}input{max-width:90%}@media(max-width:740px){body{padding:14px}.board{grid-template-columns:1fr}}
</style><h1>已发布版本：状态一致与只读保护</h1><p class="muted">BUG-20260929-001 · 文档演示 / 所有数据为示意 / 不连接真实项目</p><label>对照模式 <select id="mode"><option value="fixed">期望修复</option><option value="bug">缺陷示意</option></select></label><label>页面状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><div class="board"><aside class="card"><h2>示例版本 1.0.0</h2><span class="chip">已发布</span><p class="muted">示意版本计划 · 1 个关联条目</p><button id="delete">删除</button></aside><main><header><h2>示例版本 1.0.0</h2><span id="chip" class="chip"></span></header><p id="notice" class="note"></p><nav aria-label="版本步骤" id="tabs"></nav><section id="content"></section><p id="feedback" role="status" aria-live="polite"></p></main></div><script>
const labels=['选择条目与提交','挑选合并','文档与翻译','文档合并','发布'];let step=0;const $=id=>document.getElementById(id);const reason='已发布，版本计划仅可查看；如需调整请新建版本';
function mutation(label,knownGap=false){const b=document.createElement('button');b.textContent=label;b.disabled=$('mode').value==='fixed'||!knownGap||['loading','error'].includes($('state').value);b.title=b.disabled?reason:'缺陷示意：入口未置灰';b.onclick=()=>{$('feedback').textContent='缺陷示意：'+label+'入口仍可触发（未写入任何真实数据）';};return b;}
function render(){const fixed=$('mode').value==='fixed';$('chip').textContent=fixed?'已发布':'已合并';$('notice').textContent=fixed?reason:'缺陷示意：列表已发布，详情仍已合并；编辑与删除入口未统一锁定。';$('feedback').textContent='';$('delete').disabled=fixed||['loading','error'].includes($('state').value);$('delete').title=reason;$('delete').onclick=()=>{$('feedback').textContent='缺陷示意：删除入口仍可触发（不会删除数据）';};$('tabs').replaceChildren();labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-selected',i===step);b.onclick=()=>{step=i;render();};$('tabs').append(b);});const c=$('content');c.replaceChildren();if($('state').value==='loading'){c.innerHTML='<p role="status">正在加载版本详情… 修改操作暂不可用。可用上方状态选择器模拟加载完成。</p>';return;}if($('state').value==='error'){c.innerHTML='<p class="error" role="alert">版本详情加载失败。修改操作保持禁用。</p>';const retry=document.createElement('button');retry.textContent='重试加载';retry.onclick=()=>{$('state').value='loading';render();setTimeout(()=>{$('state').value='normal';render();$('feedback').textContent='已重新加载，保持已发布只读状态';},650);};c.append(retry);return;}const h=document.createElement('h2');h.textContent=labels[step];c.append(h);const acts=document.createElement('div');acts.className='actions';const sets=[['AI 完善','编辑','添加条目','移出条目','调整提交'],['合并入 main'],['编辑文档','保存文档','提交审查','生成翻译'],['文档合并入 main'],['再次发布']];sets[step].forEach(label=>acts.append(mutation(label,label==='编辑')));c.append(acts);if(step===0){const input=document.createElement('input');input.type='search';input.placeholder='搜索关联条目';input.setAttribute('aria-label','搜索关联条目');const row=document.createElement('p');row.className='row';const update=()=>{row.textContent=$('state').value==='empty'?'暂无关联条目（已发布，仅可查看）':input.value&&!('示例条目').includes(input.value)?'没有匹配的关联条目':'示例条目 · commit abc1234（演示数据）';};input.oninput=update;c.append(input,row);update();}else{const p=document.createElement('p');p.className='row';p.textContent=$('state').value==='empty'?'暂无可展示记录。':step===4?'发布成功 · 可查看发布记录与结果。':'已归档的步骤信息，仅供查看。';c.append(p);}const view=document.createElement('button');view.textContent='查看记录';view.onclick=()=>{$('feedback').textContent=$('state').value==='empty'?'暂无记录；查看操作仍可用。':'记录已展开：示意版本发布成功，修改入口保持原状态。';};c.append(view);}
$('mode').onchange=render;$('state').onchange=render;render();
</script></html>
