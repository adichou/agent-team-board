<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>本地预检状态对照</title><style>body{font:16px system-ui;background:#f2f5fa;color:#20304a;margin:0;padding:32px}main{max-width:1000px;margin:auto}section{display:grid;grid-template-columns:280px 1fr;gap:20px}article{background:white;border-radius:12px;padding:24px}label,select,button{display:block;margin:12px 0}select,button{font:inherit;padding:10px;max-width:100%}button{cursor:pointer;border:1px solid #9aaec8;border-radius:7px;background:#edf3ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f3f8;padding:16px}#result{padding:16px;border-left:5px solid #6b809d}.pass{color:#137642}.fail{color:#ac2934}@media(max-width:680px){section{grid-template-columns:1fr}body{padding:16px}}</style><main><h1>REL 本地预检状态对照</h1><p>BUG-20260915-013 · 示意演示，非真实生产界面。不执行 Git，不发布。</p><section><article><label for="mode">解析模式</label><select id="mode"><option value="old">修复前：整体 trim</option><option value="new">期望：保留首行空格</option></select><label for="scene">工作区修改</label><select id="scene"><option value="board">仅看板文件</option><option value="mixed">看板 + 源码文件</option><option value="clean">干净仓库</option></select><button id="run">模拟本地预检</button><button data-state="empty">空状态</button><button data-state="loading">加载状态</button><button data-state="error">读取失败</button></article><article><h2>预检结果</h2><div id="result" role="status" aria-live="polite"></div><h3>原始 porcelain（保留前导空格）</h3><pre id="raw"></pre><h3>解析路径</h3><pre id="paths"></pre></article></section></main><script>
const mode=document.querySelector('#mode'),scene=document.querySelector('#scene'),result=document.querySelector('#result'),raw=document.querySelector('#raw'),paths=document.querySelector('#paths');let timer;
function state(value){clearTimeout(timer);result.className='';result.textContent={empty:'尚未运行：选择场景后执行预检。',loading:'加载中：正在读取工作区状态…',error:'失败：Git 状态读取失败。请检查仓库后重新运行。'}[value];raw.textContent='—';paths.textContent='—'}
function render(){let input=scene.value==='clean'?'':' M docs/agent-team-board/repro.md\n';if(scene.value==='mixed')input+=' M src/repro.txt\n';raw.textContent=input||'（空输出）';const lines=(mode.value==='old'?input.trim():input).split('\n').filter(Boolean);const files=lines.map(line=>line.slice(3).trim());paths.textContent=files.join('\n')||'（无变更）';const dirty=files.filter(p=>!p.startsWith('docs/agent-team-board/'));result.className=dirty.length?'fail':'pass';result.textContent=dirty.length?'失败 · dirty：'+dirty.join('、')+'。请先完成提交；未执行推送。':'通过：本地预检无阻塞项，可继续后续阶段；不代表发布成功。'}
document.querySelector('#run').onclick=()=>{state('loading');timer=setTimeout(render,500)};document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>state(button.dataset.state));mode.onchange=scene.onchange=()=>{clearTimeout(timer);render()};state('empty');
</script></html>
