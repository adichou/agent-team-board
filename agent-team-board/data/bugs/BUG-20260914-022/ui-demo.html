<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史确认恢复对照演示</title><style>body{margin:0;background:#10151d;color:#dce2ed;font:16px system-ui}main{max-width:1050px;margin:32px auto;padding:24px;background:#181f2b;border:1px solid #364052;border-radius:14px}h1{font-size:24px}p{line-height:1.7;color:#afbcd0}button,select{background:#25344c;color:#e5ecff;border:1px solid #657795;border-radius:8px;padding:10px;margin:5px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f8d365}h2{font-size:20px;color:#ffd05a}.card{border:1px solid #43516a;border-left:5px solid #ff7379;border-radius:12px;padding:20px;margin:14px 0}.tag{background:#ab3547;border-radius:6px;padding:4px 8px}.muted{color:#a6b4c8}.notice{padding:24px;border:1px dashed #64748b;border-radius:10px}dialog{max-width:500px;background:#202b3c;color:#eef3ff;border:1px solid #8091ad;border-radius:12px}label{display:inline-block}header{border-bottom:1px solid #445066;padding-bottom:16px}</style><main><header><h1>AI 开发 · 历史提交确认恢复</h1><p>离线交互样例：演示控件只切换样例数据，不执行提交或确认。</p><label>对照 <select id="mode"><option value="before">缺陷现象</option><option value="after">期望修复后</option></select></label><label>状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label></header><section id="view" aria-live="polite"></section><p id="explain"></p></main><dialog id="detail"><h2>确认详情（演示）</h2><p id="message"></p><button id="close">关闭</button></dialog><script>
const mode=document.querySelector('#mode'),state=document.querySelector('#state'),view=document.querySelector('#view'),explain=document.querySelector('#explain');let timer;
function render(){clearTimeout(timer);const s=state.value;explain.textContent=mode.value==='before'?'缺陷：旧运行已补交，同文件的新修改使它重新出现。':'期望：核验过的旧运行保持已处理，真实新失败继续保留。';if(s==='loading'){view.innerHTML='<h2>正在读取待确认事项…</h2><div class="notice">核验中，请稍候。数量暂不可用。</div>';return}if(s==='empty'){view.innerHTML='<h2>待人工确认（0）</h2><div class="notice">当前没有待确认事项。</div>';return}if(s==='error'){view.innerHTML='<h2>待确认事项读取失败</h2><div class="notice">未获得最新状态，不能判定已解决。<button data-action="retry">重试</button></div>';return}const old=mode.value==='before';view.innerHTML='<h2>⚠ 待人工确认（'+(old?2:1)+'）——确认后才继续</h2>'+card('BUG-20260914-020','示例新运行','真实新提交失败仍待处理',false)+(old?card('REQ-20260913-006','示例历史运行 A','历史部分提交：同路径新修改被误认为旧改动未入库',true):'<div class="notice">历史运行 A 已核验补交；新任务修改同一文件不会恢复旧卡片。</div>')}
function card(id,run,reason,old){return '<article class="card"><strong>AI 开发 · '+id+'</strong> <span class="tag">待人工确认提交</span><p>'+reason+'</p><div class="muted">'+run+' · 部分提交，开发未完成'+(old?' · 历史账本恢复':'')+'</div><button data-action="detail" data-old="'+old+'">查看并确认</button><button data-action="retry">重新核验</button></article>'}
mode.onchange=render;state.onchange=render;view.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='retry'){state.value='loading';render();timer=setTimeout(()=>{state.value='normal';render()},650)}else{document.querySelector('#message').textContent=b.dataset.old==='true'?'旧运行已补交，但现有恢复只检查路径当前是否脏，因新任务修改同一文件而误报。实际修复须核验并持久记录此运行的处理结果。':'这是真实的新运行提交失败。处理旧历史记录不会自动解决这次失败；仍需核对完整错误与提交内容。';document.querySelector('#detail').showModal()}};document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();render();
</script></html>
