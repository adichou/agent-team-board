<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>一键迁移 · 缺陷与期望演示</title>
<style>
:root{font:16px/1.65 system-ui,sans-serif;color:#1d2939;background:#f2f5fa}body{margin:0;padding:32px 20px}main{max-width:880px;margin:auto}h1{font-size:26px}h2{margin-top:0;font-size:20px}.sub{color:#5b6578}.box{background:white;border:1px solid #d9e1ed;border-radius:16px;padding:24px;margin-top:20px}.controls{display:flex;gap:20px;flex-wrap:wrap}label{display:grid;gap:6px;flex:1}select,button{font:inherit;border:1px solid #bcc9dd;border-radius:8px;padding:9px 13px}select{background:white;max-width:100%}button{cursor:pointer;background:#235dde;color:white}button:disabled{background:#e6eaf0;color:#687385;cursor:default}.secondary{background:white;color:#235dde}.hint{background:#f3f6fb;border-radius:10px;padding:16px}.feedback{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px;padding:14px;border-left:4px solid #8da5c8;background:#f7f9fc}.error{border-color:#c73740;background:#fff1f1}.success{border-color:#16835a;background:#ebfaf4}dialog{border:1px solid #ccd5e2;border-radius:16px;max-width:480px;padding:26px}dialog::backdrop{background:#18243a70}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}small{display:block;margin-top:16px;color:#5b6578}:focus-visible{outline:3px solid #eea928;outline-offset:3px}
</style><main><h1>一键迁移：目录已存在时</h1><p class="sub">BUG-20260924-001 · 文档评审演示。所有文件均为模拟，不会执行真实迁移。</p>
<div class="box controls"><label>对照模式<select id="mode"><option value="fixed">期望修复后</option><option value="bug">当前缺陷</option></select></label><label>模拟场景<select id="scenario"><option value="emptyDir">目标为空目录</option><option value="distinct">两边文件不重名</option><option value="same">同名同内容</option><option value="conflict">同名异内容</option><option value="empty">无旧数据</option><option value="detectError">检测失败</option></select></label></div>
<section class="box" id="card"><h2>数据布局迁移</h2><p class="sub">条目文档进入 agent-team-board/data/；运行状态、锁与账本进入 agent-team-board/runtime/，本地保留。</p><p class="hint" id="hint"></p><div class="actions"><button id="migrate">一键迁移到新布局</button><button class="secondary" id="detect">重新检测</button><button class="secondary" id="reset">重置演示</button></div><div role="status" aria-live="polite" id="feedback" class="feedback"></div><small>真实冲突保留双方文件。活动锁策略待开发核实，本演示不模拟或承诺解锁。</small></section>
<dialog id="confirm"><h2>迁移到新布局？</h2><p>条目文档迁入 data/；运行数据迁入 runtime/。本演示只改变模拟状态，不自动提交、不访问文件系统。</p><div class="actions"><button id="start">开始迁移</button><button class="secondary" id="cancel">取消</button></div></dialog></main>
<script>
const $=id=>document.getElementById(id);let epoch=0;
const source='docs/agent-team-board/.locks',target='agent-team-board/runtime/.locks';
function feedback(text,type=''){ $('feedback').textContent=text;$('feedback').className='feedback '+type; }
function busy(flag){['migrate','detect','reset','mode','scenario'].forEach(id=>$(id).disabled=flag);$('card').setAttribute('aria-busy',String(flag));}
function render(){const s=$('scenario').value;busy(false);$('migrate').textContent='一键迁移到新布局';$('hint').textContent=s==='empty'?'未检测到旧布局，无可迁移数据。':s==='detectError'?'布局检测失败。':'检测到旧布局，源与目标 .locks 目录同时存在。';$('migrate').disabled=['empty','detectError'].includes(s);feedback(s==='empty'?'无可迁移数据。':s==='detectError'?'布局检测失败：模拟读取失败。请重新检测。':'就绪。请选择模式与场景，再开始迁移。',s==='detectError'?'error':'');}
['mode','scenario','reset'].forEach(id=>$(id).addEventListener(id==='reset'?'click':'change',()=>{epoch++;render();}));
$('detect').onclick=()=>{const ticket=++epoch;busy(true);feedback('正在检测数据布局…');setTimeout(()=>{if(ticket!==epoch)return;if($('scenario').value==='detectError')$('scenario').value='emptyDir';render();},800);};
$('migrate').onclick=()=>$('confirm').showModal();$('cancel').onclick=()=>{$('confirm').close();feedback('已取消，模拟数据未改变。');};$('confirm').addEventListener('cancel',()=>feedback('已取消，模拟数据未改变。'));
$('start').onclick=()=>{$('confirm').close();const ticket=++epoch,s=$('scenario').value,mode=$('mode').value;busy(true);feedback('正在迁移…');setTimeout(()=>{if(ticket!==epoch)return;busy(false);if(mode==='bug'){feedback('失败：迁移目标已存在：'+target+'\n源：'+source+'\n请人工核对后重试（可重试；迁移幂等，已完成部分不会重复执行）','error');}else if(s==='conflict'){feedback('迁移未完成：同名文件内容冲突。\n源：'+source+'/sample.lock\n目标：'+target+'/sample.lock\n双方数据均保留。请先核对冲突；直接重试不会消除冲突。','error');}else{$('hint').textContent='已是新布局。';$('migrate').disabled=true;$('migrate').textContent='已是新布局';feedback('✓ 已迁移到新布局。'+(s==='same'?'同内容文件未重复迁移。':s==='distinct'?'两边不重名文件均已保留。':'空目标目录未阻断迁移。')+'\n文档进入 data/，运行数据本地留存。','success');}},1000);};render();
</script></html>
