<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUG-20260920-005 演示 · 已合并未推送的版本计划可重新关联条目与提交</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d9dde3; --text: #1f2430; --muted: #6b7280;
    --primary: #2563eb; --primary-weak: #e8effd; --ok: #15803d; --ok-bg: #e7f6ec;
    --run: #b45309; --run-bg: #fdf1e0; --fail: #b91c1c; --fail-bg: #fdeaea;
    --warn-bg: #fff7e6; --warn-border: #e2b93b; --shadow: 0 8px 28px rgba(15, 23, 42, .18);
  }
  html[data-theme="dark"] {
    --bg: #14171d; --panel: #1d222b; --border: #333a46; --text: #e5e9f0; --muted: #97a1af;
    --primary: #5b8cf5; --primary-weak: #24304a; --ok: #4ade80; --ok-bg: #17301f;
    --run: #f0b45c; --run-bg: #38290f; --fail: #f27b7b; --fail-bg: #3a1a1a;
    --warn-bg: #33290f; --warn-border: #a3842c; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 7px; padding: 4px 11px; }
  .btn:hover:not(:disabled) { border-color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.quiet { color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.small { padding: 2px 8px; font-size: 12.5px; border-radius: 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }

  /* ---------- 演示控制台（仅演示用） ---------- */
  .console { border: 1px dashed var(--warn-border); background: var(--warn-bg); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .console .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .console .lbl { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 4px 12px; }
  .seg button.on { background: var(--primary); color: #fff; }
  select { font: inherit; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    color: var(--text); padding: 3px 6px; }
  .sel-line { font-size: 12.5px; color: var(--muted); margin: -4px 0 10px 2px; }
  .sel-line b { color: var(--text); }

  /* ---------- 模拟构建模块「版本计划」页签 ---------- */
  .mock { border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
    padding: 14px; max-width: 1080px; }
  .bld-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .bld-tabs .tab { border: 1px solid var(--border); border-radius: 999px; padding: 3px 14px;
    background: transparent; color: var(--muted); }
  .bld-tabs .tab.on { background: var(--primary-weak); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .bld-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .rel-split { display: grid; grid-template-columns: 350px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 780px) { .rel-split { grid-template-columns: 1fr; } }
  .rel-list { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .rel-card { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
  .rel-card:hover { border-color: var(--primary); }
  .rel-card.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .rel-card .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rel-card .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .rel-card .row-acts { margin-left: auto; display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .st { display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .st-mute { background: var(--bg); color: var(--muted); }
  .st-run  { background: var(--run-bg); color: var(--run); }
  .st-ok   { background: var(--ok-bg); color: var(--ok); }
  .st-fail { background: var(--fail-bg); color: var(--fail); }
  .rel-detail { border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 240px; }
  .rel-detail-head h3 { margin: 0 0 2px; font-size: 15px; }
  .rel-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .rel-tab { border: 1px solid var(--border); border-radius: 999px; padding: 3px 13px;
    background: transparent; color: var(--muted); }
  .rel-tab.active { background: var(--primary-weak); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .rel-tab:disabled { opacity: .45; cursor: not-allowed; }
  .bld-items { display: flex; flex-direction: column; gap: 5px; }
  .bld-items-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .bld-item-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 9px; font-size: 13px; }
  .bld-item-row .bld-item-id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .bld-item-row .bld-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bld-item-row select { font-size: 12px; }
  .rel-empty, .rel-center { padding: 46px 10px; text-align: center; color: var(--muted); }
  .pane section { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
  .pane section:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .pane h4 { margin: 0 0 4px; font-size: 13.5px; }
  .demo-note { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 8px; }
  .merge-note { margin: 8px 0 0; }
  .form-err { color: var(--fail); background: var(--fail-bg); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; }
  .doc-files { columns: 2; margin: 6px 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  .doc-files li { margin: 1px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
  ul.scope-ul { margin: 6px 0; padding-left: 20px; }
  ul.scope-ul li { margin: 3px 0; font-size: 13px; }

  /* ---------- 弹窗 ---------- */
  .modal-wrap { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); display: flex;
    align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 14px 16px; }
  .modal h3 { margin: 0 0 8px; font-size: 15px; }
  .modal .body { font-size: 13px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .prompt-box, .answer-box { margin: 8px 0; }
  textarea { width: 100%; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; }
  .copy-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .preview { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 12.5px; }
  .field { display: block; font-size: 12.5px; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 9px; margin: 6px 0; font-size: 13px; cursor: pointer; }
  .check.off { opacity: .5; cursor: not-allowed; }

  /* ---------- toast ---------- */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); border-radius: 8px; padding: 7px 16px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 90; max-width: 82vw; }
  #toast.show { opacity: 1; }
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>BUG-20260920-005 · 已合并入 main（未推送）的版本计划应允许重新关联条目与提交</h1>
  <p class="sub">构建模块「版本计划」五步发布流程演示：锁定时机对照——当前在「合并入 main 完成」即锁定，期望口径为「完成推送（正式发布）」才锁定。所有版本号 / 条目 / commit 均为示例数据；演示仅用于对照说明，不替代真实页面验收。</p>

  <div class="console" aria-label="演示控制台">
    <span class="grp"><span class="lbl">对照</span>
      <span class="seg" id="fixSeg">
        <button type="button" data-fix="before" class="on">缺陷现状（修复前）</button>
        <button type="button" data-fix="after">期望效果（修复后）</button>
      </span>
    </span>
    <span class="grp"><span class="lbl">列表场景</span>
      <select id="sceneSel">
        <option value="ok">正常</option>
        <option value="empty">空列表</option>
        <option value="loading">加载中</option>
        <option value="error">加载失败</option>
      </select>
    </span>
    <span class="grp"><span class="lbl">状态演示</span>
      <select id="verSel" aria-label="选择版本"></select>
      <select id="statusSel" aria-label="切换状态">
        <option value="draft">计划中 draft</option>
        <option value="merging">合并中 merging</option>
        <option value="merged">已合并 merged</option>
        <option value="failed">失败 failed</option>
      </select>
      <button type="button" class="btn small" id="applyStatus">应用</button>
    </span>
    <span class="grp"><span class="lbl">推送演示</span>
      <select id="pushSel" aria-label="切换推送状态">
        <option value="no">未推送</option>
        <option value="yes">已推送（正式发布）</option>
      </select>
      <button type="button" class="btn small" id="applyPush">应用</button>
    </span>
    <span class="grp">
      <button type="button" class="btn small" id="themeBtn">🌙 深色</button>
      <button type="button" class="btn small" id="resetBtn">重置演示</button>
    </span>
  </div>
  <p class="sel-line" id="selLine">当前选中：<b>无</b>（点击左侧版本卡片选中）</p>

  <div class="mock">
    <nav class="bld-tabs" aria-label="构建子页签">
      <button type="button" class="tab on">版本计划</button>
      <button type="button" class="tab" onclick="toast('演示未覆盖「分支浏览」页签')">分支浏览</button>
    </nav>
    <div id="bldBody"></div>
    <p class="demo-note" id="demoNote"></p>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" role="status"></div>

<script>
'use strict';
/* ---------- 示例数据（与真实实现同口径：状态标签 / 按钮禁用规则 / 提示文案；均为演示模拟） ---------- */
const STATUS_LABEL = { draft: '计划中', merging: '合并中', merged: '已合并', failed: '失败' };
const STATUS_CLS = { draft: 'st-mute', merging: 'st-run', merged: 'st-ok', failed: 'st-fail' };
const DOC_FILES = ['README.md', 'README.en.md', 'CHANGELOG.md', 'CHANGELOG.en.md',
  'FEATURES.md', 'FEATURES.en.md', 'AGENTS.md', 'AGENTS.en.md'];
const H = (p) => p.padEnd(40, '0').slice(0, 40);

const SEED = () => ([
  { id: 'BLD-20260920-012', name: 'v20260920-012 · 看板与发布流程修复', description: '发布文档门禁与看板细节修复（漏关联一个条目，正等推送）',
    status: 'merged', mergeError: '', pushed: false, pushedAt: null, docsCommitted: true, scopeStale: false,
    items: [
      { itemId: 'REQ-20260918-901', title: '看板列表滚动位置记忆', commit: H('e3f0a1b2c3d4'), commits: [H('e3f0a1b2c3d4'), H('b7c1d2e3f4a5')], mergedAt: '2026-09-20T10:00:00.000Z' },
      { itemId: 'BUG-20260919-902', title: '深色模式下状态章对比度不足', commit: H('9f8e7d6c5b4a'), commits: [H('9f8e7d6c5b4a')], mergedAt: '2026-09-20T10:00:00.000Z' },
    ] },
  { id: 'BLD-20260920-011', name: 'v20260920-011 · 文档与设置页优化', description: '已推送正式发布的上一版',
    status: 'merged', mergeError: '', pushed: true, pushedAt: '2026-09-20T08:30:00.000Z', docsCommitted: true, scopeStale: false,
    items: [
      { itemId: 'REQ-20260917-903', title: '设置页保存并发提示', commit: H('11aa22bb33cc'), commits: [H('11aa22bb33cc')], mergedAt: '2026-09-20T08:00:00.000Z' },
    ] },
  { id: 'BLD-20260920-009', name: 'v20260920-009 · 待合并的补充修复', description: '',
    status: 'draft', mergeError: '', pushed: false, pushedAt: null, docsCommitted: true, scopeStale: false,
    items: [
      { itemId: 'BUG-20260918-904', title: '抽屉页签遮挡长标题', commit: H('77aa88bb99cc'), commits: [H('77aa88bb99cc'), H('c1d2e3f4a5b6')], mergedAt: null },
    ] },
  { id: 'BLD-20260919-030', name: 'v20260919-030 · 分支浏览改进', description: '',
    status: 'failed', mergeError: 'cherry-pick 冲突：CONFLICT (content): Merge conflict in scripts/web/app.js（示例）',
    pushed: false, pushedAt: null, docsCommitted: true, scopeStale: false,
    items: [
      { itemId: 'REQ-20260916-905', title: '分支历史树合并记录展示', commit: H('55cc66dd77ee'), commits: [H('55cc66dd77ee')], mergedAt: null },
    ] },
]);

/* 可补入的候选条目（演示：仅 done 条目可纳入，与真实口径一致） */
const CANDIDATES = () => ([
  { itemId: 'BUG-20260918-906', title: '搜索结果分页边界越界', commits: [H('a1b2c3d4e5f6'), H('d5e6f7a8b9c0')] },
  { itemId: 'REQ-20260919-907', title: '批量任务执行摘要导出', commits: [H('33ee44ff55aa')] },
]);

const state = {
  fix: 'before',            // before=缺陷现状（merged 即锁） | after=期望效果（推送完成才锁）
  scene: 'ok',              // ok | empty | loading | error
  versions: SEED(),
  selVerId: 'BLD-20260920-012',
  step: 'plan',             // plan | link | docs | merge | release
  mergeBusy: false,
  pushBusy: false,
  answer: null,             // { verId, text, parsed, error, copied }
  mergeConfirm: null,       // { verId }
  addPanel: null,           // { verId, picked: Set, commits: {} }
  mergeTimer: null,
  pushTimer: null,
};

/* ---------- 工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const short = (h) => String(h || '').slice(0, 8);
const verOf = (id) => state.versions.find((v) => v.id === id);
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function fmtTime(iso) {
  try { return new Date(iso).toLocaleString('zh-CN', { hour12: false }); } catch { return '—'; }
}

/* ---------- 锁定口径（本演示核心：before 按 merged 锁；after 按推送完成锁） ---------- */
function locks(v) {
  const before = state.fix === 'before';
  const released = !before && !!v.pushed;          // 期望口径：推送完成 = 正式发布
  const merging = v.status === 'merging';
  // 「关联条目与提交」「文档编写」步骤（范围类操作）
  const scopeLocked = before ? (merging || v.status === 'merged') : (merging || released);
  const scopeReason = merging
    ? '合并中'
    : before ? '已合并，范围锁定（如需调整请新建版本）' : '已正式发布（推送完成），范围锁定';
  const itemsTitle = merging
    ? '合并中，请稍候……'
    : before ? '合并中/已合并状态锁定条目增删' : (released ? '已正式发布（推送完成），锁定条目增删' : '');
  // 「AI 完善」
  const answerLocked = before ? (merging || v.status === 'merged') : (merging || released);
  const answerReason = merging
    ? '合并中，请稍候……'
    : before ? '已合并入 main，不允许再 AI 完善' : '已正式发布（推送完成），不允许再 AI 完善';
  // 「合并入 main」：现状仅 draft/failed；期望允许 merged 未推送补合并（仍受文档门禁约束）
  const docsReady = v.docsCommitted && !v.scopeStale;
  let mergeAvail = false;
  let mergeReason = '';
  if (merging) mergeReason = '合并执行中';
  else if (before && v.status === 'merged') mergeReason = '已合并入 main';
  else if (!before && released) mergeReason = '已正式发布（推送完成），不可再合并';
  else if (!v.items.length) mergeReason = '暂无关联条目：请先在「关联条目与提交」步骤关联后再合并';
  else if (!docsReady) mergeReason = v.scopeStale ? '发布范围已变化，文档需重新核对 / 编写并重新提交' : '文档未就绪，暂不可合并';
  else mergeAvail = true;
  // 「正式发布」步仍要求先合并入 main（两口径一致）
  const releaseLocked = v.status !== 'merged';
  const releaseReason = '合并入 main 完成后才能正式发布';
  return { released, merging, scopeLocked, scopeReason, itemsTitle, answerLocked, answerReason,
    mergeAvail, mergeReason, docsReady, releaseLocked, releaseReason };
}

/* ---------- 与真实实现同口径的 AI 完善提示词 / 解析 ---------- */
function buildPrompt(v) {
  const lines = [];
  lines.push(`请为看板版本 ${v.id} 生成「版本名称」与「版本描述」。`);
  lines.push(`当前信息：名称「${v.name || '（空）'}」；描述「${v.description || '（空）'}」。`);
  lines.push('关联条目：');
  for (const it of v.items) lines.push(`- ${it.itemId} ${it.title}（commit ${short(it.commit)}）`);
  lines.push('请综合以上条目给出更完整的版本名称与描述；只按以下格式回答，不要附加其他内容：');
  lines.push('版本名称：<一行>');
  lines.push('版本描述：<可多行>');
  return lines.join('\n');
}
function parseAnswer(text) {
  const raw = String(text || '');
  const nameM = raw.match(/(?:^|\n)\s*版本名称\s*[:：]\s*(.*)/);
  if (!nameM) return { ok: false, error: '未解析到「版本名称：」行：请检查回答是否按提示词约定格式（版本名称：… / 版本描述：…），或关闭弹窗改用手动编辑。' };
  const descM = raw.match(/(?:^|\n)\s*版本描述\s*[:：]\s*\n?([\s\S]*)/);
  return { ok: true, name: nameM[1].trim(), description: descM ? descM[1].replace(/\s+$/, '') : '' };
}

/* ---------- 渲染 ---------- */
function statusChip(status) { return `<span class="st ${STATUS_CLS[status] || 'st-mute'}">${esc(STATUS_LABEL[status] || status)}</span>`; }

function stageLabel(v) {
  if (v.status === 'merged') return state.fix === 'before' ? '正式发布' : (v.pushed ? '正式发布' : '已合并 · 未推送');
  if (v.status === 'merging') return '合并中';
  if (v.status === 'failed') return '失败（可重试）';
  return '计划中';
}

function renderVersionList() {
  if (!state.versions.length) {
    return '<div class="rel-empty">暂无版本计划：点右上「＋ 新建版本」从需求单 / Bug 单创建</div>';
  }
  return state.versions.map((v) => {
    const L = locks(v);
    const verNo = v.id.replace(/^BLD-/, '');
    return `
    <div class="rel-card${v.id === state.selVerId ? ' sel' : ''}" data-ver-id="${esc(v.id)}" role="button" tabindex="0">
      <div class="t"><strong>${esc(v.name || v.id)}</strong> ${statusChip(v.status)}${L.released ? ' <span class="st st-ok" title="推送完成（正式发布）">已推送</span>' : ''}
        <span class="row-acts">
          <button type="button" class="btn small" data-act="answer" data-ver="${esc(v.id)}" ${L.answerLocked ? `disabled title="${esc(L.answerReason)}"` : ' title="复制提示词给 Agent，回答直接粘贴回弹窗自动解析"'}>AI 完善</button>
          <button type="button" class="btn small primary" data-act="merge" data-ver="${esc(v.id)}" ${!L.mergeAvail || state.mergeBusy ? `disabled title="${esc(L.mergeReason || '合并执行中')}"` : ''}>${v.status === 'failed' ? '重试合并入 main' : (state.fix === 'after' && v.status === 'merged' ? '补合并入 main' : '合并入 main')}</button>
          <button type="button" class="btn small quiet" data-act="del" data-ver="${esc(v.id)}" ${v.status === 'merging' ? 'disabled title="合并中，不可删除"' : ' title="删除该版本计划（需确认，删除后不可恢复）"'}>删除</button>
        </span>
      </div>
      <div class="meta">${esc(v.id)} · 版本号 ${esc(verNo)} · 阶段 ${esc(stageLabel(v))} · ${v.items.length} 个关联单 · 更新 ${esc(fmtTime('2026-09-20T15:40:00.000Z'))}</div>
    </div>`;
  }).join('');
}

const STEP_LABEL = { plan: '版本计划', link: '关联条目与提交', docs: '文档编写', merge: '合并入 main', release: '正式发布' };

function renderStepNav(v) {
  const L = locks(v);
  const gateOf = (k) => {
    if (k === 'plan') return { locked: false, reason: '' };
    if (k === 'link' || k === 'docs') return { locked: L.scopeLocked, reason: L.scopeReason };
    if (k === 'merge') return { locked: !L.mergeAvail, reason: L.mergeReason };
    return { locked: L.releaseLocked, reason: L.releaseReason };
  };
  return `<nav class="rel-tabs" role="tablist" aria-label="发布五步流程">
    ${['plan', 'link', 'docs', 'merge', 'release'].map((k) => {
      const g = gateOf(k);
      return `<button type="button" class="rel-tab${state.step === k ? ' active' : ''}" data-step="${k}" role="tab" aria-selected="${state.step === k}"${g.locked && state.step !== k ? ` disabled title="${esc(g.reason || '前置条件未满足')}"` : ''}>${STEP_LABEL[k]}</button>`;
    }).join('')}
  </nav>`;
}

function renderLinkPane(v) {
  const L = locks(v);
  const rows = v.items.map((it) => `
    <div class="bld-item-row">
      <span class="bld-item-id">${esc(it.itemId)}</span>
      <span class="bld-item-title" title="${esc(it.title)}">${esc(it.title)}</span>
      <select data-commit-item="${esc(it.itemId)}" ${L.scopeLocked ? `disabled title="${esc(L.itemsTitle)}"` : ''}>
        ${(it.commits || [it.commit]).map((h) => `<option value="${esc(h)}"${h === it.commit ? ' selected' : ''}>${esc(short(h))}</option>`).join('')}
      </select>
      ${it.mergedAt ? '<span class="st st-ok" title="已合并入 main">✓</span>' : '<span class="st st-mute" title="待合并">待合并</span>'}
      <button type="button" class="btn small quiet" data-remove-item="${esc(it.itemId)}" ${L.scopeLocked ? `disabled title="${esc(L.itemsTitle)}"` : ' title="移出该条目（连同 commit 关联）"'}>移出</button>
    </div>`).join('');
  const emptyLine = !v.items.length ? '<p class="muted small" style="margin:6px 0">暂无条目：点「＋ 添加条目」纳入需求单 / Bug 单</p>' : '';
  return `
    <div class="bld-items">
      <div class="bld-items-head"><strong>关联条目与 commit</strong>
        <button type="button" class="btn small" data-add-open ${L.scopeLocked ? `disabled title="${esc(L.itemsTitle)}"` : ''}>＋ 添加条目</button>
      </div>
      <div class="small muted">共 ${v.items.length} 条${v.scopeStale ? ' · <span class="st st-run">发布范围已变化，文档需重新核对提交</span>' : ''}</div>
      ${emptyLine}
      ${rows}
    </div>`;
}

function renderDocsPane(v) {
  const L = locks(v);
  const chip = v.docsCommitted && !v.scopeStale
    ? '<span class="st st-ok">已提交</span>'
    : v.scopeStale ? '<span class="st st-run">范围已变化 · 需重新核对提交</span>' : '<span class="st st-mute">未提交</span>';
  return `
    <div class="pane">
      <section><h4>发布文档（八文件 · 中英）</h4>
        <p>${chip} <button type="button" class="btn small primary" data-docs-commit ${L.scopeLocked ? `disabled title="${esc(L.itemsTitle)}"` : ''}>${v.docsCommitted ? '重新提交文档（演示）' : '提交文档（演示）'}</button></p>
        <ul class="doc-files">${DOC_FILES.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
        <p class="muted small">合并门禁：文档已提交且范围未过期才可合并；增删条目 / 换 commit 会使旧提交标识失效（scopeStale），需重新提交后才能重开合并。</p>
      </section>
    </div>`;
}

function renderMergePane(v) {
  const L = locks(v);
  const rows = `<ul class="scope-ul">${v.items.map((it) => `<li>${esc(it.itemId)} <code>${esc(short(it.commit))}</code> ${it.mergedAt ? '<span class="st st-ok">已合并</span>' : '<span class="st st-mute">待合并</span>'}</li>`).join('')}</ul>`;
  const note = state.fix === 'after' && v.status === 'merged' && !v.pushed
    ? '<p class="muted small">期望口径：已合并未推送的版本可为补入的新条目 / 新 commit 再次合并——沿用「只补未合并条目」的增量语义，已合并条目保持不动。</p>' : '';
  const failed = v.status === 'failed' && v.mergeError
    ? `<p class="form-err merge-note" role="alert">合并失败：${esc(v.mergeError)}（可重试，只补未合并条目）</p>` : '';
  const merged = v.status === 'merged' && (state.fix === 'before' || v.pushed)
    ? `<p class="small" style="margin:6px 0 0">✓ 已合并入 main${state.fix === 'after' && v.pushed ? '（已推送 · 正式发布）' : ''}</p>` : '';
  return `
    <div class="pane">
      <section><h4>合并范围（逐条目 cherry-pick 重放入 main）</h4>
        ${rows}${failed}${merged}${note}
        ${!L.mergeAvail ? `<p class="form-err" role="alert">暂不可合并：${esc(L.mergeReason)}</p>` : ''}
        <p style="margin-top:8px"><button type="button" class="btn primary" data-merge-open ${!L.mergeAvail || state.mergeBusy ? `disabled title="${esc(L.mergeReason || '合并执行中')}"` : ''}>${v.status === 'failed' ? '重试合并入 main' : (state.fix === 'after' && v.status === 'merged' ? '补合并入 main' : '合并入 main')}</button>
          <span class="muted small">演示：确认后在临时工作树逐条重放，单条失败即中止（成功条目保持，重试只补未合并）。</span></p>
      </section>
    </div>`;
}

function renderReleasePane(v) {
  const L = locks(v);
  const pushedLine = v.pushed
    ? `<p class="small" role="status">已推送主分支 origin（完成时间 ${esc(fmtTime(v.pushedAt))}，基准 <code>${esc(short(H('cafe1234abcd')))}</code>）；官网检测从该时间起。${state.fix === 'after' ? '<br><strong>期望口径：正式发布——「关联条目与提交」「合并入 main」「AI 完善」自此锁定。</strong>' : ''}</p>`
    : '<p class="muted small">尚未推送主分支（推送成功时间将作为官网检测时间窗口起点）。</p>';
  return `
    <div class="pane">
      <section><h4>第一步 · 推送主分支</h4>
        ${pushedLine}
        <p><label class="small">目标远端 <select class="push-remote"><option>origin</option></select></label>
          <button type="button" class="btn primary" data-push ${L.releaseLocked || state.pushBusy ? `disabled title="${esc(L.releaseReason)}"` : ''}>${state.pushBusy ? '推送中…' : '推送主分支'}</button>
          <span class="muted small">只推主分支：不推 dev、不强推；失败可重试。</span></p>
      </section>
      <section><h4>第二步 · 官网 AI 写作</h4>
        <p class="muted small">推送成功后进行：提示词在官网仓库执行，读取本项目已发布版本 CHANGELOG / FEATURES 中英文材料（演示未展开）。</p>
      </section>
      <section><h4>第三步 · 官网同步检测</h4>
        <p><span class="st ${v.pushed ? 'st-run' : 'st-mute'}">${v.pushed ? '等待官网同步' : '等待推送'}</span>
          <button type="button" class="btn small" onclick="toast('演示未覆盖官网检测轮询')">立即检测</button></p>
        <p class="muted small" role="note">每分钟检查官网本地主分支；匹配仅表示本地提交已同步，不代表已推送或网站已部署。</p>
      </section>
    </div>`;
}

function renderPlanPane(v) {
  const verNo = v.id.replace(/^BLD-/, '');
  return `
    <p class="muted small">计划号 ${esc(v.id)} · 版本号 ${esc(verNo)} · 目标分支 main${v.pushed ? ' · 已推送（正式发布）' : ''}</p>
    <p class="small"><span class="muted">描述</span>：${v.description ? esc(v.description) : '<span class="muted">（无描述）</span>'}</p>`;
}

function renderDetail(v) {
  if (!v) return '<div class="rel-detail rel-center">点击左侧版本查看详情</div>';
  let body;
  if (state.step === 'link') body = renderLinkPane(v);
  else if (state.step === 'docs') body = renderDocsPane(v);
  else if (state.step === 'merge') body = renderMergePane(v);
  else if (state.step === 'release') body = renderReleasePane(v);
  else body = renderPlanPane(v);
  const verNo = v.id.replace(/^BLD-/, '');
  return `
    <div class="rel-detail">
      <div class="rel-detail-head">
        <h3>${esc(v.name || v.id)} ${statusChip(v.status)}</h3>
        <p class="muted small">${esc(v.id)} · 版本号 ${esc(verNo)} · 阶段 ${esc(stageLabel(v))}</p>
      </div>
      ${renderStepNav(v)}
      ${body}
    </div>`;
}

function renderBody() {
  const body = $('#bldBody');
  if (state.scene === 'loading') {
    body.innerHTML = '<div class="rel-center"><span class="spin">◐</span> 正在读取构建状态…</div>';
    return;
  }
  if (state.scene === 'error') {
    body.innerHTML = `<div class="rel-center"><p class="form-err" style="display:inline-block">构建状态读取失败（示例：500）</p>
      <p><button type="button" class="btn" id="retryLoad">重试</button></p></div>`;
    $('#retryLoad').addEventListener('click', () => { state.scene = 'ok'; $('#sceneSel').value = 'ok'; render(); });
    return;
  }
  if (state.scene === 'empty') {
    body.innerHTML = '<div class="rel-center">暂无版本计划：点右上「＋ 新建版本」从需求单 / Bug 单创建</div>';
    return;
  }
  body.innerHTML = `
    <div class="bld-toolbar"><button type="button" class="btn primary" onclick="toast('演示未覆盖「新建版本」面板')">＋ 新建版本</button></div>
    <div class="rel-split">
      <div class="rel-list" aria-label="版本列表">${renderVersionList()}</div>
      ${renderDetail(verOf(state.selVerId))}
    </div>`;
  bindBody();
}

function renderModals() {
  const root = $('#modalRoot');
  let html = '';
  if (state.answer) {
    const v = verOf(state.answer.verId);
    const a = state.answer;
    html += `
    <div class="modal-wrap" data-close="answer" role="dialog" aria-label="AI 完善">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>AI 完善（${esc(v?.id || '')}）</h3>
        <div class="body">
          <p class="muted small">上段：复制提示词交给 Agent；下段：把回答粘贴回来，解析预览后应用——全程无需关闭本弹窗。</p>
          <div class="prompt-box">
            <textarea rows="7" readonly id="promptText">${esc(v ? buildPrompt(v) : '')}</textarea>
            <div class="copy-row">
              <button type="button" class="btn small primary" id="copyPromptBtn">复制提示词</button>
              ${a.copied ? '<span class="muted small">已复制 ✓</span>' : ''}
            </div>
          </div>
          <div class="answer-box">
            <label class="field">Agent 回答（粘贴后点「解析并预览」）
              <textarea rows="5" id="answerText" placeholder="版本名称：…&#10;版本描述：…">${esc(a.text)}</textarea></label>
            <div class="copy-row">
              <button type="button" class="btn small" id="sampleBtn">填入示例回答（演示）</button>
              <button type="button" class="btn small" id="parseBtn">解析并预览</button>
            </div>
            ${a.error ? `<p class="form-err" role="alert" style="margin-top:6px">${esc(a.error)}</p>` : ''}
            ${a.parsed ? `<div class="preview">
              <div><span class="muted">名称</span>：${esc(v?.name || '（空）')} → <strong>${esc(a.parsed.name)}</strong></div>
              <div><span class="muted">描述</span>：${esc(v?.description || '（空）')} → <strong>${esc(a.parsed.description || '（空）')}</strong></div>
            </div>` : ''}
          </div>
        </div>
        <div class="foot">
          <button type="button" class="btn" id="answerCloseBtn">关闭</button>
          <button type="button" class="btn primary" id="applyBtn" ${!a.parsed ? 'disabled title="先解析出预览再应用"' : ''}>应用</button>
        </div>
      </div>
    </div>`;
  }
  if (state.mergeConfirm) {
    const v = verOf(state.mergeConfirm.verId);
    const pending = v ? v.items.filter((it) => !it.mergedAt) : [];
    if (v) html += `
    <div class="modal-wrap" data-close="merge" role="dialog" aria-label="合并入 main 确认">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${state.fix === 'after' && v.status === 'merged' ? '补合并入 main' : '合并入 main'}确认（${esc(v.id)}）</h3>
        <div class="body">
          <p>将把以下提交逐条重放（cherry-pick -x）入 <strong>main</strong>（在临时工作树执行，不影响当前分支与未提交改动）：</p>
          <ul class="scope-ul">${(pending.length ? pending : v.items).map((it) => `<li>${esc(it.itemId)} ${esc(short(it.commit))} ${esc(it.title)}</li>`).join('')}</ul>
          ${state.fix === 'after' && v.status === 'merged' ? '<p class="muted small">已合并条目不在本次范围（✓ 保持不动，重试只补未合并）。</p>' : ''}
          <p class="muted small">确认即授权本合并计划；合并中不可重复触发或增删条目。</p>
        </div>
        <div class="foot">
          <button type="button" class="btn" id="mergeCancelBtn">取消</button>
          <button type="button" class="btn primary" id="mergeGoBtn">确认合并</button>
        </div>
      </div>
    </div>`;
  }
  if (state.addPanel) {
    const v = verOf(state.addPanel.verId);
    const have = new Set((v?.items || []).map((it) => it.itemId));
    const cands = CANDIDATES().filter((c) => !have.has(c.itemId));
    html += `
    <div class="modal-wrap" data-close="add" role="dialog" aria-label="添加条目">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>添加条目（${esc(v?.id || '')}）</h3>
        <div class="body">
          <p class="muted small">候选 = 已完成（done）且未被其他版本占用的条目（演示数据）；勾选并为每条选择要关联的 commit。</p>
          ${cands.length ? cands.map((c) => `
            <label class="check">
              <input type="checkbox" data-cand="${esc(c.itemId)}" ${state.addPanel.picked.has(c.itemId) ? 'checked' : ''}>
              <span>${esc(c.itemId)} ${esc(c.title)}</span>
              <select data-cand-commit="${esc(c.itemId)}" ${state.addPanel.picked.has(c.itemId) ? '' : 'disabled'}>
                ${c.commits.map((h) => `<option value="${esc(h)}"${state.addPanel.commits[c.itemId] === h ? ' selected' : ''}>${esc(short(h))}</option>`).join('')}
              </select>
            </label>`).join('') : '<p class="muted small">暂无可补入的候选条目（演示候选已全部纳入）。</p>'}
          <p class="muted small">加入后发布范围变化：旧文档提交标识失效（scopeStale），需到「文档编写」步重新提交后才能重开合并。</p>
        </div>
        <div class="foot">
          <button type="button" class="btn" id="addCancelBtn">取消</button>
          <button type="button" class="btn primary" id="addGoBtn" ${!state.addPanel.picked.size ? 'disabled title="先勾选至少一条"' : ''}>加入版本</button>
        </div>
      </div>
    </div>`;
  }
  root.innerHTML = html;
  bindModals();
}

function render() {
  renderBody();
  renderModals();
  const sv = verOf(state.selVerId);
  $('#selLine').innerHTML = `当前选中：<b>${sv ? esc(sv.id) : '无'}</b>（点击左侧版本卡片选中）`;
  $('#demoNote').innerHTML = state.fix === 'before'
    ? '对照说明（缺陷现状）：锁定发生在「合并入 main 完成（merged）」——未推送、尚未正式发布的版本计划已无法关联条目与提交 / 重开合并 / AI 完善；正式发布步推送完成后，锁定状态与推送前完全一致（推送不新增任何锁定）。'
    : '对照说明（期望效果）：只有「完成推送到远端仓库（正式发布）」的版本计划才禁止关联条目与提交 / 合并入 main / AI 完善——merged 且未推送的版本可自由补关联（换 commit / 增删条目）、到「文档编写」重新提交后在「合并入 main」补合并（只补未合并条目）、继续 AI 完善；推送成功后三类操作即时锁定。';
  renderConsoleState();
}

function renderConsoleState() {
  const sel = $('#verSel');
  const prev = sel.value;
  sel.innerHTML = state.versions.map((v) => `<option value="${esc(v.id)}">${esc(v.id)}（${STATUS_LABEL[v.status]}${v.pushed ? ' · 已推送' : ''}）</option>`).join('');
  if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
  const v = verOf(sel.value);
  if (v) $('#statusSel').value = v.status;
  $('#pushSel').value = v?.pushed ? 'yes' : 'no';
  const disabled = state.scene !== 'ok' || !state.versions.length;
  $('#verSel').disabled = $('#statusSel').disabled = $('#applyStatus').disabled = disabled;
  $('#pushSel').disabled = $('#applyPush').disabled = disabled;
}

/* ---------- 交互 ---------- */
function openAnswer(verId) {
  const v = verOf(verId); if (!v) return;
  const L = locks(v);
  if (L.answerLocked) { toast(`已拦截：${L.answerReason}`); return; }
  state.answer = { verId, text: '', parsed: null, error: '', copied: false };
  render();
}
function openMergeConfirm(verId) {
  const v = verOf(verId); if (!v) return;
  const L = locks(v);
  if (!L.mergeAvail || state.mergeBusy) { toast(`已拦截：${L.mergeReason || '合并执行中'}`); return; }
  state.mergeConfirm = { verId };
  render();
}
function openAddPanel(verId) {
  const v = verOf(verId); if (!v) return;
  const L = locks(v);
  if (L.scopeLocked) { toast(`已拦截：${L.itemsTitle || L.scopeReason}`); return; }
  state.addPanel = { verId, picked: new Set(), commits: {} };
  render();
}

$('#bldBody').addEventListener('click', (e) => {
  const actBtn = e.target.closest('[data-act]');
  if (actBtn && !actBtn.disabled) {
    const { act, ver } = actBtn.dataset;
    if (act === 'answer') openAnswer(ver);
    else if (act === 'merge') openMergeConfirm(ver);
    else if (act === 'del') toast('演示未覆盖删除确认（实际有二次确认弹窗）');
    return;
  }
  const stepBtn = e.target.closest('[data-step]');
  if (stepBtn && !stepBtn.disabled) { state.step = stepBtn.dataset.step; render(); return; }
  const addOpen = e.target.closest('[data-add-open]');
  if (addOpen && !addOpen.disabled) { openAddPanel(state.selVerId); return; }
  const mergeOpen = e.target.closest('[data-merge-open]');
  if (mergeOpen && !mergeOpen.disabled) { openMergeConfirm(state.selVerId); return; }
  const docsBtn = e.target.closest('[data-docs-commit]');
  if (docsBtn && !docsBtn.disabled) {
    const v = verOf(state.selVerId); if (!v) return;
    const L = locks(v);
    if (L.scopeLocked) { toast(`已拦截：${L.itemsTitle || L.scopeReason}`); return; }
    v.docsCommitted = true; v.scopeStale = false;
    render(); toast('✓ 发布文档已提交（演示）：文档门禁放行，可进入合并');
    return;
  }
  const pushBtn = e.target.closest('[data-push]');
  if (pushBtn && !pushBtn.disabled) {
    const v = verOf(state.selVerId); if (!v) return;
    state.pushBusy = true; render();
    clearTimeout(state.pushTimer);
    state.pushTimer = setTimeout(() => {
      state.pushBusy = false;
      v.pushed = true; v.pushedAt = new Date().toISOString();
      render();
      toast(state.fix === 'after'
        ? '✓ 已推送主分支 origin（正式发布）——期望口径：关联条目与提交 / 合并入 main / AI 完善自此锁定'
        : '✓ 已推送主分支 origin——注意（缺陷）：推送前后锁定状态完全一致，锁定早已发生在 merged 时点');
    }, 1000);
    return;
  }
  const rm = e.target.closest('[data-remove-item]');
  if (rm && !rm.disabled) {
    const v = verOf(state.selVerId); if (!v) return;
    const it = v.items.find((x) => x.itemId === rm.dataset.removeItem);
    if (!it) return;
    v.items = v.items.filter((x) => x !== it);
    if (v.docsCommitted) v.scopeStale = true;
    render(); toast(`已移出 ${it.itemId}（发布范围已变化，文档需重新核对提交）`);
    return;
  }
  const card = e.target.closest('[data-ver-id]');
  if (card?.dataset.verId) { state.selVerId = card.dataset.verId; render(); return; }
});

$('#bldBody').addEventListener('change', (e) => {
  const sel = e.target.closest('[data-commit-item]');
  if (sel && !sel.disabled) {
    const v = verOf(state.selVerId); if (!v) return;
    const it = v.items.find((x) => x.itemId === sel.dataset.commitItem);
    if (!it || it.commit === sel.value) return;
    it.commit = sel.value;
    if (v.docsCommitted) v.scopeStale = true;
    render(); toast(`${it.itemId} 已换选 commit ${short(sel.value)}（发布范围已变化，文档需重新核对提交）`);
  }
});

function bindModals() {
  $('#copyPromptBtn')?.addEventListener('click', async () => {
    const text = $('#promptText')?.value || '';
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch { /* file:// 或无权限时走兜底 */ }
    if (!ok) { const ta = $('#promptText'); ta.focus(); ta.select(); }
    state.answer.copied = true; render();
    toast(ok ? '✓ 提示词已复制，去 Agent 粘贴执行后把回答粘贴到下方' : '已全选提示词文本：请按 Ctrl/⌘+C 手动复制');
  });
  $('#sampleBtn')?.addEventListener('click', () => {
    const v = verOf(state.answer.verId); if (!v) return;
    $('#answerText').value = `版本名称：${v.name}（AI 完善）\n版本描述：本版本包含 ${v.items.length} 个条目：${v.items.map((i) => i.title).join('、')}；统一收敛相关修复与体验优化。`;
  });
  $('#parseBtn')?.addEventListener('click', () => {
    const r = parseAnswer($('#answerText').value);
    if (!r.ok) Object.assign(state.answer, { parsed: null, error: r.error });
    else Object.assign(state.answer, { parsed: { name: r.name, description: r.description }, error: '' });
    render();
  });
  $('#applyBtn')?.addEventListener('click', () => {
    const v = verOf(state.answer.verId); const p = state.answer?.parsed;
    if (!v || !p) return;
    if (p.name) v.name = p.name;
    if (p.description || p.description === '') v.description = p.description;
    state.answer = null; render();
    toast(`✓ 已应用（${v.id} 名称与描述已更新）`);
  });
  $('#answerCloseBtn')?.addEventListener('click', () => { state.answer = null; render(); });
  $('#mergeCancelBtn')?.addEventListener('click', () => { state.mergeConfirm = null; render(); });
  $('#mergeGoBtn')?.addEventListener('click', () => {
    const v = verOf(state.mergeConfirm?.verId); if (!v) return;
    state.mergeConfirm = null; state.mergeBusy = true; v.status = 'merging'; v.mergeError = ''; render();
    clearTimeout(state.mergeTimer);
    state.mergeTimer = setTimeout(() => {
      state.mergeBusy = false;
      for (const it of v.items) if (!it.mergedAt) it.mergedAt = new Date().toISOString();
      v.status = 'merged';
      render();
      toast('✓ 已合并入 main（只补未合并条目，已合并条目保持不动）');
    }, 1400);
  });
  $('#addCancelBtn')?.addEventListener('click', () => { state.addPanel = null; render(); });
  $('#addGoBtn')?.addEventListener('click', () => {
    const v = verOf(state.addPanel?.verId); if (!v) return;
    const cands = new Map(CANDIDATES().map((c) => [c.itemId, c]));
    const added = [];
    for (const id of state.addPanel.picked) {
      const c = cands.get(id); if (!c) continue;
      const commit = state.addPanel.commits[id] || c.commits[0];
      v.items.push({ itemId: c.itemId, title: c.title, commit, commits: c.commits.slice(), mergedAt: null });
      added.push(c.itemId);
    }
    if (added.length && v.docsCommitted) v.scopeStale = true;
    state.addPanel = null; state.step = 'link';
    render();
    toast(added.length
      ? `✓ 已加入 ${added.join('、')}——发布范围变化：请到「文档编写」重新提交，再回「合并入 main」补合并`
      : '未选择任何条目');
  });
  document.querySelectorAll('[data-cand]').forEach((cb) => {
    cb.addEventListener('change', () => {
      if (cb.checked) state.addPanel.picked.add(cb.dataset.cand);
      else state.addPanel.picked.delete(cb.dataset.cand);
      render();
    });
  });
  document.querySelectorAll('[data-cand-commit]').forEach((sel) => {
    sel.addEventListener('change', () => { state.addPanel.commits[sel.dataset.candCommit] = sel.value; });
  });
  for (const wrap of document.querySelectorAll('.modal-wrap')) {
    wrap.addEventListener('click', (e) => {
      if (e.target !== wrap) return;
      if (wrap.dataset.close === 'answer') state.answer = null;
      if (wrap.dataset.close === 'merge') state.mergeConfirm = null;
      if (wrap.dataset.close === 'add') state.addPanel = null;
      render();
    });
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.answer) { state.answer = null; render(); return; }
  if (state.mergeConfirm) { state.mergeConfirm = null; render(); return; }
  if (state.addPanel) { state.addPanel = null; render(); }
});

/* ---------- 控制台 ---------- */
$('#fixSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-fix]'); if (!b) return;
  state.fix = b.dataset.fix;
  state.answer = null; state.mergeConfirm = null; state.addPanel = null;
  state.step = 'plan';
  for (const x of $('#fixSeg').children) x.classList.toggle('on', x === b);
  render();
  toast(state.fix === 'before' ? '已切换到缺陷现状：merged 即锁定（未推送也被锁死）' : '已切换到期望效果：推送完成（正式发布）才锁定');
});
$('#sceneSel').addEventListener('change', (e) => { state.scene = e.target.value; render(); });
$('#applyStatus').addEventListener('click', () => {
  const v = verOf($('#verSel').value); if (!v) return;
  const to = $('#statusSel').value;
  v.status = to;
  v.mergeError = to === 'failed' ? 'cherry-pick 冲突：CONFLICT (content): Merge conflict in scripts/web/app.js（示例）' : '';
  if (to !== 'merged') v.pushed = false; // 仅 merged 可推送
  if (to === 'draft') for (const it of v.items) it.mergedAt = null;
  render();
  toast(`演示：${v.id} 状态已切换为「${STATUS_LABEL[to]}」——注意按钮 / 步骤可用性与推送状态的关系`);
});
$('#applyPush').addEventListener('click', () => {
  const v = verOf($('#verSel').value); if (!v) return;
  if (v.status !== 'merged') { toast('仅已合并（merged）的版本可推送：请先把状态切到 merged'); return; }
  const yes = $('#pushSel').value === 'yes';
  v.pushed = yes;
  v.pushedAt = yes ? new Date().toISOString() : null;
  render();
  toast(yes ? (state.fix === 'after' ? '已推送（正式发布）——期望口径：三类操作自此锁定' : '已推送——缺陷口径：锁定状态不变（早已锁死）')
            : '已重置为未推送');
});
$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  $('#themeBtn').textContent = dark ? '🌙 深色' : '☀️ 浅色';
});
$('#resetBtn').addEventListener('click', () => {
  clearTimeout(state.mergeTimer); clearTimeout(state.pushTimer);
  state.versions = SEED();
  state.selVerId = 'BLD-20260920-012';
  state.step = 'plan'; state.scene = 'ok'; state.answer = null;
  state.mergeConfirm = null; state.addPanel = null;
  state.mergeBusy = false; state.pushBusy = false;
  $('#sceneSel').value = 'ok';
  render(); toast('演示已重置');
});
if (matchMedia?.('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
  $('#themeBtn').textContent = '☀️ 浅色';
}

render();
</script>
</body>
</html>
