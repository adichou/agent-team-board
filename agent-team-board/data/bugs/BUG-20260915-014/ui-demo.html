<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版本计划内发布 · 交互演示</title>
<style>body{font:15px system-ui;margin:0;background:#eef2f7;color:#20304a}header,main{max-width:1100px;margin:auto;padding:24px}button,select,input{font:inherit;padding:9px 13px;border:1px solid #bcc8d7;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.active{background:#255bd5;color:white}main{display:grid;grid-template-columns:230px 1fr;gap:18px}aside,article{background:white;padding:22px;border-radius:14px}aside button{display:block;width:100%;margin:12px 0;text-align:left}nav{display:flex;gap:8px;border-bottom:1px solid #ddd;padding-bottom:12px}section{margin-top:20px;padding:20px;background:#f5f7fb;border-radius:10px}.muted{color:#65748b}.error{background:#fff0ee;color:#a62920}.row{display:flex;gap:10px;flex-wrap:wrap}.run{display:block;margin:10px 0}#notice{padding:12px;min-height:22px}h2{margin-top:0}label{display:inline-block;margin:5px}dialog{border:0;border-radius:12px;padding:25px;max-width:400px}dialog::backdrop{background:#14243d77}@media(max-width:700px){main{grid-template-columns:1fr}header,main{padding:14px}}</style>
<header><h1>构建 / 版本计划</h1><p class="muted">BUG-20260915-014 · 仅演示，不访问接口、不执行发布</p><label>对照 <select id="mode"><option value="fixed">期望修复</option><option value="broken">缺陷现象</option></select></label><label>数据场景 <select id="phase"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">读取失败</option></select></label><div id="notice" role="status" aria-live="polite"></div></header>
<main><aside><strong>版本计划</strong><button id="v1">版本 A · 已合并</button><button id="v2">版本 B · 计划中</button></aside><article><h2 id="title"></h2><p class="muted">目标分支 main · 示例版本信息</p><nav aria-label="版本详情页签"><button id="overview">概况</button><button id="release">发布</button></nav><div id="content"></div></article></main>
<dialog id="modal"><h2>创建发布草稿</h2><p>演示仅创建本地示例，不会执行发布。</p><label>发行版本号 <input id="version" placeholder="例如 1.2.0"></label><p id="validation" role="alert"></p><div class="row"><button id="cancel">取消</button><button id="confirm">确认创建</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let selected='A',tab='overview',run='success',created=false;
function notify(t){$('notice').textContent=t}
function go(){if($('mode').value==='broken'){notify('缺陷示意：发布模块暂时隐藏，已回到需求模块（真实页面会离开构建）。');return}tab='release';notify('已在当前版本详情打开发布');render()}
function render(){const merged=selected==='A',phase=$('phase').value;$('title').textContent='版本 '+selected+' · '+(merged?'已合并':'计划中');for(const id of ['overview','release']){$(id).classList.toggle('active',tab===id);$(id).setAttribute('aria-pressed',tab===id)}$('release').hidden=$('mode').value==='broken';$('v1').classList.toggle('active',merged);$('v2').classList.toggle('active',!merged);
let body='';if(tab==='overview'){body='<section><h3>版本描述</h3><p>改进版本发布入口与运行反馈。</p><h3>关联条目与 commit</h3><p>示例条目 · abc1234</p><p>'+ (merged?'合并成功 · 管理记录已提交（示例）':'条目可编辑，尚未合并（示例）')+'</p></section><section><h3>产品发布</h3><button id="create" '+(!merged?'disabled':'')+'>创建发布</button> <button id="view">查看发布记录</button>'+(!merged?'<p>请先完成合并入 main</p>':'')+'</section>'}
else if(phase==='loading'){body='<section role="status">正在加载当前版本的发布记录……<p><button id="finish">模拟加载完成</button></p></section>'}
else if(phase==='error'){body='<section class="error" role="alert">发布记录读取失败：模拟网络错误<p><button id="retry">重试读取</button></p></section>'}
else if(!merged||phase==='empty'){body='<section><h3>当前版本暂无发布记录</h3><button id="create" '+(!merged?'disabled':'')+'>创建发布</button>'+(!merged?'<p>请先完成合并入 main</p>':'')+'</section>'}
else{body='<section><h3>当前版本发布记录</h3><button class="run" id="success">示例运行 01 · 1.1.0 · 成功</button><button class="run" id="failed">示例运行 02 · 1.2.0 · 失败</button>'+(created?'<button class="run" id="draft">新建草稿 · '+escapeText($('version').value)+'</button>':'')+'<button id="create">创建发布</button></section><section><h3>运行详情 · '+(run==='failed'?'示例运行 02':run==='draft'?'新建草稿':'示例运行 01')+'</h3><p>来源：版本 A</p>'+(run==='failed'?'<p class="error">失败 · 官网阶段：模拟构建命令失败</p><p>Web App：成功 · 官网：失败</p><button id="explain">查看失败说明</button>':run==='draft'?'<p>草稿 · 所有阶段待执行</p><p>预检 → 计划确认 → 执行 → 结果核验</p><button id="precheck">模拟预检</button>':'<p>成功 · 发布与核验完成</p><p>Web App：成功 · 官网：成功</p>')+'</section>'}
$('content').innerHTML=body;const bind=(id,fn)=>{if($(id))$(id).onclick=fn};bind('view',go);bind('create',()=>{$('validation').textContent='';$('modal').showModal()});for(const id of ['retry','finish'])bind(id,()=>{$('phase').value='normal';notify('当前版本记录读取成功');render()});for(const id of ['success','failed','draft'])bind(id,()=>{run=id;render()});bind('explain',()=>notify('示例错误：官网构建退出。真实重试入口应服从发布状态规则。'));bind('precheck',()=>notify('模拟预检通过；真实流程仍需预览计划并明确确认执行，本演示不执行。'))}
function escapeText(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('overview').onclick=()=>{tab='overview';render()};$('release').onclick=go;for(const [id,v] of [['v1','A'],['v2','B']])$(id).onclick=()=>{selected=v;run='success';notify('已切换版本 '+v+'，清除旧记录选择');render()};$('phase').onchange=()=>{tab='release';render()};$('mode').onchange=()=>{tab='overview';notify('');render()};$('cancel').onclick=()=>$('modal').close();$('confirm').onclick=()=>{if(!$('version').value.trim()){$('validation').textContent='请填写发行版本号';return}created=true;run='draft';$('phase').value='normal';$('modal').close();go();if($('mode').value==='fixed')notify('草稿已创建，未执行发布')};render();
</script></html>
