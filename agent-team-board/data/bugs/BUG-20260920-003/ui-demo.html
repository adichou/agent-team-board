<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUG-20260920-003 · 确认续跑演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17243c;font:15px/1.6 system-ui}main{max-width:1000px;margin:30px auto;padding:20px}h1{font-size:24px}section{background:white;padding:24px;border:1px solid #d8e0eb;border-radius:14px;margin:18px 0}label{display:block;margin:12px 0}select,textarea,button{font:inherit;border-radius:7px;border:1px solid #abb9ce;padding:9px}textarea{width:100%;resize:vertical}button{background:white;cursor:pointer;margin:5px 8px 5px 0}button.primary{background:#2459db;color:white}button:disabled{opacity:.5;cursor:wait}.meta{color:#596a81;overflow-wrap:anywhere}.notice{padding:16px;border-radius:9px;background:#edf4ff;border-left:4px solid #2459db;white-space:pre-wrap}.error{background:#fff1ee;border-color:#d84426}.toolbar{display:flex;gap:25px;flex-wrap:wrap}#prompt{font:13px/1.6 monospace}small{color:#637187}</style><main><h1>AI 分析 · 人工确认后续跑</h1><p>交互演示；状态与提示词为示例，不调用真实接口或启动 Agent。</p><section><div class="toolbar"><label>对照模式 <select id="mode"><option value="fixed">期望修复</option><option value="broken">缺陷现象</option></select></label><label>场景 <select id="scenario"><option value="normal">正常</option><option value="empty">提示词为空</option><option value="loading">加载中</option><option value="copyfail">复制失败</option><option value="fetchfail">提示词获取失败</option><option value="confirmfail">确认失败</option></select></label></div><button id="reset">重置演示</button></section><section><h2>待人工确认分析</h2><p class="meta">BUG-20260920-003<br>项目：/Users/adichou/Documents/src/agent-team-board</p><label>必答问题：是否按当前描述继续完善？<textarea id="answer" rows="2">确认，按当前描述继续。</textarea></label><button class="primary" id="confirm">确认并继续</button><button id="draft">保存草稿</button><button id="hold">保持挂起</button><div id="feedback" class="notice" role="status" aria-live="polite">等待人工确认。</div><div id="handoff" hidden><h3>续跑提示词</h3><p>到上述项目的 AI Agent 调度会话粘贴并发送。排队成功不代表 Agent 已开始执行。</p><textarea id="prompt" rows="7" readonly aria-label="完整续跑提示词示例"></textarea><button id="retry">重新复制（模拟恢复）</button><button id="fetch">重新获取（模拟恢复）</button><button id="select">全选文本</button><button id="actual">实际复制示例文本</button><small>自动复制结果由场景模拟；实际复制按钮会尝试浏览器剪贴板。</small></div></section></main><script>
const $=id=>document.getElementById(id);let confirmed=false;let timer;const example='【演示用文本，非生产完整提示词】\n项目：/Users/adichou/Documents/src/agent-team-board\n请继续当前 AI 分析调度：每次仅派发一个新子代理，模型与推理档位继承主会话。子代理通过 refine next 领取当前条目及人工确认答案，按完整既有流程补文档并回执。主调度 refine check 后决定继续或结束。\n生产页面应展示当前项目当前批次生成的完整提示词。';
function msg(t,error=false){$('feedback').textContent=t;$('feedback').classList.toggle('error',error)}function reset(){clearTimeout(timer);confirmed=false;$('fetch').disabled=false;$('confirm').disabled=false;$('confirm').textContent='确认并继续';$('handoff').hidden=true;$('prompt').value='';msg('等待人工确认。')}function copied(){msg('已确认并加入续跑队列。续跑提示词已复制（模拟）。\n请到当前项目的 AI Agent 调度会话粘贴并发送，继续当前条目分析。')}function result(){confirmed=true;$('confirm').textContent='已确认，待 Agent 续跑';if($('mode').value==='broken'){msg('已确认，正在继续当前条目分析（完成后才处理下一条）\n缺陷对照：没有复制提示词，也没有去 Agent 操作的引导。');return}$('handoff').hidden=false;const scene=$('scenario').value;$('prompt').value=['empty','fetchfail'].includes(scene)?'':example;$('retry').disabled=!$('prompt').value;if(scene==='empty')msg('已确认并排队，但续跑提示词为空。请重新获取；未复制空内容。',true);else if(scene==='fetchfail')msg('已确认并排队，提示词获取失败。请重新获取；无需重新确认。',true);else if(scene==='copyfail')msg('已确认并排队，续跑提示词复制失败。请重新复制，或全选下方文本手动复制后到 AI Agent 粘贴发送。',true);else copied()}
$('confirm').onclick=()=>{if(!$('answer').value.trim()){msg('请补齐必答答案，尚未确认，也未复制。',true);return}$('confirm').disabled=true;msg('确认中，请稍候…');timer=setTimeout(()=>{if($('scenario').value==='confirmfail'){msg('确认失败：问题版本已更新，请重新核对问题并作答。未复制提示词。',true);$('confirm').disabled=false;return}if($('scenario').value==='loading'){msg('确认处理中…重复提交已禁用。切换场景可结束此演示。');return}result()},500)};$('retry').onclick=()=>{if(confirmed&&$('prompt').value)copied()};$('fetch').onclick=()=>{msg('获取续跑提示词中…');$('fetch').disabled=true;timer=setTimeout(()=>{$('prompt').value=example;$('retry').disabled=false;$('fetch').disabled=false;msg('已获取当前批次提示词（模拟）。请点击重新复制后到 AI Agent 粘贴发送。')},500)};$('select').onclick=()=>{$('prompt').focus();$('prompt').select()};$('actual').onclick=async()=>{if(!$('prompt').value){msg('提示词为空，请重新获取。',true);return}try{await navigator.clipboard.writeText($('prompt').value);msg('示例文本已实际复制。注意：此文本仅为演示，不能替代生产完整调度提示词。')}catch{msg('浏览器拒绝剪贴板访问，请全选文本手动复制。',true)}};$('draft').onclick=()=>msg('草稿已保存（模拟），未确认，不复制提示词。');$('hold').onclick=()=>msg('保持挂起（模拟），队列仍暂停，不复制提示词。');$('reset').onclick=reset;$('mode').onchange=reset;$('scenario').onchange=reset;
</script></html>
