<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧项目迁移入口 · BUG-20260920-001</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#243047;font:15px/1.6 system-ui,sans-serif}main{max-width:920px;margin:40px auto;padding:0 24px}h1{font-size:26px;margin-bottom:4px}h2{font-size:19px}p{margin:10px 0}.muted{color:#69758b}.toolbar,section{background:white;padding:22px;border:1px solid #dce2eb;border-radius:14px;margin:18px 0}.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}select,button{font:inherit;padding:8px 12px;border:1px solid #bcc8d9;border-radius:7px;background:white;cursor:pointer}button.primary{background:#235ddd;color:white;border-color:#235ddd}button:disabled{opacity:.5;cursor:not-allowed}.notice{padding:14px;border-radius:8px;background:#eef3fc}.error{background:#fff0ee;color:#963b2b}.success{background:#e8f6ee;color:#226841}code{overflow-wrap:anywhere}dialog{max-width:520px;border:1px solid #c7d2e1;border-radius:14px;padding:26px}dialog::backdrop{background:#18243b66}.actions{display:flex;gap:10px;justify-content:flex-end}label{display:flex;gap:8px;align-items:center}
</style>
<main><p class="muted">Agent Team Board / 设置 · 交互说明</p><h1>旧项目也能进入数据迁移</h1><p class="muted">项目：/示例/旧项目 · 离线演示，不读取或改动真实数据</p>
<div class="toolbar"><label>视图 <select id="mode"><option value="fixed">期望修复后</option value="broken">缺陷现象</option></select></label><label>状态 <select id="scenario"><option value="legacy">正常：旧布局</option><option value="modern">正常：已是新布局</option><option value="empty">空：无看板数据</option><option value="loading">加载：检测中</option><option value="error">失败：检测失败</option><option value="failed">失败：迁移失败</option></select></label><label><input id="fail" type="checkbox">模拟迁移失败</label></div>
<div id="view" aria-live="polite"></div>
<dialog id="confirm"><h2>迁移到新布局？</h2><p>条目文档移至 <code>agent-team-board/data/</code> 并保留 Git 历史；运行数据移至 <code>agent-team-board/runtime/</code> 本地保留、停止提交。</p><p>迁移不自动提交。此演示只模拟状态，不执行文件操作。</p><div class="actions"><button id="cancel">取消</button><button class="primary" id="start">开始迁移</button></div></dialog>
</main><script>
const mode=document.querySelector('#mode'),scenario=document.querySelector('#scenario'),view=document.querySelector('#view'),dialog=document.querySelector('#confirm');let timer;
function render(){clearTimeout(timer);const s=scenario.value;if(mode.value==='broken'){view.innerHTML='<section><h2>设置</h2><div class="notice error">设置加载失败：未找到 agent-team-board，请先初始化 <button id="retryBroken">重试</button></div><p class="muted">缺陷：整页被错误替换，迁移入口不可达。</p></section>';document.querySelector('#retryBroken').onclick=render;return;}
const contents={legacy:'<p>检测到旧布局：<code>docs/agent-team-board/</code></p><button class="primary" id="migrate">一键迁移到新布局</button>',modern:'<div class="notice success">已是新布局：data/ 用户数据 + runtime/ 应用数据</div><p><button disabled>已是新布局</button></p>',empty:'<div class="notice">未检测到看板数据：请用「初始化项目」新建。</div><p><button disabled>无可迁移数据</button></p>',loading:'<div class="notice">正在检测数据布局…</div><p><button disabled>检测中</button> <button id="resolve">模拟检测完成</button></p>',error:'<div class="notice error">布局检测失败：示例目录读取失败 <button id="retry">重试检测</button></div>',failed:'<div class="notice error">迁移失败：示例文件权限不足。可重试；已完成部分不应重复执行。</div><p><button id="migrate">重试迁移</button></p>',busy:'<div class="notice" role="status">正在迁移…</div><p><button disabled>迁移中</button></p>'};
view.innerHTML='<section><h2>数据布局迁移</h2><p class="muted">用户数据进入 data/ 随 Git 提交；应用数据进入 runtime/ 本地留存。</p>'+contents[s]+'</section><section><h2>其他设置</h2><div class="notice error">当前项目的派发设置暂不可用；迁移入口仍可操作。</div><p class="muted">演示保留局部错误，便于验证不同分区互不阻断。</p></section>';
const migrate=document.querySelector('#migrate');if(migrate)migrate.onclick=()=>dialog.showModal();for(const id of ['retry','resolve']){const b=document.getElementById(id);if(b)b.onclick=()=>{scenario.value='legacy';render();};}}
mode.onchange=render;scenario.onchange=render;document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#start').onclick=()=>{dialog.close();if(![...scenario.options].some(o=>o.value==='busy'))scenario.add(new Option('加载：迁移中','busy'));scenario.value='busy';render();timer=setTimeout(()=>{scenario.value=document.querySelector('#fail').checked?'failed':'modern';render();},1100);};render();
</script></html>
