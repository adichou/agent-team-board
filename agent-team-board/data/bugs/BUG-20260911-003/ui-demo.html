<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUG-20260911-003 新建发布入口演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e141e;color:#e6edf8;font:16px system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:24px}p{color:#9baac0;line-height:1.7}button,select,input{font:inherit;border:1px solid #354258;border-radius:8px;padding:11px;background:#1b2534;color:inherit}button{cursor:pointer}button.primary{background:#367cf3;color:white}button:disabled{opacity:.45;cursor:default}.controls,.toolbar,footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.controls{padding:16px;background:#182230;border-radius:10px;margin:20px 0}.toolbar .primary{margin-left:auto}.card{background:#172130;border:1px solid #354258;border-radius:14px;padding:44px;text-align:center;margin-top:22px}.card h2{font-size:23px}#notice{min-height:36px;padding-top:10px;color:#a8c7ff}.mask{position:fixed;inset:0;background:#0008}.panel{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:#172130;padding:25px;display:flex;flex-direction:column;box-shadow:0 0 35px #0008}.head{display:flex;justify-content:space-between;align-items:center}label{display:block;margin:16px 0}label select,label input{display:block;width:100%;margin-top:8px}footer{margin-top:auto}#feedback{padding:12px 0;color:#a8c7ff} [hidden]{display:none!important}
</style><main><h1>发布 · 新建入口对照</h1><p>BUG-20260911-003 · 本地交互演示，所有数据与预检结果均为模拟。</p><div class="controls"><label>入口行为<select id="mode"><option value="fixed">期望修复</option><option value="broken">缺陷现象</option></select></label><label>页面状态<select id="phase"><option value="empty">空</option><option value="normal">正常有记录</option><option value="loading">加载中</option><option value="error">读取失败</option></select></label></div><div id="page"></div><div id="notice" role="status" aria-live="polite"></div></main>
<div id="mask" class="mask" hidden></div><aside id="panel" class="panel" role="dialog" aria-modal="true" aria-label="新建发布" hidden><div class="head"><h2>新建发布</h2><button id="close" aria-label="关闭新建发布">✕</button></div><label>目标类型<select id="target"><option>Git 远端</option><option>Apple App Store</option><option>桌面应用（Electron）</option><option disabled>网站（首期未开放）</option></select></label><label id="fieldLabel">目标分支<input value="main"></label><label>预检模拟结果<select id="outcome"><option value="ok">成功</option><option value="fail">失败</option></select></label><div id="feedback" role="status" aria-live="polite">尚未预检</div><footer><button id="save">保存草稿</button><button id="check">预检</button><button id="start" class="primary" disabled>启动发布</button></footer></aside>
<script>
const $=id=>document.getElementById(id);let timer,lastEntry;
function render(){const phase=$('phase').value;$('notice').textContent='';$('page').innerHTML=phase==='loading'?'<div class="card" role="status">加载中…（可用上方状态选择切换）</div>':phase==='error'?'<div class="card" role="alert">发布模块读取失败：模拟网络异常<p><button id="retry">重试</button></p></div>':'<div class="toolbar"><select aria-label="目标筛选"><option>桌面应用（Electron）</option><option>全部目标</option></select><select aria-label="状态筛选"><option>全部状态</option><option>草稿</option></select><button class="primary" id="top">＋ 新建发布</button></div>'+(phase==='empty'?'<div class="card"><h2>还没有发布运行</h2><p>预检 → 计划确认 → 执行 → 结果核验</p><button class="primary" id="empty">＋ 新建发布</button></div>':'<div class="card"><h2>桌面应用 0.3.0 · 示例草稿</h2><p>尚未启动发布</p></div>');$('top')?.addEventListener('click',open);$('empty')?.addEventListener('click',e=>{if($('mode').value==='broken'){$('notice').textContent='缺陷模拟：内容区点击未打开面板。可对比右上角入口。';return}open(e)});$('retry')?.addEventListener('click',()=>{$('phase').value='empty';render()})}
function open(e){lastEntry=e.currentTarget;$('panel').hidden=$('mask').hidden=false;$('target').selectedIndex=0;fields();$('feedback').textContent='尚未预检';$('start').disabled=true;$('close').focus()}
function close(){clearTimeout(timer);$('panel').hidden=$('mask').hidden=true;$('check').disabled=$('save').disabled=false;lastEntry?.focus()}
function fields(){$('fieldLabel').innerHTML=$('target').selectedIndex===0?'目标分支<input value="main">':$('target').selectedIndex===1?'版本号（示意）<input value="1.0.0">':'版本号（示意）<input value="0.3.0">';$('start').disabled=true;$('feedback').textContent='尚未预检'}
$('phase').onchange=()=>{close();render()};$('mode').onchange=()=>{close();render()};$('close').onclick=$('mask').onclick=close;$('target').onchange=fields;$('outcome').onchange=()=>{$('start').disabled=true};$('save').onclick=()=>{$('feedback').textContent='模拟：草稿已保存，不执行真实写入'};$('check').onclick=()=>{$('check').disabled=$('save').disabled=true;$('start').disabled=true;$('feedback').textContent='预检中…';timer=setTimeout(()=>{const ok=$('outcome').value==='ok';$('feedback').textContent=ok?'模拟预检通过；启动前仍需确认计划。':'模拟预检失败：环境配置不完整。修正后可重新预检。';$('check').disabled=$('save').disabled=false;$('start').disabled=!ok},700)};$('start').onclick=()=>{$('feedback').textContent='模拟：进入计划确认步骤；本演示不会执行发布。'};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></html>
