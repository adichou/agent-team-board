<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUG-20260921-003 合并点击反馈演示</title><style>
:root{font:15px system-ui;color:#203047;background:#f1f4fa}body{max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:24px}p{line-height:1.7}.tools,article,aside{background:white;padding:20px;border:1px solid #d7dfea;border-radius:14px}.tools{display:flex;gap:14px;flex-wrap:wrap}label{display:grid;gap:6px}select,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #b7c4d8}button{cursor:pointer;background:#275fca;color:white}button[aria-disabled=true]{opacity:.65}main{display:grid;grid-template-columns:260px 1fr;gap:20px;margin:20px 0}nav{color:#69778c;line-height:2}strong{color:#275fca}#notice{background:#e4edff;border-radius:8px;padding:14px;min-height:24px}dialog{max-width:440px;border:1px solid #b7c4d8;border-radius:16px;padding:28px}dialog::backdrop{background:#10243d88}.muted{color:#69778c}.hint{background:#fff3dc;padding:12px;border-radius:8px}@media(max-width:700px){main{grid-template-columns:1fr}}
</style><h1>合并入 main · 点击反馈</h1><p class="muted">BUG-20260921-003 · 复报现象为示意，根因待确认。所有数据和执行均为模拟。</p><section class="tools">
<label>对照模式<select id="mode"><option value="fixed">期望修复后</option><option value="bug">复报现象示意</option></select></label>
<label>页面状态<select id="page"><option value="normal">正常</option><option value="empty">空列表</option><option value="loading">加载中</option><option value="error">读取失败</option></select></label>
<label>合并条件<select id="gate"><option value="">可合并</option><option>文档尚未提交，请先完成文档步骤</option><option>当前分支 main，不在 dev，请切回 dev</option><option>合并中，请勿重复触发</option><option>已正式发布，不可再合并</option><option>未找到该版本，请刷新列表</option><option>无关联条目，请先关联条目与提交</option></select></label>
<label>模拟执行结果<select id="result"><option value="ok">成功</option><option value="fail">失败</option></select></label></section>
<main id="main"></main><div id="notice" role="status" aria-live="polite">请选择场景并点击合并入口。</div>
<dialog id="confirm"><h2>确认合并入 main</h2><p>版本：演示版本 · DEMO-001</p><p>模拟提交 abc1234，将合并所选条目与文档提交。</p><button id="cancel">取消</button> <button id="go">确认合并</button></dialog>
<script>
const $=id=>document.getElementById(id);let busy=false,token=0;const say=t=>$('notice').textContent=t;
function draw(){const p=$('page').value;let content='';if(p==='empty')content='<h2>暂无版本计划</h2><p>创建版本计划后关联条目。</p><button id="restore">载入演示版本</button>';else if(p==='loading')content='<h2 role="status">正在加载合并分析…</h2><button id="restore">模拟加载完成</button>';else if(p==='error')content='<h2>合并分析读取失败</h2><p>模拟网络异常，请重试。</p><button id="restore">重试</button>';else content='<aside><h2>演示版本</h2><p>DEMO-001 · 草稿</p><p>1 个模拟条目</p><button class="merge">合并入 main</button></aside><article><nav>版本计划 → 关联条目 → 文档编写 → <strong>合并入 main</strong> → 正式发布</nav><h2>合并详情</h2><p>发布范围：模拟条目 / abc1234</p><p>隔离分析：模拟通过</p><p class="hint" id="reason"></p><button class="merge">合并入 main</button></article>';$('main').innerHTML=content;if($('reason'))$('reason').textContent=$('gate').value||'当前分支 dev，文档已提交，可进行合并确认。';document.querySelectorAll('.merge').forEach(b=>{b.setAttribute('aria-disabled',String(!!$('gate').value||busy));b.title=$('gate').value||'打开合并确认';b.onclick=()=>{if($('mode').value==='bug')return;if(busy)return say('合并中，请勿重复触发');if($('gate').value)return say($('gate').value);$('confirm').showModal();say('已打开合并确认，请核对版本。');};});if($('restore'))$('restore').onclick=()=>{$('page').value='normal';draw();say('已重新加载演示版本。');};}
['mode','page','gate','result'].forEach(id=>$(id).onchange=()=>{token++;busy=false;$('confirm').close();draw();say($('mode').value==='bug'?'现象示意：点击合并入口后无反馈（非根因断言）。':'场景已切换，请点击合并入口。');});$('cancel').onclick=()=>{$('confirm').close();say('已取消，未执行合并。');};$('confirm').addEventListener('cancel',()=>say('已取消，未执行合并。'));$('go').onclick=()=>{if(busy)return;busy=true;$('confirm').close();say('正在合并…请稍候（模拟）');draw();const current=++token;setTimeout(()=>{if(current!==token)return;busy=false;draw();say($('result').value==='ok'?'✓ 已合并入 main（模拟成功，未执行 Git）':'合并失败：模拟冲突。请处理后重新点击合并重试。');},1000);};draw();
</script></html>
