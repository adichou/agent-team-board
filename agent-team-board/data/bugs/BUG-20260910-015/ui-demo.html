<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全局任务头部布局演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f8;color:#172235;font:14px system-ui}button,input,select{font:inherit;padding:8px;border:1px solid #a8b5c8;border-radius:6px}button{cursor:pointer;background:#fff;color:inherit}nav{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}aside{width:min(560px,92vw);margin:20px auto;background:white;border:1px solid #bac6d5;box-shadow:0 8px 35px #1c325322;border-radius:10px;overflow:hidden}aside.narrow{width:min(320px,92vw)}header{padding:16px;border-bottom:1px solid #d4dce7}h2{margin:0;font-size:19px}.title{display:flex;justify-content:space-between;align-items:center}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}.scope{color:#64748b;font-size:13px;margin:0}.row input{flex:1;min-width:180px;width:0}.old .row{display:block}.old input{width:100%;margin-top:22px}.old .scope{margin-top:6px}main{padding:16px;min-height:230px}.card{padding:16px;background:#eef4ff;border:1px solid #bfd0ec;border-radius:8px;margin:10px 0}.muted{color:#64748b}.skeleton{height:48px;background:#e4eaf2;border-radius:7px;margin:10px 0}.error{background:#fff0e9;padding:14px;color:#9b3913}input:focus,button:focus-visible{outline:2px solid #3678e0;outline-offset:2px}[hidden]{display:none!important}
</style><nav><strong>文档演示 · 虚构数据</strong><label>布局 <select id="mode"><option value="new">期望布局</option><option value="old">缺陷布局</option></select></label><label>状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><label><input type="checkbox" id="narrow">窄屏</label><button id="open">重新打开</button></nav><aside id="panel"><header><div class="title"><h2>全局任务</h2><button id="close" aria-label="关闭全局任务">✕</button></div><div class="row"><p class="scope" id="scope" title="全部注册项目的批量任务，不随顶栏项目选择变化">跨项目批量任务</p><input id="search" type="search" placeholder="搜项目 / 批次号 / 条目编号…" aria-label="搜索全局任务（跨项目）"></div></header><main id="body" aria-live="polite"></main></aside><script>
const panel=document.querySelector('#panel'),search=document.querySelector('#search'),body=document.querySelector('#body'),state=document.querySelector('#state');const data=['演示项目 A · RFB-DEMO-001 · BUG-DEMO-001 · 执行中','演示项目 B · RFB-DEMO-002 · REQ-DEMO-002 · 待启动'];
function render(){body.replaceChildren();if(state.value==='loading'){body.innerHTML='<p>正在加载全局任务…</p><div class="skeleton"></div><div class="skeleton"></div>';return}if(state.value==='error'){body.innerHTML='<div class="error">全局任务加载失败。正在随轮询自动重试；也可刷新页面重试。</div><p class="muted">演示可切回正常状态模拟恢复。</p>';return}if(state.value==='empty'){body.innerHTML='<p>当前没有批量任务</p>';return}const items=data.filter(x=>x.toLowerCase().includes(search.value.trim().toLowerCase()));const label=document.createElement('p');label.textContent=items.length?'示例任务 '+items.length+' 项':'没有匹配结果，请修改或清空搜索词。';body.append(label);items.forEach(x=>{const el=document.createElement('div');el.className='card';el.textContent=x;body.append(el)})}
document.querySelector('#mode').onchange=e=>{panel.classList.toggle('old',e.target.value==='old');document.querySelector('#scope').textContent=e.target.value==='old'?'跨项目：全部注册项目的批量任务，不随顶栏项目选择变化':'跨项目批量任务'};document.querySelector('#narrow').onchange=e=>panel.classList.toggle('narrow',e.target.checked);document.querySelector('#close').onclick=()=>{panel.hidden=true;document.querySelector('#open').focus()};document.querySelector('#open').onclick=()=>{panel.hidden=false;search.focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.hidden=true;document.querySelector('#open').focus()}});state.onchange=render;search.oninput=render;render();
</script></html>
