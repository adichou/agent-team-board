<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>批量 Commit 界面演示</title><style>body{font:16px system-ui;background:#eef2f7;color:#172338;margin:0;padding:30px}main{max-width:960px;margin:auto}section,header{background:white;border:1px solid #cdd5e0;border-radius:12px;padding:22px;margin:16px 0}button,select{font:inherit;padding:9px;margin:5px;border:1px solid #8799b1;border-radius:7px;background:#f8faff}button{cursor:pointer}button:disabled{opacity:.45}small{color:#586880}code{overflow-wrap:anywhere}#feedback{min-height:28px;color:#18559b}.row{padding:16px 0;border-bottom:1px solid #ddd}.badge{background:#e1f4e9;padding:5px;border-radius:5px}input{width:95%;padding:9px}h1{font-size:24px}</style><main><h1>批量 Commit · 界面展示</h1><p>模拟数据，仅演示交互，不执行 Git。</p><header><label>对照 <select id="mode"><option value="fixed">期望修复后</option value="broken">缺陷现象</option></select></label><label>场景 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><br><button onclick="page='tasks';render()">任务</button><button onclick="page='items';render()">需求 · 已完成</button></header><section id="content"></section><p id="feedback" role="status" aria-live="polite"></p></main><script>
let page='tasks',done=false,running=false;const hashes=['8c57c69a21567b187d83aad6ae37312678f122ad','20edaa986cac548b38d91ecdc7dd826b9f370256'];const content=document.querySelector('#content'),feedback=document.querySelector('#feedback'),mode=document.querySelector('#mode'),state=document.querySelector('#state');mode.onchange=state.onchange=()=>{feedback.textContent='';render()};
function copies(){return hashes.map(h=>`<div class="row"><code>${h.slice(0,10)}</code><button onclick="copy('${h}')">复制完整提交号</button><input readonly aria-label="完整提交号" value="${h}"></div>`).join('')}
async function copy(h){try{await navigator.clipboard.writeText(h);feedback.textContent='已复制完整提交号'}catch(e){feedback.textContent='无法访问剪贴板，请选择下方完整提交号手动复制'}}
function render(){let broken=mode.value==='broken',s=state.value;content.innerHTML='<h2>'+ (page==='tasks'?'任务':'已完成需求')+'</h2>';if(broken){content.innerHTML+=page==='tasks'?'<button>批量完善</button><button>批量开发</button><p>缺陷：无批量 Commit 类型与入口。</p>':'<div class="row">REQ-DEMO-001 已完成 · 无提交状态及复制入口</div>';return}if(page==='tasks')content.innerHTML+='<button disabled>批量完善</button><button disabled>批量开发</button><button aria-pressed="true">批量 Commit</button>';if(s==='loading'){content.innerHTML+='<p role="status">正在加载提交状态…</p><button disabled>创建批量 Commit</button>';return}if(s==='empty'){content.innerHTML+='<p>'+(page==='tasks'?'当前项目暂无可提交的已完成条目':'暂无已完成需求')+'</p><button disabled>创建批量 Commit</button>';return}if(s==='error'){content.innerHTML+='<p role="alert">提交状态加载失败，请重试。已有成功记录保留。</p><button onclick="state.value=\'normal\';render()">重试读取</button><details><summary>上次成功记录 · 示例</summary>'+copies()+'</details>';return}if(page==='tasks'){content.innerHTML+=`<h3>${running?'模拟批次 · 执行中':done?'模拟批次 · 已完成':'准备创建任务'}</h3><p>${running?'当前条目 REQ-DEMO-001 · 0/1':done?'1/1 · 成功 1 · 失败 0':'候选 1 项 · 默认仅已完成条目'}</p><button onclick="start()" ${running?'disabled':''}>创建模拟任务</button><p><small>实际产品由人工创建并复制提示词派发，浏览页面不执行提交。</small></p>${done?'<details open><summary>REQ-DEMO-001 · 已提交</summary>'+copies()+'</details>':''}`}else{content.innerHTML+=`<div class="row">REQ-DEMO-001 · 已完成 <span class="badge">${done?'已提交':'未提交'}</span>${done?'<details><summary>查看 2 个提交号</summary>'+copies()+'</details>':''}</div><div class="row">REQ-DEMO-002 · 已完成 <span>未提交</span></div>`}}
function start(){if(running)return;running=true;done=false;render();feedback.textContent='模拟已派发，正在执行…';setTimeout(()=>{running=false;done=true;render();feedback.textContent='模拟成功回执已核验，可切换需求页查看并复制提交号'},900)}render();
</script></html>
