<style>

    --submitted: #64748b; --accepted: #2563eb; --inprogress: #d97706;
    --ok-bg: #ecfdf5; --ok-text: #047857; --info-bg: #eff6ff; --info-text: #1d4ed8;
    --shot-bg: #0e131b; --demo-bar: #101827; --demo-bar-text: #dbe4f3;

  }
  html[data-theme="dark"] {
    --bg: #0e131b; --panel: #161d29; --text: #e5eaf3; --muted: #8b98ad;
    --border: #263041; --primary: #3b82f6; --chip-bug: #fb7185; --chip-req: #818cf8;
    --submitted: #94a3b8; --accepted: #60a5fa; --inprogress: #fbbf24;
    --ok-bg: #052e1c; --ok-text: #6ee7b7; --info-bg: #0b1d3a; --info-text: #93c5fd;
    --demo-bar: #0a0f17; --demo-bar-text: #c8d3e6;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }

  html, body { margin: 0; height: 100%; }
  body {

    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  code { background: rgba(127,140,170,.15); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  /* ================= 演示控制条（非看板本体） ================= */
  .demo-bar {
    flex: none; background: var(--demo-bar); color: var(--demo-bar-text);
    padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,.12); z-index: 50;
  }
  .demo-bar .demo-title { font-weight: 650; font-size: 13px; }
  .demo-bar .demo-title span { font-weight: 400; opacity: .75; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
  .seg button {

  .seg button.on { background: var(--primary); color: #fff; }
  .demo-bar select {
    height: 26px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25);
    background: transparent; color: inherit; font-size: 12px; padding: 0 4px; cursor: pointer;
  }
  .demo-bar select option { color: #1b2434; }
  .demo-note { font-size: 11px; opacity: .7; }
  .log-toggle { margin-left: auto; }

  /* ================= 看板模拟（复刻 scripts/web 口径） ================= */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 8px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 30px; height: 30px; display: grid; place-items: center; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, #4f46e5, #0ea5e9); border-radius: 8px; position: relative;
  }
  .logo i { position: absolute; top: -4px; right: -5px; font-size: 10px; font-style: normal; color: #16a34a; background: var(--panel); border-radius: 50%; padding: 1px; line-height: 1; }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 650; }

  .btn {

  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .module-nav { display: flex; gap: 6px; padding: 8px 18px 0; flex: none; }
  .view-tab {
    appearance: none; border: none; background: transparent; color: var(--muted);
    border-radius: 99px; padding: 4px 14px; font-size: 13px; cursor: pointer;

  .view-tab.active { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary); font-weight: 600; }
  .page-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 18px 10px; flex: none; }
  .module-sub { margin: 0; color: var(--muted); font-size: 12px; }
  .search {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 99px; padding: 0 10px; height: 28px; min-width: 180px;

  .search input { border: none; outline: none; background: transparent; color: var(--text); font-size: 12.5px; width: 100%; }
  .filter-bar { display: flex; gap: 6px; padding: 0 18px 10px; flex: none; flex-wrap: wrap; }
  .chip {
    appearance: none; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 99px; padding: 3px 12px; font-size: 12px; cursor: pointer;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .req-view { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .req-split {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 460px);
    gap: 14px; padding: 14px 18px 24px; align-items: stretch;
  }
  .req-list-wrap {
    min-width: 0; min-height: 0; display: flex; flex-direction: column;

  .req-caption { display: flex; flex-direction: column; gap: 6px; padding: 2px 4px 8px; border-bottom: 1px solid var(--border); flex: none; }
  .caption-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
  .sort-select { height: 24px; padding: 0 4px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .req-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
  .req-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--panel); cursor: pointer; font-size: 12.5px;
  }
  .req-row:hover { border-color: var(--primary); }
  .req-row.picked { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .req-row .kind { font-weight: 650; font-size: 11px; border-radius: 6px; padding: 1px 6px; color: #fff; flex: none; }
  .req-row .kind.bug { background: var(--chip-bug); }
  .req-row .kind.req { background: var(--chip-req); }
  .req-row .rid { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); flex: none; }
  .req-row .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .state-dot.s-submitted { background: var(--submitted); }
  .state-dot.s-accepted { background: var(--accepted); }
  .state-dot.s-in-progress { background: var(--inprogress); }

  /* 抽屉（宽屏静态右栏；口径同 .req-split > .drawer） */
  .drawer {
    position: static; width: auto; box-shadow: none; z-index: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .drawer-head { padding: 14px 18px 10px; border-bottom: 1px solid var(--border); flex: none; }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-top .kind { font-weight: 650; font-size: 11px; border-radius: 6px; padding: 1px 6px; color: #fff; background: var(--chip-bug); flex: none; }
  .card-top .rid { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .icon-btn {
    appearance: none; border: none; background: transparent; color: var(--muted); cursor: pointer;
    border-radius: 6px; padding: 2px 6px; font-size: 14px; line-height: 1;
  }
  .icon-btn:hover { background: rgba(127,140,170,.15); color: var(--text); }
  .drawer-head h2 { margin: 6px 0 0; font-size: 15.5px; word-break: break-word; }
  .drawer-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 10px 18px; border-bottom: 1px solid var(--border); flex: none; }
  .tab {
    appearance: none; border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 99px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  /* 口径同 style.css .drawer-body：无拉伸约束，内容多高占多高 → 不足一屏时下方留白 */
  .drawer-body { padding: 14px 18px 26px; overflow-y: auto; }
  .drawer-empty { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
  .meta-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px;
    background: rgba(127,140,170,.07); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 12px;
  }
  .meta-grid label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .meta-grid span { font-size: 12.5px; word-break: break-all; }
  .notice { border-radius: 9px; padding: 9px 12px; font-size: 12.5px; margin: 10px 0; }
  .notice.info { background: var(--info-bg); color: var(--info-text); }
  .drawer-actions { display: flex; gap: 10px; margin: 4px 0 14px; align-items: center; }
  .drawer-actions .pos { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* markdown 文档框（#docView.md 口径） */
  .md { border: 1px solid var(--border); border-radius: 10px; padding: 4px 18px; font-size: 13.5px; overflow-wrap: break-word; }
  .md h1 { font-size: 17px; margin: 16px 0 8px; }
  .md h2 { font-size: 15px; margin: 16px 0 6px; }
  .md ul { padding-left: 20px; margin: 6px 0; }
  .md ol { padding-left: 20px; margin: 6px 0; }
  .md p { margin: 8px 0; }

  /* ★ 核心：内联截图 .doc-shot —— 现状（缺陷）260px 上限 vs 期望（示意）放宽 */
  .doc-shot {
    max-width: min(420px, 100%);
    max-height: 260px;                 /* 现状口径：scripts/web/style.css .doc-shot */
    border: 1px solid var(--border); border-radius: 8px;
    object-fit: contain; cursor: zoom-in; background: var(--shot-bg);
    display: block; margin: 8px 0 4px;
  }
  body.expect .doc-shot {
    max-height: min(58vh, 640px);      /* 期望示意：按可用高度显著放大；最终口径以 design.md 为准 */
  }
  .shot-fail { color: var(--muted); font-size: 12px; margin: 8px 0; }
  .dead-note {
    border: 1.5px dashed color-mix(in srgb, var(--inprogress) 55%, transparent);
    border-radius: 10px; color: var(--muted); font-size: 12px;
    padding: 10px 12px; margin-top: 10px;
  }
  body.expect .dead-note.now-only { display: none; }
  body:not(.expect) .dead-note.expect-only { display: none; }
  .dead-note b { color: var(--inprogress); }

  /* 遮罩与放大层 */
  .mask { position: absolute; inset: 0; background: var(--scrim); z-index: 19; }
  .hidden { display: none !important; }
  .lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(6, 10, 18, .82);
    display: grid; place-items: center; cursor: zoom-out;
  }
  .lightbox img, .lightbox svg { max-width: 94vw; max-height: 94vh; border-radius: 10px; }
  .lightbox .doc-shot { max-width: 94vw; max-height: 94vh; } /* 放大层不受缩略上限约束 */

  /* 窄屏模拟（复刻 @media (max-width:1020px)：单列 + 覆盖式抽屉） */
  body.narrow .req-split { grid-template-columns: minmax(0, 1fr); padding: 10px 12px 20px; }
  body.narrow .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
    z-index: 20; border-radius: 12px 0 0 12px; border-right: none;
    box-shadow: -8px 0 30px rgba(10,16,26,.25);
    transform: translateX(100%); transition: transform .18s ease;
  }
  body.narrow .drawer.has-item { transform: none; }
  body.narrow .req-list-wrap { width: auto; }

  /* 操作日志 */
  .log-panel {
    position: fixed; right: 12px; bottom: 12px; z-index: 70; width: 320px; max-width: calc(100vw - 24px);
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); font-size: 12px;
  }
  .log-panel header { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .log-panel ol { margin: 0; padding: 8px 12px 10px 30px; max-height: 160px; overflow-y: auto; color: var(--muted); }
  .log-panel li { margin: 2px 0; }
  .log-panel li b { color: var(--text); font-weight: 500; }
  .log-panel.collapsed ol { display: none; }
</style>
</head>

      '<rect x="250" y="432" width="280" height="12" rx="6" fill="#232e42"/>' +
      /* 右列详情抽屉 */
      '<rect x="686" y="180" width="484" height="840" rx="14" fill="#161d29" stroke="#263041"/>' +

      /* 现状：被压到 ≤260px 的内联截图 */
      '<rect x="726" y="470" width="221" height="260" rx="8" fill="#0e131b" stroke="#263041"/>' +

  }

  function mdDocHtml() {
    var head =
      '<h1>BUG-20260909-018 单详情也太矮了，请优化</h1>' +
      '<ul>' +
      '<li>状态：submitted（待人工接受）</li>' +
      '<li>归属：独立 Bug（引入来源见 design.md）</li>' +
      '<li>创建：2026-09-09T15:51:08.868Z</li>' +
      '</ul><h2>现象</h2>';
    var tail =
      '<h2>复现步骤</h2><ol><li>（略，见 README）</li></ol>' +
      '<h2>期望行为</h2><p>（略，见 README）</p>';
    var shot = '';
    if (state.docState === 'normal') {
      shot = shotSvg();
    } else if (state.docState === 'fail') {
      shot = '<p class="shot-fail">截图 paste-1788969043935.png 无法加载（文件可能被移动、删除或超过 8MB 上限）</p>';
    }
    var note = state.docState === 'normal' || state.docState === 'noshot'
      ? '<div class="dead-note now-only"><b>现状缺陷标注：</b>文档框底边以下即纯空白面板——附件实测约 360px（视口 1402px 的约 1/4）；截图同时被压至 ≤260px，"上面挤、下面空"即「单详情太矮」。</div>' +
        '<div class="dead-note expect-only"><b>期望（示意）：</b>截图默认显著放大、内容区高度利用充分，不再出现大段空白；具体口径以开发阶段 design.md 为准。</div>'
      : '';
    return head + shot + tail + note;
  }

  function renderDrawer() {
    var d = $('#drawer');
    if (!state.open) {
      d.classList.remove('has-item');
      d.innerHTML = '<div class="drawer-empty muted">选择左侧列表中的条目查看详情</div>';
      $('#mask').classList.add('hidden');
      return;
    }
    d.classList.add('has-item');
    $('#mask').classList.toggle('hidden', state.form !== 'narrow');
    var tabs = [
      ['info', '基本信息'], ['doc', '说明'], ['design', '设计'], ['cases', '测试用例'], ['disc', '讨论纪要']
    ];
    d.innerHTML =
      '<header class="drawer-head">' +
        '<div class="card-top"><span class="kind">BUG</span><span class="rid">BUG-20260909-018</span>' +
        '<button type="button" class="icon-btn" id="dClose" title="关闭" aria-label="关闭">✕</button></div>' +
        '<h2>单详情也太矮了，请优化</h2>' +
      '</header>' +
      '<nav class="drawer-tabs" role="tablist" aria-label="详情分页">' +
        tabs.map(function (t) {
          return '<button type="button" class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
        }).join('') +
      '</nav>' +
      '<div class="drawer-body">' +
        '<section class="pane"' + (state.tab === 'info' ? '' : ' style="display:none"') + '>' +
          '<section class="meta-grid">' +
            '<div><label>状态</label><span>待接受</span></div><div><label>类型</label><span>Bug</span></div><div><label>归属</label><span>独立 Bug</span></div>' +
            '<div><label>认领者</label><span>—</span></div><div><label>创建</label><span>2026-09-09</span></div><div><label>更新</label><span>2026-09-09</span></div>' +
          '</section>' +
          '<div class="notice info">未入计划。可点「移入计划」排入开发计划，或在 ZCode 会话运行 <code>/dev BUG-20260909-018</code> 让 Agent 直接认领。</div>' +
          '<div class="drawer-actions"><button type="button" class="btn primary">✓ 接受</button><button type="button" class="btn">✎ 修改</button><button type="button" class="btn" style="color:var(--chip-bug);">🗑 删除</button><span class="pos">1 / 3</span></div>' +
        '</section>' +
        '<section class="pane"' + (state.tab === 'doc' ? '' : ' style="display:none"') + '>' +
          (state.tab === 'doc' ? docPaneHtml() : '') +
        '</section>' +
        '<section class="pane"' + ((state.tab === 'design' || state.tab === 'cases') ? '' : ' style="display:none"') + '>' +
          '<article class="md"><p class="muted">尚未创建，开发阶段补充。</p></article>' +
        '</section>' +
        '<section class="pane"' + (state.tab === 'disc' ? '' : ' style="display:none"') + '>' +
          '<p class="muted small">（演示聚焦说明页签，讨论纪要仅占位）</p>' +
        '</section>' +
      '</div>';

    $('#dClose').addEventListener('click', function () { closeDrawer('✕'); });
    Array.prototype.forEach.call(d.querySelectorAll('.tab'), function (b) {
      b.addEventListener('click', function () {
        state.tab = b.dataset.tab;
        log('切换页签 →「' + b.textContent + '」' + (b.dataset.tab === 'design' || b.dataset.tab === 'cases' ? '（文档未创建空态）' : ''));
        renderDrawer();
      });
    });
    var shot = d.querySelector('.doc-shot');
    if (shot) shot.addEventListener('click', openLightbox);
  }

  function docPaneHtml() {
    if (state.docState === 'loading') {
      return '<p class="muted" style="padding:8px 2px;">加载中…</p>';
    }
    return '<article id="docView" class="md">' + mdDocHtml() + '</article>';
  }

  function openDrawer(id) {
    state.open = true;
    state.pickId = id;
    state.tab = 'doc';
    Array.prototype.forEach.call(document.querySelectorAll('.req-row'), function (r) {
      r.classList.toggle('picked', r.dataset.id === id);
    });
    log('打开详情：<b>' + id + '</b>（经「加载中…」过渡）');
    renderDrawer();
  }
  function closeDrawer(via) {
    state.open = false;
    log('关闭详情（' + via + '）');
    renderDrawer();
  }
  function openLightbox() {
    var lb = $('#lightbox');
    lb.innerHTML = shotSvg('shotBig');
    lb.classList.remove('hidden');
    log('截图点击 → lightbox 放大（#oncallLightbox 通道；点击任意处 / Esc 关闭）');
  }
  function closeLightbox() {
    var lb = $('#lightbox');
    if (!lb.classList.contains('hidden')) {
      lb.classList.add('hidden');
      log('lightbox 关闭');
    }
  }

  /* 控制条 */
  function setSeg(onId, offId, fn) {
    $(onId).classList.add('on'); $(offId).classList.remove('on'); fn();
  }
  $('#modeNow').addEventListener('click', function () { setSeg('#modeNow', '#modeExpect', function () { state.mode = 'now'; document.body.classList.remove('expect'); log('模式 → 现状（缺陷）：.doc-shot max-height 260px，内容区下方留白'); }); });
  $('#modeExpect').addEventListener('click', function () { setSeg('#modeExpect', '#modeNow', function () { state.mode = 'expect'; document.body.classList.add('expect'); log('模式 → 期望（示意）：截图按可用高度放大，空白收敛（最终口径以 design.md 为准）'); }); });
  $('#formWide').addEventListener('click', function () { setSeg('#formWide', '#formNarrow', function () { state.form = 'wide'; document.body.classList.remove('narrow'); log('形态 → 宽屏分栏（>1020px，抽屉为常驻右栏）'); renderDrawer(); }); });
  $('#formNarrow').addEventListener('click', function () { setSeg('#formNarrow', '#formWide', function () { state.form = 'narrow'; document.body.classList.add('narrow'); log('形态 → 窄屏覆盖（≤1020px，抽屉滑入 + 遮罩）'); renderDrawer(); }); });
  $('#themeDark').addEventListener('click', function () { setSeg('#themeDark', '#themeLight', function () { state.theme = 'dark'; document.documentElement.dataset.theme = 'dark'; log('主题 → 深色'); }); });
  $('#themeLight').addEventListener('click', function () { setSeg('#themeLight', '#themeDark', function () { state.theme = 'light'; document.documentElement.dataset.theme = 'light'; log('主题 → 浅色'); }); });

  $('#docState').addEventListener('change', function (e) {
    state.docState = e.target.value;
    var label = { normal: '正常（README 渲染 + 内联竖版截图）', noshot: '无截图（纯文字 README）', fail: '截图加载失败（占位文案）', loading: '加载中（停留供观察）' }[state.docState];
    log('说明页签状态 → ' + label);
    if (state.open && state.tab !== 'doc') state.tab = 'doc';
    renderDrawer();
  });

  $('#logToggle').addEventListener('click', function () {
    var p = $('#logPanel');
    p.classList.toggle('collapsed');
    this.textContent = p.classList.contains('collapsed') ? '显示日志' : '隐藏日志';
  });

  /* 列表交互 + 搜索过滤 */
  Array.prototype.forEach.call(document.querySelectorAll('.req-row'), function (r) {
    r.addEventListener('click', function () { openDrawer(r.dataset.id); });
  });
  $('#q').addEventListener('input', function (e) {
    var q = e.target.value.trim();
    Array.prototype.forEach.call(document.querySelectorAll('.req-row'), function (r) {
      r.style.display = !q || r.textContent.indexOf(q) >= 0 ? '' : 'none';
    });
    log(q ? '搜索“' + q + '”过滤列表' : '清除搜索');
  });

  $('#mask').addEventListener('click', function () { closeDrawer('遮罩'); });
  $('#lightbox').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#lightbox').classList.contains('hidden')) closeLightbox();
    else if (state.open && state.form === 'narrow') closeDrawer('Escape');
  });

  /* 初始 */
  document.documentElement.dataset.theme = 'dark';
  log('演示就绪：默认「现状 + 宽屏 + 深色 + 正常态」');
  renderDrawer();
})();
</script>
