<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建截图双击预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#213047;font:16px system-ui}main{max-width:740px;margin:30px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin:16px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #b7c3d6;border-radius:7px}input,textarea{width:100%}button{cursor:pointer;background:#eaf0ff;color:#203d77}nav{display:flex;gap:8px;flex-wrap:wrap}#shots{display:flex;gap:12px;flex-wrap:wrap}.card{padding:10px;border:1px solid #cbd4e2;border-radius:9px;width:210px}.card img{width:100%;cursor:zoom-in}.card button{font-size:14px}small{display:block;color:#617187;margin:8px 0}dialog{width:95vw;max-width:1100px;max-height:95vh;border:0;border-radius:12px;padding:18px}dialog::backdrop{background:#0d152ad9}header{display:flex;align-items:center;justify-content:space-between;gap:12px}#filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#content{text-align:center;padding:18px}#content img{max-width:100%;max-height:70vh;object-fit:contain}#notice{padding:12px;background:#f0f4fa}h1{font-size:24px}</style>
<main><h1>新建条目 · 截图预览</h1><p>交互示意，截图为演示数据。请选择状态后双击缩略图。</p><nav id="states"><button data-mode="normal">正常</button><button data-mode="empty">空</button><button data-mode="loading">加载</button><button data-mode="error">失败</button></nav><p id="notice" role="status"></p><label>类型 <select id="kind"><option>需求</option><option>Bug</option><option>讨论</option></select></label><label>标题<input value="检查新建条目的截图"></label><label>描述<textarea>放大核对截图后继续填写。</textarea></label><section id="section"><h3>截图（可选）</h3><small>双击查看大图，或使用每张图片下方的按钮。</small><div id="shots"></div></section></main>
<dialog id="viewer" aria-label="截图大图预览"><header><strong id="filename"></strong><button id="close" autofocus>关闭</button></header><div id="content" aria-live="polite"></div></dialog>
<script>
const $=id=>document.getElementById(id);let mode='normal',active=0,trigger;const images=[0,1].map(i=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560"><rect width="960" height="560" fill="${i?'#ede9ff':'#e3f3ff'}"/><rect x="35" y="35" width="890" height="65" rx="10" fill="#233c65"/><text x="65" y="78" fill="white" font-size="25">Demo screenshot ${i+1}</text><rect x="35" y="130" width="260" height="390" rx="12" fill="white"/><rect x="325" y="130" width="600" height="180" rx="12" fill="white"/><text x="355" y="225" fill="#233c65" font-size="35">${i?'Different image':'Preview details'}</text></svg>`));let entries=[0,1];
function render(){$('notice').textContent='当前演示状态：'+({normal:'正常',empty:'无截图',loading:'图片加载中（手动完成）',error:'图片加载失败'}[mode]);$('shots').replaceChildren();if(!entries.length){$('shots').textContent='暂无截图，切换正常状态可添加示例图。';return}entries.forEach(i=>{const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.src=images[i];img.alt='示例截图 '+(i+1);const text=document.createElement('small');text.textContent='screen-'+(i+1)+'.png';const open=document.createElement('button');open.textContent='查看大图';open.onclick=()=>show(i,open);img.ondblclick=()=>show(i,open);const remove=document.createElement('button');remove.textContent='移除';remove.onclick=()=>{entries=entries.filter(x=>x!==i);render()};card.append(img,text,open,remove);$('shots').append(card)})}
function body(){const box=$('content');box.replaceChildren();if(mode==='loading'||mode==='error'){const p=document.createElement('p');p.textContent=mode==='loading'?'图片加载中…':'图片无法加载';const retry=document.createElement('button');retry.textContent=mode==='loading'?'模拟加载完成':'重试';retry.onclick=()=>{mode='normal';render();body()};box.append(p,retry)}else{const img=document.createElement('img');img.src=images[active];img.alt='放大示例截图 '+(active+1);box.append(img)}}
function show(i,button){active=i;trigger=button;$('filename').textContent='screen-'+(i+1)+'.png';body();$('viewer').showModal();$('close').focus()}
$('close').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>trigger?.focus());$('viewer').addEventListener('click',e=>{const r=$('viewer').getBoundingClientRect();if(e.target===$('viewer')&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))$('viewer').close()});$('states').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;entries=mode==='empty'?[]:[0,1];render()};$('kind').onchange=()=>{$('section').hidden=$('kind').value==='讨论'};render();
</script></html>
