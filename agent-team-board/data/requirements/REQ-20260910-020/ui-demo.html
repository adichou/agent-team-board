/* ---- 渲染 ---- */
function render(){persist();applyTheme();
  document.querySelectorAll('.module-nav .view-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
  $('#projSel').value=state.project;
  let html='';
  if(state.view!=='marketing'){html=`<div class="card"><p class="kv">此演示仅覆盖新增的「营销」模块；当前模块沿用现有看板界面（未在演示中实现）。</p>
    <button class="btn" data-action="host-tab" data-view="marketing" type="button">返回营销</button></div>`;}
  else{
    html+=mktTabsHtml();
    if(state.refreshing||state.mode==='loading')html+=skeletonHtml();
    else if(state.mode==='error')html+=`<div class="banner err" role="alert"><p>读取渠道与行动数据失败：experiments/exp-001/experiment.json 解析错误（演示）。</p><button class="btn" data-action="retry-read" type="button">重试</button></div>`;
    else if(!mk[state.project]||!mk[state.project].initialized||state.mode==='empty')html+=emptyHtml();
    else html+=boardHtml();}
  $('#content').innerHTML=html;
  renderDrawer();}

/* ---- 写入模拟：失败保留草稿，可重试 ---- */
function write(label,applyFn){if(state.busy)return;
  state.busy=true;msg('正在'+label+'…');render();
  setTimeout(()=>{state.busy=false;
    if(state.mode==='error'){state.writeError=label+'失败：无法写入营销数据文件（演示）。修改已保留，可重试。';msg(label+'失败，内容已保留。');}
    else{state.writeError='';applyFn();}
    render();},550);}
function hist(a,text){a.history.push({at:nowTime().slice(0,5),text});}

/* ---- 校验 ---- */
function validateChannel(){const e={},f=dialogForm;
  if(!f.platform)e.platform='请填写平台';
  if(!f.link)e.link='请填写账号 / 社区链接';
  if(!f.audience)e.audience='请填写目标受众';
  if(!f.reason)e.reason='请填写选择理由（待验证假设）';
  if(!numOk(f.weeklyHours))e.weeklyHours='需为不小于 0 的数字，或留空表示未知';
  state.dialogErrors=e;return !Object.keys(e).length;}
function validateExperiment(){const e={},f=dialogForm;
  if(!f.name)e.name='请填写实验名称';
  if(!f.hypothesis)e.hypothesis='请填写假设';
  if(!f.metric)e.metric='请填写主指标';
  if(!numOk(f.budget))e.budget='预算需为不小于 0 的数字（0 表示零预算，留空表示未知）';
  if(!numOk(f.spent))e.spent='实际支出需为不小于 0 的数字，或留空';
  if(f.observeStart&&f.observeEnd&&f.observeEnd<f.observeStart)e.observeEnd='观察结束需不早于开始';
  state.dialogErrors=e;return !Object.keys(e).length;}
function validateActivity(){const e={},f=dialogForm;
  if(!f.experimentId)e.experimentId='请选择所属实验';
  if(!f.channelId)e.channelId='请选择渠道';
  if(!f.title)e.title='请填写标题';
  if(!f.planDate)e.planDate='请填写计划日期';
  state.dialogErrors=e;return !Object.keys(e).length;}

/* ---- 事件 ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,d=mk[state.project];

    case 'new-channel':if(!d||!d.initialized)mk[state.project]=mk[state.project]&&mk[state.project].initialized?mk[state.project]:{initialized:true,reqSeq:31,channels:[],experiments:[],activities:[]};
      if(state.mode==='empty'){state.mode='normal';$('#mode').value='normal';}
      openDialog('channel',{platform:'',link:'',audience:'',language:'英语',format:'帖子',priority:'中',reason:'',weeklyHours:'',dataAccess:'',capabilities:''});break;
    case 'new-experiment':if(!d||!d.initialized)mk[state.project]=mk[state.project]&&mk[state.project].initialized?mk[state.project]:{initialized:true,reqSeq:31,channels:[],experiments:[],activities:[]};
      if(state.mode==='empty'){state.mode='normal';$('#mode').value='normal';}
      openDialog('experiment',{name:'',hypothesis:'',metric:'',observeStart:today(),observeEnd:'',success:'',currency:'USD',budget:'',spent:'',estHours:'',actHours:'',pricingVersion:PRICING.current});break;
    case 'new-activity':if(!d||!d.channels.length||!d.experiments.length)break;

    case 'open-act':state.drawerId=b.dataset.id;state.drawerErrors={};msg('');render();break;
    case 'close-drawer':state.drawerId=null;state.writeError='';render();break;
    case 'open-exp':{if(state.drawerId){/* 保持抽屉 */}openDialog('expDetail',{id:b.dataset.id});break;}
    case 'save-act':{const act=activity(state.drawerId);if(!act)break;

    case 'copy-content':{const act=activity(state.drawerId);if(!act)break;
      const txt=act.content||'';

      const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(_){msg('复制失败：请手动选择文本复制。');}t.remove();};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fb);else fb();render();break;}
    case 'mark-ready':{const act=activity(state.drawerId);if(!act)break;
      const errs={};if(!act.content)errs.content='标记待发布前需填写内容草稿';if(!act.planAt)errs.planAt='请填写计划时间';
      if(Object.keys(errs).length){state.drawerErrors={};msg('验证未通过：状态未改变。'+Object.values(errs).join('；'));render();
        const el=$('#drawer [data-dfield="content"]');if(errs.content&&el){el.style.borderColor='var(--danger)';el.focus();}break;}
      write('标记待发布',()=>{act.prevStage=act.status;act.status='ready';hist(act,'标记待发布（未发送内容）');msg('已标记待发布；内容不会被自动发送。');});break;}
    case 'publish-submit':{const act=activity(state.drawerId);if(!act)break;
      const errs={};if(!act.publishAt)errs.publishAt='标记已发布必须有发布时间';
      if(!act.publishLink&&!act.credentialNote){errs.publishLink='发布链接与凭据说明至少填一项';errs.credentialNote='无公开链接时请填写凭据说明';}

      const errs={};if(!act.reviewBasis)errs.reviewBasis='复盘需记录结果依据';if(!act.decision)errs.decision='请选择决策';

      write('完成复盘',()=>{act.prevStage=act.status;act.status='reviewed';state.drawerErrors={};hist(act,'完成复盘：决策「'+DECISION_LABEL[act.decision]+'」'+(act.decision==='undetermined'?'（数据不足，不等同验证成功）':''));msg('已完成复盘'+(act.decision==='undetermined'?'（数据不足，不等同验证成功）':'')+'。');});break;}

    case 'correct-open':{const act=activity(state.drawerId);if(!act||!act.prevStage)break;

    case 'correct-confirm':{const act=activity(state.drawerId);if(!act)break;
      if(!dialogForm.reason){state.dialogErrors={reason:'请填写更正原因'};renderDialog();break;}

    case 'copy-exp':{const act=activity(b.dataset.id);if(!act)break;const ex=experiment(act.experimentId);if(!ex)break;

        msg(`已复制为新实验 ${nExp}（新 ID，保留来源 ${ex.id}）；新行动 ${nAct} 为草稿。`);state.drawerId=nAct;});

document.addEventListener('input',e=>{const t=e.target;if(t.dataset){
  if(t.dataset.f&&state.dialog&&dialogForm!=null){dialogForm[t.dataset.f]=t.value;return;}
  if(t.dataset.dfield&&state.drawerId){const act=activity(state.drawerId);if(!act)return;const k=t.dataset.dfield;
    if(k==='assets')act.assets=t.value.split('\n').filter(x=>x.trim());
    else if(k==='planAt'||k==='publishAt')act[k]=t.value?t.value.replace('T',' '):'';
    else act[k]=t.value;
    return;}}});

document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;
  const act=t.dataset.actionChange;
  if(act==='filter-channel'){state.filters.channel=t.value;msg('');render();}
  else if(act==='filter-experiment'){state.filters.experiment=t.value;msg('');render();}
  else if(act==='filter-status'){state.filters.status=t.value;msg('');render();}
  else if(t.dataset.f&&state.dialog&&dialogForm!=null)dialogForm[t.dataset.f]=t.value;
  else if(t.dataset.dfield&&state.drawerId){const a2=activity(state.drawerId);if(a2&&(t.dataset.dfield==='decision'||t.dataset.dfield==='tz'))a2[t.dataset.dfield]=t.value;}});

$('#projSel').addEventListener('change',e=>{const pid=e.target.value;if(pid===state.project)return;
  state.project=pid;state.filters={channel:'',experiment:'',status:''};state.drawerId=null;state.writeError='';msg('已切换项目；营销数据按项目隔离。');render();});
$('#mode').addEventListener('change',e=>{state.mode=e.target.value;state.writeError='';msg('');render();});
$('#theme').addEventListener('change',e=>{state.theme=e.target.value;render();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#dialogWrap').classList.contains('hidden')){closeDialog();render();}
    else if(!$('#drawerWrap').classList.contains('hidden')){state.drawerId=null;render();}}});
$('#drawerWrap').addEventListener('click',e=>{if(e.target.id==='drawerWrap'){state.drawerId=null;render();}});
$('#dialogWrap').addEventListener('click',e=>{if(e.target.id==='dialogWrap'){closeDialog();render();}});

/* ---- 启动：会话恢复 + 首次渲染 ---- */
restore();
$('#mode').value=state.mode;$('#theme').value=state.theme;
render();
</script>
</body>
</html>
