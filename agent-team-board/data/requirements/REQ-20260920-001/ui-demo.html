<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分支历史拓扑演示</title><style>
:root{color-scheme:dark;--bg:#15191f;--panel:#202730;--text:#e8edf4;--muted:#a4b0be;--line:#3b4655}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}header{padding:24px;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:23px}p{color:var(--muted)}main{display:flex;margin:24px;gap:20px}aside{width:170px;flex-shrink:0}button,input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px;margin:3px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#69aaff}aside button{display:block;width:100%;text-align:left}.active{outline:2px solid #69aaff}section{flex:1;min-width:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:18px}.history{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--panel);min-height:180px}.row{height:66px;display:flex;align-items:center;min-width:650px;border-bottom:1px solid #ffffff0b}.row button{background:none;border:0;text-align:left;flex:1;min-width:0}.row.selected{background:#377cba30}.subject{display:block;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}small{color:var(--muted)}svg{width:120px;height:66px;flex-shrink:0;overflow:visible}code{color:#a9d1ff}.notice{padding:24px}.detail{margin-top:16px;background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:10px;min-height:92px}.tag{background:#315781;padding:3px 8px;border-radius:10px}label{color:var(--muted)}@media(max-width:650px){main{display:block;margin:12px}aside{width:auto;display:flex;margin-bottom:20px}aside button{width:auto}}@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f2f5fa;--panel:white;--text:#1d2938;--muted:#5a6676;--line:#ccd6e1}code{color:#1264a9}}
</style><header><h1>构建 / 分支浏览</h1><small>REQ-20260920-001 · 可交互原型 · 全部为虚构提交，只读演示</small></header><main><aside><button id="main" class="active" onclick="branch('main')">⑂ main</button><button id="feature" onclick="branch('feature')">⑂ feature</button></aside><section><div class="toolbar"><strong id="title">main 的提交历史</strong><input id="search" aria-label="搜索提交" placeholder="搜索主题或 hash" oninput="render()"><label>状态 <select id="phase" onchange="render()"><option value="normal">正常</option><option value="empty">空历史</option><option value="loading">加载</option><option value="error">失败</option></select></label><label><input id="boundary" type="checkbox" onchange="render()">边界示意</label></div><div id="history" class="history" aria-live="polite"></div><div id="detail" class="detail" aria-live="polite">选择任意节点或提交，查看父提交关系。</div><p>蓝色为主线，黄色为并行轨道；双圈与“合并 · 2 父提交”共同标识合并。虚线表示未展示的历史，不能据此判断直接父子关系。</p></section></main><script>
const commits=[{id:'a100001',text:'合并 feature：加入分支历史图',parents:['b200002','c300003'],lane:32,merge:true},{id:'c300003',text:'完善节点与合并轨道',parents:['d400004'],lane:78},{id:'d400004',text:'添加历史图展示',parents:['e500005'],lane:78},{id:'b200002',text:'更新主线文档',parents:['e500005'],lane:32},{id:'e500005',text:'共同祖先：初始化项目',parents:[],lane:32}];let current='main',selected='';const history=document.getElementById('history');function branch(name){current=name;selected='';document.getElementById('search').value='';document.getElementById('title').textContent=name+' 的提交历史';document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.id===name));document.getElementById('detail').textContent='选择任意节点或提交，查看父提交关系。';render()}
function select(id){selected=id;const c=commits.find(x=>x.id===id);document.getElementById('detail').textContent=c.id+' · '+c.text+'；父提交：'+(c.parents.join('、')||'无（根提交）')+'。模拟数据，不执行 Git 写操作。';render()}
function render(){const phase=document.getElementById('phase').value,q=document.getElementById('search').value.trim().toLowerCase(),boundary=document.getElementById('boundary').checked;if(phase!=='normal'){history.innerHTML='<div class="notice">'+({empty:'此分支暂无提交历史。',loading:'正在加载提交历史…',error:'提交历史读取失败：模拟读取异常。<br><button onclick="document.getElementById(\'phase\').value=\'normal\';render()">重试</button>'}[phase])+'</div>';return}let rows=current==='main'?commits:commits.filter(c=>[1,2,4].includes(commits.indexOf(c)));if(q)rows=rows.filter(c=>(c.id+' '+c.text).toLowerCase().includes(q));if(boundary)rows=rows.slice(0,3);if(!rows.length){history.innerHTML='<div class="notice">没有匹配的提交。<button onclick="document.getElementById(\'search\').value=\'\';render()">清除搜索</button></div>';return}const reduced=q||boundary;history.innerHTML=(q?'<div class="notice">搜索结果：上下文已隐藏；虚线不表示直接父边。</div>':'')+rows.map(c=>{const i=commits.indexOf(c),blue='#63aaff',yellow='#e6b33a';let lines='';if(reduced){lines='<path d="M '+c.lane+' 0 V 66" stroke="'+blue+'" stroke-dasharray="4 4"/>'}else if(current==='feature'){lines='<path d="M 78 '+(i===1?33:0)+' V '+(i===4?33:66)+'" stroke="'+yellow+'"/>'}else {if(i===0)lines='<path d="M32 33 V66 M32 33 Q78 33 78 66" stroke="'+blue+'"/>';if(i===1||i===2)lines='<path d="M32 0 V66" stroke="'+blue+'"/><path d="M78 0 V66" stroke="'+yellow+'"/>';if(i===3)lines='<path d="M32 0 V66" stroke="'+blue+'"/><path d="M78 0 Q78 50 32 66" stroke="'+yellow+'"/>';if(i===4)lines='<path d="M32 0 V33" stroke="'+blue+'"/>'}const x=current==='feature'?78:c.lane;return '<div class="row '+(selected===c.id?'selected':'')+'"><svg aria-hidden="true" viewBox="0 0 120 66"><g fill="none" stroke-width="2.5">'+lines+'</g><circle cx="'+x+'" cy="33" r="'+(c.merge?9:6)+'" fill="var(--panel)" stroke="'+(x===78?yellow:blue)+'" stroke-width="3"/>'+(c.merge?'<circle cx="32" cy="33" r="4" fill="'+blue+'"/>':'')+'</svg><button onclick="select(\''+c.id+'\')"><code>'+c.id+'</code> '+(c.merge?'<span class="tag">合并 · 2 父提交</span>':'')+'<span class="subject">'+c.text+'</span><small>模拟作者 · 2026-09-20 · '+c.parents.length+' 父提交</small></button></div>'}).join('')+(boundary?'<div class="notice">⋮ 父提交在后续页，轨道继续；此处不是历史起点。<button onclick="document.getElementById(\'boundary\').checked=false;render()">展开完整示例</button></div>':'')};render();
</script></html>
