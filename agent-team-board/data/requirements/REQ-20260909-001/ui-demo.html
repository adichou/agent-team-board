<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务设置 · 精简演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#233047;font:15px system-ui,sans-serif}main{max-width:760px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}small,p{color:#64748b;line-height:1.7}section{background:white;border:1px solid #dce2ec;border-radius:14px;padding:24px;margin:20px 0}h1{font-size:24px}h2{font-size:18px}fieldset{border:0;padding:0;margin:24px 0}legend{font-weight:600;margin-bottom:12px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eef1f6;padding:14px 0}label{display:flex;gap:9px;align-items:center}input{width:18px;height:18px;accent-color:#5364d9}button,select{font:inherit;padding:9px 13px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#5364d9;color:white;border-color:#5364d9}button:disabled{opacity:.5;cursor:default}.feedback{padding:12px;background:#f1f5fb;border-radius:8px;margin:14px 0;line-height:1.6}.error{color:#b42318}footer{display:flex;gap:10px;flex-wrap:wrap}.preview{font-size:13px;line-height:1.8} @media(max-width:500px){main{padding:14px;margin:0}section{padding:18px}header{align-items:start;flex-direction:column}}
</style><main><header><div><small>任务 / 设置</small><h1>批量任务</h1></div><label>演示状态<select id="scenario"><option value="normal">正常</option><option value="empty">空 · 尚无配置</option><option value="loading">加载中</option><option value="failure">加载失败</option><option value="savefail">保存失败</option></select></label></header><p>隐藏后，该 Agent 不出现在对应任务的启动选项中。</p><section id="panel"></section><small>交互原型 · 仅使用页面内存中的示例数据，不修改项目配置。</small></main><script>
const kinds=['批量完善','批量开发'],agents=['Codex','Zcode'];let saved=[[false,false],[false,false]],draft=structuredClone(saved),mode='normal',busy=false,notice='已加载设置';const panel=document.getElementById('panel');
function render(){if(mode==='failure'){panel.innerHTML='<div class="feedback error" role="alert">加载失败，无法读取任务设置。</div><button id="retry">重试</button>';document.getElementById('retry').onclick=()=>{mode='normal';document.getElementById('scenario').value='normal';notice='重试成功，已加载设置';render()};return}const disabled=mode==='loading'||busy;panel.innerHTML=kinds.map((kind,i)=>`<fieldset ${disabled?'disabled':''}><legend>${kind}</legend>${agents.map((agent,j)=>`<div class="row"><span>${agent}</span><label><input type="checkbox" data-i="${i}" data-j="${j}" aria-label="${kind}隐藏 ${agent}" ${draft[i][j]?'checked':''}>隐藏</label></div>`).join('')}</fieldset>`).join('')+`<div class="feedback ${notice.includes('失败')?'error':''}" role="status">${mode==='loading'?'正在加载任务设置…':notice}</div><footer><button id="save" class="primary" ${disabled?'disabled':''}>${busy?'保存中…':'保存'}</button><button id="reload" ${disabled?'disabled':''}>重新加载</button></footer><hr><div class="preview"><strong>已保存的启动选项（演示）</strong>${kinds.map((kind,i)=>`<div>${kind}：${agents.filter((_,j)=>!saved[i][j]).join(' / ')||'无可用 Agent；启动不可用，请到任务设置取消隐藏。'}</div>`).join('')}</div>`;panel.querySelectorAll('input').forEach(el=>el.onchange=()=>{draft[el.dataset.i][el.dataset.j]=el.checked;notice='有未保存的更改';render()});document.getElementById('save').onclick=()=>{busy=true;render();setTimeout(()=>{busy=false;if(mode==='savefail'){notice='保存失败，草稿已保留；请重试';mode='normal'}else{saved=structuredClone(draft);notice='已保存，仅对后续启动任务生效'}render()},650)};document.getElementById('reload').onclick=()=>{draft=structuredClone(saved);notice='已重新加载保存值';render()}}
document.getElementById('scenario').onchange=e=>{mode=e.target.value;notice='已加载设置';if(mode==='empty'){saved=[[false,false],[false,false]];draft=structuredClone(saved);notice='尚无保存配置，默认全部可见'}if(mode==='savefail')notice='请修改开关后保存，演示一次失败及重试';render()};render();
</script></html>
