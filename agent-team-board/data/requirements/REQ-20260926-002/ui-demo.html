<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REQ-20260926-002 发布模块简化 · 交互演示</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1c2430; --mut: #67748a; --line: #dde3ec;
    --acc: #2563eb; --accink: #ffffff; --chipbg: #eef1f6;
    --ok: #15803d; --okbg: #e5f6ec; --run: #9a5b00; --runbg: #fdf0d2;
    --fail: #b42323; --failbg: #fde7e7; --warn: #9a5b00; --warnbg: #fdf0d2;
    --dctx: #55617a; --dadd: #157347; --daddbg: #e2f5e9; --ddel: #b02a2a; --ddelbg: #fde5e5;
    --shadow: 0 1px 3px rgba(20, 30, 50, .08);
  }
  [data-theme="dark"] {
    --bg: #0f131a; --card: #171d27; --ink: #e4e9f2; --mut: #93a0b4; --line: #2a3342;
    --acc: #5b9bf8; --accink: #0b1220; --chipbg: #222a38;
    --ok: #4ade80; --okbg: #14301f; --run: #fbbf24; --runbg: #3a2c08;
    --fail: #f87171; --failbg: #3b1515; --warn: #fbbf24; --warnbg: #3a2c08;
    --dctx: #93a0b4; --dadd: #4ade80; --daddbg: #14301f; --ddel: #f87171; --ddelbg: #3b1515;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px 8px; max-width: 1080px; margin: 0 auto; }
  header.top h1 { font-size: 18px; margin: 0; }
  header.top .sub { margin: 2px 0 0; color: var(--mut); font-size: 12.5px; }
  .ctrl { display: flex; gap: 8px; align-items: center; }
  .ctrl label { color: var(--mut); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 20px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14.5px; margin: 0 0 10px; }
  .card h3 { font-size: 13.5px; margin: 14px 0 8px; }
  /* 版本信息 */
  .vergrid { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items: center; }
  .vergrid label { color: var(--mut); font-size: 12.5px; text-align: right; }
  .vergrid input { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
  /* 五步导航 */
  nav.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  nav.steps button { border: 1px solid var(--line); background: var(--bg); color: var(--mut); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; }
  nav.steps button .n { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; background: var(--chipbg); margin-right: 6px; font-size: 12px; }
  nav.steps button.active { background: var(--acc); border-color: var(--acc); color: var(--accink); }
  nav.steps button.active .n { background: rgba(255, 255, 255, .28); color: inherit; }
  nav.steps button.done .n { background: var(--okbg); color: var(--ok); }
  /* 按钮 / chips */
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 13px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px; }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: var(--accink); }
  .btn.ghost { background: transparent; }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--chipbg); color: var(--mut); font-size: 12px; white-space: nowrap; }
  .chip.ok { background: var(--okbg); color: var(--ok); }
  .chip.run { background: var(--runbg); color: var(--run); }
  .chip.fail { background: var(--failbg); color: var(--fail); }
  .chip.warn { background: var(--warnbg); color: var(--warn); }
  .chip.acc { background: var(--acc); color: var(--accink); }
  /* 双栏 */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .vergrid { grid-template-columns: 1fr; } .vergrid label { text-align: left; } }
  .pane { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-height: 120px; }
  .pane > .ptitle { font-size: 12.5px; color: var(--mut); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .itemrow { display: flex; gap: 8px; align-items: baseline; padding: 6px 4px; border-bottom: 1px dashed var(--line); }
  .itemrow:last-child { border-bottom: 0; }
  .itemrow .tid { font-weight: 600; }
  .itemrow .tt { color: var(--mut); font-size: 12.5px; flex: 1; }
  .empty { color: var(--mut); text-align: center; padding: 26px 10px; font-size: 13px; }
  .empty .big { font-size: 22px; display: block; margin-bottom: 6px; opacity: .6; }
  /* 提交卡 */
  .commit { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 9px; background: var(--bg); }
  .commit .row1 { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .commit .hash { font-weight: 700; }
  .commit .subj { flex: 1; min-width: 160px; }
  .assoc { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 7px; font-size: 12.5px; color: var(--mut); }
  .assoc label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .diff { margin-top: 8px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .diff .file { background: var(--chipbg); padding: 4px 10px; font-size: 12px; color: var(--mut); }
  .diff pre { margin: 0; padding: 7px 10px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.55; }
  .dl-add { color: var(--dadd); background: var(--daddbg); display: block; }
  .dl-del { color: var(--ddel); background: var(--ddelbg); display: block; }
  .dl-ctx { color: var(--dctx); display: block; }
  /* 合并执行 */
  .mrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 6px; border-bottom: 1px dashed var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mrow .ord { width: 20px; height: 20px; border-radius: 50%; background: var(--chipbg); color: var(--mut); text-align: center; line-height: 20px; font-size: 12px; flex: none; }
  .mrow .grow { flex: 1; min-width: 150px; }
  .mapline { font-size: 12.5px; color: var(--mut); }
  .conflict { border: 1px solid var(--fail); background: var(--failbg); border-radius: 9px; padding: 10px 12px; margin: 10px 0; }
  .conflict .t { color: var(--fail); font-weight: 600; margin: 0 0 6px; }
  .conflict ul { margin: 6px 0 8px; padding-left: 20px; }
  .hint { color: var(--mut); font-size: 12.5px; margin: 8px 0 0; }
  .hint b { color: var(--ink); }
  /* 文档两阶段 */
  .stagebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); margin-bottom: 10px; font-size: 13px; }
  .ftable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ftable th, .ftable td { text-align: left; padding: 6px 8px; border-bottom: 1px dashed var(--line); }
  .ftable th { color: var(--mut); font-weight: 500; font-size: 12.5px; }
  .ftable td:last-child { text-align: right; white-space: nowrap; }
  .langcol { font-weight: 600; }
  /* 骨架屏 */
  .skel { height: 13px; border-radius: 6px; margin: 12px 0; background: linear-gradient(90deg, var(--chipbg) 25%, var(--line) 45%, var(--chipbg) 65%); background-size: 200% 100%; animation: sk 1.1s linear infinite; }
  .skel.w60 { width: 60%; } .skel.w80 { width: 80%; } .skel.w40 { width: 40%; }
  @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--acc); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* toast / footer */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; max-width: 88vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 20px 30px; color: var(--mut); font-size: 12px; }
  .note { border-left: 3px solid var(--acc); background: var(--chipbg); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 12.5px; color: var(--mut); margin: 10px 0 0; }
  .note b { color: var(--ink); }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>发布模块 · 交互演示</h1>
    <p class="sub">REQ-20260926-002 · 条目与提交多对多组版 → 挑选合并 → 文档与翻译 → 文档合并 → 发布 · 本页为静态示例数据，不连接真实仓库 / 服务</p>
  </div>
  <div class="ctrl">
    <label>场景
      <select id="scene">
        <option value="normal">正常流程</option>
        <option value="empty">空态</option>
        <option value="loading">加载中</option>
        <option value="failure">失败恢复</option>
      </select>
    </label>
    <button class="btn ghost" id="themeBtn">深色</button>
  </div>
</header>

<main>
  <div class="card">
    <h2>版本计划</h2>
    <div class="vergrid">
      <label for="verNo">版本号</label><input id="verNo" value="20260926-001">
      <label for="verName">名称</label><input id="verName" value="发布流程简化基线">
      <label for="verDesc">说明</label><input id="verDesc" value="条目与提交多对多组版，挑选合并先行，文档依据实际合入结果编写">
    </div>
    <nav class="steps" id="stepNav" role="tablist" aria-label="发布五步导航"></nav>
  </div>
  <section id="stepBody" aria-live="polite"></section>
</main>

<footer>
  图例：<span class="chip">未开始</span> <span class="chip run">执行中</span> <span class="chip ok">成功</span> <span class="chip fail">失败</span> ·
  演示数据：dev 上提交 def4567（旧）→ abc1234（新），abc1234 同时关联 REQ 与 BUG（共享提交，只合入一次）
</footer>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ================= 示例数据 ================= */
const TOPO = ['def4567', 'abc1234', '99aabbcc']; // dev 拓扑：旧 → 新
const ITEMS = [
  { id: 'REQ-20260912-001', type: 'REQ', title: '条目—提交多对多组版', commits: ['def4567', 'abc1234'] },
  { id: 'BUG-20260920-003', type: 'BUG', title: '共享提交被误判混合提交阻断', commits: ['abc1234'] },
  { id: 'REQ-20260918-004', type: 'REQ', title: '官网资料更新状态区分', commits: ['99aabbcc'] },
];
const COMMITS = {
  def4567: {
    subject: 'fix(release): 取消混合提交阻断与一键祖先引导', replay: '91f0c2e',
    diff: [
      ['f', 'scripts/web/build.js'],
      ['del', "-  if (linkedItems.length > 1) return block('混合提交');"],
      ['add', '+  // 多对多共享提交只按完整 hash 去重后合入一次，不再阻断'],
      ['ctx', '   const order = topoSort(selectedCommits);'],
    ],
  },
  abc1234: {
    subject: 'feat(release): 条目与提交多对多组版与挑选合并', replay: '6d84a19',
    diff: [
      ['f', 'scripts/web/build.js'],
      ['add', '+  const picked = dedupeByFullHash(selCommits);'],
      ['add', "+  for (const c of topoOrder(picked)) await cherryPick(c);"],
      ['ctx', '   renderPlan(v.id);'],
    ],
  },
  '99aabbcc': {
    subject: 'feat(site): 官网资料更新状态区分（所属条目未选，不入本版）', replay: null,
    diff: [
      ['f', 'scripts/web/marketing.js'],
      ['add', "+  const chips = ['本地 main 已合入', '远端已推送', '官网资料已更新'];"],
      ['ctx', '   renderTargets(run);'],
    ],
  },
};
const DEFAULT_LANG = 'zh（语言集首语言 · 示例，不写死中文）';
const OTHER_LANGS = ['EN', 'JA'];
const DOC_FILES = ['README.md', 'CHANGELOG.md', 'FEATURES.md', 'AGENTS.md'];
const DESIGN_FILE = 'DESIGN.md';
const STEP_LABEL = ['选择条目与提交', '挑选合并', '文档与翻译', '文档合并', '发布'];

let S;
function freshState() {
  return {
    step: 1,
    sel: new Set(['REQ-20260912-001', 'BUG-20260920-003']),
    assoc: { def4567: ['REQ-20260912-001'], abc1234: ['REQ-20260912-001', 'BUG-20260920-003'] },
    expanded: new Set(),
    merge: { started: false, busy: false, st: {}, map: {}, conflict: null, resolved: false },
    docs: { p1: null, p2: null, aiBusy: false, trBusy: false },
    docMerge: { st: 'pending', busy: false, hash: null },
    site: { push: 'pending', web: 'pending', busy: false, webResolved: false, webErr: '' },
    loading: false,
  };
}
function initDocs(s) {
  s.docs.p1 = {};
  for (const f of DOC_FILES.concat(DESIGN_FILE)) s.docs.p1[f] = 'wait';
  s.docs.p2 = {};
  for (const l of OTHER_LANGS) for (const f of DOC_FILES) s.docs.p2[l + '/' + f] = 'wait';
}
function applyScene(scene) {
  S = freshState();
  if (scene === 'empty') { S.sel = new Set(); }
  if (scene === 'loading') { S.loading = true; }
  if (scene === 'failure') {
    initDocs(S);
    S.merge.started = true;
    S.merge.st = { def4567: 'ok', abc1234: 'conflict' };
    S.merge.map = { def4567: COMMITS.def4567.replay };
    S.merge.conflict = {
      hash: 'abc1234',
      files: ['scripts/web/build.js'],
      reason: '示例冲突：main 上另一改动也修改了合并确认清单区域。解决冲突后重试即可继续；已合入的 def4567 不会重复执行。',
    };
    S.site.web = 'failed';
    S.site.webErr = '部署接口超时（示例原因）；本地与远端结果保留，可重试官网更新。';
  } else {
    initDocs(S);
  }
}

/* ================= 工具 ================= */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function planCommits() { // 所选条目的提交并集（按 hash 去重，拓扑旧→新）
  const set = new Set();
  for (const it of ITEMS) if (S.sel.has(it.id)) it.commits.forEach((h) => set.add(h));
  return TOPO.filter((h) => set.has(h));
}
function assocOf(hash) { return (S.assoc[hash] || []).filter((id) => S.sel.has(id)); }
function chipOf(st, map) {
  if (st === 'ok') return '<span class="chip ok">✔ ' + (map || '已完成') + '</span>';
  if (st === 'running') return '<span class="chip run"><span class="spin"></span>执行中</span>';
  if (st === 'conflict' || st === 'failed') return '<span class="chip fail">✕ 失败</span>';
  if (st === 'review') return '<span class="chip run">待审核</span>';
  if (st === 'done') return '<span class="chip ok">✔ 已审核</span>';
  return '<span class="chip">未开始</span>';
}
const stepDone = (n) =>
  n === 1 ? S.merge.started :
  n === 2 ? planCommits().length > 0 && planCommits().every((h) => S.merge.st[h] === 'ok') :
  n === 3 ? allReviewed() :
  n === 4 ? S.docMerge.st === 'ok' : false;
function allReviewed() {
  if (!S.docs.p1) return false;
  const p1ok = Object.values(S.docs.p1).every((v) => v === 'done');
  const p2ok = Object.values(S.docs.p2).every((v) => v === 'done');
  return p1ok && p2ok;
}

/* ================= 渲染 ================= */
function renderNav() {
  const nav = document.getElementById('stepNav');
  nav.innerHTML = STEP_LABEL.map((lb, i) => {
    const n = i + 1;
    return '<button role="tab" data-step="' + n + '" aria-selected="' + (S.step === n) + '"' +
      ' class="' + (S.step === n ? 'active ' : '') + (stepDone(n) ? 'done' : '') + '">' +
      '<span class="n">' + (stepDone(n) && S.step !== n ? '✓' : n) + '</span>' + lb + '</button>';
  }).join('');
}
function diffHtml(hash) {
  const c = COMMITS[hash];
  return '<div class="diff">' + c.diff.map((d) =>
    d[0] === 'f' ? '<div class="file">' + esc(d[1]) + '</div>' :
    '<pre>' + (d[0] === 'add' ? '<span class="dl-add">+ ' + esc(d[1]) + '</span>'
      : d[0] === 'del' ? '<span class="dl-del">- ' + esc(d[1]) + '</span>'
      : '<span class="dl-ctx">  ' + esc(d[1]) + '</span>') + '</pre>'
  ).join('') + '</div>';
}
function commitCard(hash, opts) {
  opts = opts || {};
  const c = COMMITS[hash];
  const as = assocOf(hash);
  const assocHtml = S.sel.size
    ? '<div class="assoc"><span>关联：</span>' + ITEMS.filter((it) => S.sel.has(it.id)).map((it) => {
        const on = as.includes(it.id);
        return '<label><input type="checkbox" data-assoc="' + hash + '" data-item="' + it.id + '"' + (on ? ' checked' : '') + '> ' + esc(it.id) + '</label>';
      }).join('') + (as.length ? '' : ' <span class="chip warn">未关联条目</span>') + '</div>'
    : '';
  const st = S.merge.st[hash];
  const stChip = opts.showState && st
    ? (st === 'ok' ? ' <span class="chip ok">✔ 已合入 ' + S.merge.map[hash] + '</span>'
      : st === 'running' ? ' <span class="chip run"><span class="spin"></span>合入中</span>'
      : st === 'conflict' ? ' <span class="chip fail">✕ 冲突</span>' : '')
    : '';
  const open = S.expanded.has(hash);
  return '<div class="commit"><div class="row1">' +
    '<span class="hash mono">' + esc(hash) + '</span>' +
    '<span class="subj">' + esc(c.subject) + '</span>' + stChip +
    '<button class="btn small" data-expand="' + hash + '" aria-expanded="' + open + '">' + (open ? '收起变更' : '查看变更') + '</button></div>' +
    assocHtml + (open ? diffHtml(hash) : '') + '</div>';
}

function step1() {
  const pcs = planCommits();
  const itemsHtml = ITEMS.map((it) => {
    const on = S.sel.has(it.id);
    return '<div class="itemrow"><label style="display:flex;gap:8px;align-items:baseline;flex:1;cursor:pointer">' +
      '<input type="checkbox" data-sel="' + it.id + '"' + (on ? ' checked' : '') + '>' +
      '<span class="tid">' + esc(it.id) + '</span>' +
      '<span class="chip">' + it.type + ' · done</span>' +
      '<span class="tt">' + esc(it.title) + '</span>' +
      '<span class="chip">' + it.commits.length + ' 个提交</span></label></div>';
  }).join('');
  const commitsHtml = pcs.length
    ? pcs.map((h) => commitCard(h)).join('')
    : '<div class="empty"><span class="big">○</span>尚未选择条目——勾选左侧已完成条目后，其提交按 hash 去重后出现在这里</div>';
  const assocLines = pcs.map((h) => esc(h) + ' → ' + (assocOf(h).length ? assocOf(h).map(esc).join('、') : '（未关联）')).join('；');
  return '<div class="card"><h2>① 选择条目与提交</h2>' +
    '<div class="cols">' +
    '<div class="pane"><p class="ptitle">候选条目（仅已完成 done 条目可组版）<span class="chip">' + S.sel.size + ' / ' + ITEMS.length + ' 已选</span></p>' +
    (ITEMS.length ? itemsHtml : '<div class="empty"><span class="big">○</span>暂无已完成条目</div>') +
    '<p class="hint">标题中提及的单号不自动等于实际归属，以这里的关联为准。</p></div>' +
    '<div class="pane"><p class="ptitle">本版提交（按完整 hash 去重）<span class="chip">' + pcs.length + ' 个提交</span></p>' + commitsHtml + '</div>' +
    '</div>' +
    '<p class="hint">关联：' + (assocLines || '—') + '</p>' +
    '<div class="note"><b>流程简化：</b>一个提交关联多个条目（共享提交）只合入一次，<b>不再出现「混合提交」阻断</b>；' +
    '未选祖先不再自动认定为本版依赖，<b>已移除「一键加入所有依赖提交」引导</b>。选择提交即包含其完整变更，可展开「查看变更」核对。</div>' +
    '<p style="margin:12px 0 0"><button class="btn primary" data-act="merge" ' +
    (pcs.length ? '' : 'disabled') + '>挑选合并到 main（' + pcs.length + ' 个提交）</button></p></div>';
}

function step2() {
  const pcs = planCommits();
  if (!pcs.length) return '<div class="card"><h2>② 挑选合并</h2><div class="empty"><span class="big">○</span>尚未选择条目与提交，请先回到第 ① 步</div></div>';
  if (!S.merge.started) return '<div class="card"><h2>② 挑选合并</h2>' +
    '<div class="empty"><span class="big">○</span>未开始——回到第 ① 步点击「挑选合并到 main」开始执行</div></div>';
  const rows = pcs.map((h, i) => {
    const st = S.merge.st[h] || 'pending';
    const stChip = chipOf(st === 'ok' ? 'ok' : st, st === 'ok' ? '已合入 ' + S.merge.map[h] : '');
    const mapline = st === 'ok' ? '<span class="mapline mono">dev ' + esc(h) + ' → main ' + esc(S.merge.map[h]) + '</span>' : '';
    return '<div class="mrow"><span class="ord">' + (i + 1) + '</span><span class="grow mono">' + esc(h) + '</span>' +
      '<span style="flex:2">' + esc(COMMITS[h].subject) + '</span>' + mapline + stChip + '</div>';
  }).join('');
  const cf = S.merge.conflict;
  const conflictHtml = cf
    ? '<div class="conflict"><p class="t">✕ cherry-pick 冲突：' + esc(cf.hash) + '</p>' +
      '<div>冲突文件：</div><ul>' + cf.files.map((f) => '<li class="mono">' + esc(f) + '</li>').join('') + '</ul>' +
      '<div>' + esc(cf.reason) + '</div>' +
      '<p style="margin:10px 0 0"><button class="btn primary" data-act="retry">重试冲突提交</button></p></div>'
    : '';
  const allOk = pcs.every((h) => S.merge.st[h] === 'ok');
  return '<div class="card"><h2>② 挑选合并</h2>' +
    '<p class="hint">按 Git 拓扑先后（旧 → 新）逐个 cherry-pick 到 main；共享提交只执行一次，已成功的提交重试时不重复执行。</p>' +
    rows + conflictHtml +
    (allOk ? '<p class="hint"><b>本版功能变更已全部合入 main</b>，重放对应关系已记录到版本计划。</p>' : '') +
    '<p style="margin:12px 0 0">' +
    '<button class="btn primary" data-act="goto3"' + (allOk ? '' : ' disabled') + '>下一步：文档与翻译</button>' +
    (allOk ? '' : ' <span class="hint" style="display:inline">合入完成后解锁（演示中步骤仍可直接浏览，执行门禁保留在动作上）</span>') +
    '</p></div>';
}

function docRow(file, st) {
  return '<tr><td class="mono">' + esc(file) + '</td><td>' + chipOf(st, '已审核') + '</td>' +
    '<td>' + (st === 'review' ? '<button class="btn small" data-act="review1" data-f="' + esc(file) + '">审核通过</button>' : '') + '</td></tr>';
}
function step3() {
  const merged = planCommits().filter((h) => S.merge.st[h] === 'ok');
  if (!merged.length) return '<div class="card"><h2>③ 文档与翻译</h2><div class="empty"><span class="big">○</span>功能变更尚未合入 main——完成第 ② 步后，此处依据<b>本版实际合入内容</b>编写文档</div></div>';
  const d = S.docs;
  const p1done = Object.values(d.p1).every((v) => v === 'done');
  const p2unlocked = p1done;
  const p2done = Object.values(d.p2).every((v) => v === 'done');
  const p1rows = DOC_FILES.concat(DESIGN_FILE).map((f) => docRow(f, d.p1[f])).join('');
  const p2rows = OTHER_LANGS.map((l) =>
    '<tr><td class="langcol">' + l + '</td><td class="mono" colspan="2" style="color:var(--mut)">' +
    DOC_FILES.map((f) => esc(f)).join(' · ') + '</td></tr>' +
    DOC_FILES.map((f) => {
      const k = l + '/' + f, st = d.p2[k];
      return '<tr><td style="padding-left:26px" class="mono">' + esc(f) + '</td><td>' + chipOf(st, '已审核') + '</td>' +
        '<td>' + (st === 'review' ? '<button class="btn small" data-act="review2" data-k="' + esc(k) + '">审核通过</button>' : '') + '</td></tr>';
    }).join('')
  ).join('');
  const canSubmit = allReviewed();
  return '<div class="card"><h2>③ 文档与翻译</h2>' +
    '<div class="stagebar">文档依据 = 本版实际合入：<span class="chip acc">' + merged.length + ' 个提交</span>' +
    merged.map((h) => '<span class="chip mono">' + esc(h) + '</span>').join(' ') +
    '<span class="hint" style="margin:0">不含 main 上其他变化</span></div>' +
    '<h3>阶段 ① 默认语言（' + esc(DEFAULT_LANG) + '）— AI 总结 + 逐文件人工审核</h3>' +
    '<table class="ftable"><thead><tr><th>文件（四类发布文档 + 版本设计文档）</th><th>状态</th><th></th></tr></thead><tbody>' + p1rows + '</tbody></table>' +
    '<p><button class="btn primary" data-act="ai-sum"' + (d.aiBusy || p1done ? ' disabled' : '') + '>' +
    (d.aiBusy ? '总结中…' : p1done ? '默认语言已全部审核' : 'AI 总结全部') + '</button></p>' +
    '<h3>阶段 ② 其余语言（' + OTHER_LANGS.join(' / ') + '）— AI 翻译 + 逐文件审核' +
    (p2unlocked ? '' : ' <span class="chip">待阶段 ① 全部审核后解锁</span>') + '</h3>' +
    '<table class="ftable"><tbody>' + (p2unlocked ? p2rows : '') + '</tbody></table>' +
    (p2unlocked ? '<p><button class="btn primary" data-act="ai-tr"' + (d.trBusy || p2done ? ' disabled' : '') + '>' +
      (d.trBusy ? '翻译中…' : p2done ? '其余语言已全部审核' : 'AI 翻译全部') + '</button></p>' : '') +
    '<p style="margin:14px 0 0"><button class="btn primary" data-act="goto4"' + (canSubmit ? '' : ' disabled') + '>提交发布文档（进入第 ④ 步）</button>' +
    (canSubmit ? '' : ' <span class="hint" style="display:inline">语言集内全部文件审核通过后解锁</span>') + '</p>' +
    '<div class="note">发布文档直接关联 <b>BLD（版本计划）</b>，不要求额外创建 REQ / BUG，也不经过功能条目的 done 门禁。</div></div>';
}

function step4() {
  if (!allReviewed()) return '<div class="card"><h2>④ 文档合并</h2><div class="empty"><span class="big">○</span>发布文档尚未全部审核——完成第 ③ 步后此处单独提交并合入 main</div></div>';
  const dm = S.docMerge;
  const ok = dm.st === 'ok';
  return '<div class="card"><h2>④ 文档合并</h2>' +
    '<div class="mrow"><span class="grow mono">doc: 发布文档 BLD-20260926-001</span>' +
    chipOf(ok ? 'ok' : dm.st === 'running' ? 'running' : 'pending', ok ? '已合入 ' + dm.hash : '') + '</div>' +
    '<p class="hint">文档提交单独执行：主题「类型: 描述 单号」含 BLD 编号，守卫放行该通道；合入后记录到版本计划。</p>' +
    '<p><button class="btn primary" data-act="doc-merge"' + (ok || dm.busy ? ' disabled' : '') + '>' +
    (dm.busy ? '合并中…' : ok ? '已合入 main' : '提交发布文档并合入 main') + '</button>' +
    (ok ? ' <span class="chip ok">已记录到版本计划</span>' : '') + '</p>' +
    '<p style="margin:12px 0 0"><button class="btn primary" data-act="goto5"' + (ok ? '' : ' disabled') + '>下一步：发布</button></p></div>';
}

function step5() {
  const localOk = planCommits().length > 0 && planCommits().every((h) => S.merge.st[h] === 'ok');
  const st5 = (st) => st === 'ok' ? '<span class="chip ok">✔ 已完成</span>'
    : st === 'running' ? '<span class="chip run"><span class="spin"></span>执行中</span>'
    : st === 'failed' ? '<span class="chip fail">✕ 失败</span>' : '<span class="chip">未开始</span>';
  return '<div class="card"><h2>⑤ 发布（推送到远端 + 官网资料更新）</h2>' +
    '<div class="mrow"><span class="grow">本地 main 已合入（功能 + 文档提交）</span>' + st5(localOk ? 'ok' : 'pending') + '</div>' +
    '<div class="mrow"><span class="grow">远端已推送</span>' + st5(S.site.push) +
    '<button class="btn small primary" data-act="push"' + (S.site.busy || S.site.push === 'ok' || !localOk ? ' disabled' : '') + '>' +
    (S.site.push === 'ok' ? '已推送' : '推送到远端') + '</button></div>' +
    '<div class="mrow"><span class="grow">官网资料已更新（依据最终版本文档）</span>' + st5(S.site.web) +
    '<button class="btn small primary" data-act="site"' + (S.site.busy || S.site.web === 'ok' || !localOk ? ' disabled' : '') + '>' +
    (S.site.web === 'ok' ? '已更新' : '更新官网资料') + '</button></div>' +
    (S.site.web === 'failed' ? '<div class="conflict"><p class="t">✕ 官网资料更新失败</p><div>' + esc(S.site.webErr) + '</div>' +
      '<p style="margin:10px 0 0"><button class="btn primary" data-act="site-retry">重试官网更新</button></p></div>' : '') +
    '<div class="note"><b>发布包含推送到远端与官网资料更新两个动作</b>；三类结果分别显示真实状态：本地合入 ≠ 远端推送 ≠ 官网部署成功；沿用明确的推送操作，失败保留已完成结果并允许重试。</div></div>';
}

function renderStep() {
  const body = document.getElementById('stepBody');
  if (S.loading) {
    body.innerHTML = '<div class="card"><h2>' + STEP_LABEL[S.step - 1] + '</h2>' +
      '<p><span class="spin"></span>正在加载发布计划…（演示加载态）</p>' +
      '<div class="skel w60"></div><div class="skel w80"></div><div class="skel w40"></div></div>';
    return;
  }
  body.innerHTML = [step1, step2, step3, step4, step5][S.step - 1]();
}

function render() { renderNav(); renderStep(); }

/* ================= 动作 ================= */
async function runMerge(fromRetry) {
  const m = S.merge;
  if (m.busy) return;
  m.started = true; m.busy = true;
  if (!fromRetry) m.conflict = null;
  for (const h of planCommits()) {
    if (m.st[h] === 'ok') continue; // 已成功提交不重复执行
    m.st[h] = 'running'; render();
    await wait(900);
    if (S.scene() === 'failure' && h === 'abc1234' && !m.resolved) {
      m.st[h] = 'conflict';
      m.conflict = {
        hash: h, files: ['scripts/web/build.js'],
        reason: '示例冲突：main 上另一改动也修改了合并确认清单区域。解决冲突后重试即可继续；已合入的 def4567 不会重复执行。',
      };
      m.busy = false; render();
      toast('✕ cherry-pick 冲突：' + h + '（可在详情中重试）');
      return;
    }
    m.st[h] = 'ok'; m.map[h] = COMMITS[h].replay; render();
  }
  m.busy = false; m.conflict = null; render();
  toast('✓ 挑选合并完成：' + planCommits().length + ' 个提交已按拓扑顺序合入 main');
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-step],[data-act],[data-expand],[data-sel],[data-assoc],#themeBtn');
  if (!t) return;

  if (t.id === 'themeBtn') {
    const html = document.documentElement;
    const dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    t.textContent = dark ? '深色' : '浅色';
    return;
  }
  if (t.dataset.step) { S.step = Number(t.dataset.step); render(); return; }
  if (t.dataset.expand) {
    const h = t.dataset.expand;
    S.expanded.has(h) ? S.expanded.delete(h) : S.expanded.add(h);
    render(); return;
  }
  const act = t.dataset.act;
  if (act === 'merge') { S.step = 2; runMerge(false); return; }
  if (act === 'retry') { S.merge.resolved = true; runMerge(true); return; }
  if (act === 'goto3') { S.step = 3; render(); return; }
  if (act === 'goto4') { S.step = 4; render(); return; }
  if (act === 'goto5') { S.step = 5; render(); return; }
  if (act === 'ai-sum') {
    const d = S.docs; d.aiBusy = true; render();
    for (const f of DOC_FILES.concat(DESIGN_FILE)) {
      if (d.p1[f] !== 'wait') continue;
      d.p1[f] = 'running'; render(); await wait(500);
      d.p1[f] = 'review'; render();
    }
    d.aiBusy = false; render(); toast('✓ 默认语言 AI 总结完成，请逐文件人工审核'); return;
  }
  if (act === 'review1') { S.docs.p1[t.dataset.f] = 'done'; render(); return; }
  if (act === 'ai-tr') {
    const d = S.docs; d.trBusy = true; render();
    for (const l of OTHER_LANGS) for (const f of DOC_FILES) {
      const k = l + '/' + f;
      if (d.p2[k] !== 'wait') continue;
      d.p2[k] = 'running'; render(); await wait(350);
      d.p2[k] = 'review'; render();
    }
    d.trBusy = false; render(); toast('✓ 其余语言 AI 翻译完成，请逐文件审核'); return;
  }
  if (act === 'review2') { S.docs.p2[t.dataset.k] = 'done'; render(); return; }
  if (act === 'doc-merge') {
    const dm = S.docMerge; dm.busy = true; dm.st = 'running'; render();
    await wait(1000);
    dm.busy = false; dm.st = 'ok'; dm.hash = 'c07f9d3'; render();
    toast('✓ 发布文档已合入 main（c07f9d3），并记录到版本计划'); return;
  }
  if (act === 'push') {
    S.site.busy = true; S.site.push = 'running'; render();
    await wait(800);
    S.site.busy = false; S.site.push = 'ok'; render(); toast('✓ 已推送到远端'); return;
  }
  if (act === 'site' || act === 'site-retry') {
    S.site.busy = true; S.site.web = 'running'; render();
    await wait(900);
    S.site.busy = false;
    if (act === 'site' && S.scene() === 'failure' && !S.site.webResolved) {
      S.site.web = 'failed';
      S.site.webErr = '部署接口超时（示例原因）；本地与远端结果保留，可重试官网更新。';
      render(); toast('✕ 官网资料更新失败：部署接口超时（示例）'); return;
    }
    S.site.web = 'ok'; S.site.webResolved = true; render(); toast('✓ 官网资料已更新'); return;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.sel) {
    t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel);
    if (!t.checked) for (const h of Object.keys(S.assoc)) S.assoc[h] = S.assoc[h].filter((id) => id !== t.dataset.sel);
    render(); return;
  }
  if (t.dataset && t.dataset.assoc) {
    const h = t.dataset.assoc, id = t.dataset.item;
    const list = new Set(S.assoc[h] || []);
    t.checked ? list.add(id) : list.delete(id);
    S.assoc[h] = Array.from(list);
    render(); return;
  }
});

document.getElementById('scene').addEventListener('change', (e) => {
  applyScene(e.target.value);
  S.scene = () => e.target.value;
  render();
});
S = freshState();
S.scene = () => document.getElementById('scene').value;
render();
</script>
</body>
</html>
