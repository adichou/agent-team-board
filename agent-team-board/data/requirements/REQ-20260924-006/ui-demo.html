<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文档编写流程演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#203047;font:15px system-ui}main{max-width:1200px;margin:32px auto;padding:24px}button,select{font:inherit;padding:9px 13px;border:1px solid #bac6d6;background:white;border-radius:7px;cursor:pointer}button:disabled{opacity:.45;cursor:default}h1{font-size:25px}nav,.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:180px 1fr 320px;gap:16px}.panel,dialog{background:white;border:1px solid #d5dce7;border-radius:12px;padding:20px}aside button{display:block;margin-bottom:10px;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font:inherit}#notice{background:#e4ecff;border-radius:8px;padding:15px;margin:18px 0}dialog{width:min(850px,94vw)}dialog::backdrop{background:#10203888}textarea{width:100%;min-height:250px;padding:16px;font:inherit}del{background:#ffe0df;color:#922c31}ins{background:#d8f7df;color:#166733}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#63718a}.badge{font-size:12px;background:#e4ecff;padding:4px} @media(max-width:850px){.grid{grid-template-columns:1fr}.diff{grid-template-columns:1fr}}
</style><main><p class="muted">发布模块 / 文档编写 · REQ-20260924-006</p><h1>从默认语言初稿到提交</h1><p>离线交互演示 · 所有数据和提交均为模拟，不修改真实文件</p><label>语言集 <select id="langs"><option>cn,en</option><option>cn</option></select></label><nav><button id="summary">① AI 总结</button><button id="edit">② 二次编辑</button><button id="proof">③ AI 校对</button><button id="translate">④ AI 翻译</button><button id="commit">⑤ 提交</button></nav><div class="tools"><button id="empty">空态</button><button id="loading">加载态</button><button id="failure">失败态</button><button id="retry">重试 / 恢复</button><button id="clean">模拟校对无问题</button></div><div id="notice" role="status" aria-live="polite"></div><div class="grid"><aside class="panel" id="files"></aside><section class="panel"><h2 id="filename"></h2><pre id="content"></pre><label><input type="checkbox" id="review"> 最终人工核对完成（演示保留现有门禁）</label></section><section class="panel"><h2>修改建议</h2><div id="suggestions"></div></section></div><p class="muted">实际审核入口如何融入五步流程待确认。演示以两个示例文件展示交互，不代表完整发布清单。</p></main><dialog id="editor"><h2>二次编辑 · 默认语言</h2><p id="editname"></p><div class="tools"><button id="refresh">刷新</button><button id="previewBtn">编辑 / 预览</button></div><textarea id="input" aria-label="文档内容"></textarea><pre id="preview" hidden></pre><div class="tools"><button id="save">保存</button><button id="close">关闭</button></div><p id="saveState" role="status"></p></dialog><script>
const $=id=>document.getElementById(id);let docs={'README.md':'','FEATURES.md':''},selected='README.md',suggestions={},translated=false,busy=false,failed=false,checked=false;
function note(t){$('notice').textContent=t}function render(){ $('files').replaceChildren();Object.keys(docs).forEach(f=>{let b=document.createElement('button');b.textContent=f;b.onclick=()=>{selected=f;render()};$('files').append(b)});$('filename').textContent=selected+' · 默认语言';$('content').textContent=docs[selected]||'尚无初稿，请先 AI 总结。';let s=suggestions[selected];$('suggestions').innerHTML='';if(!s){$('suggestions').textContent=checked?'未发现问题':'尚未校对';}else{let p=document.createElement('p');p.textContent='行文规范 · 第 2 行 · '+s.state;$('suggestions').append(p);let details=document.createElement('details');details.innerHTML='<summary>查看修改前后差异</summary><p>原因：修正错别字，保持原意。</p><div class="diff"><div>修改前（删除）<pre><del>提供文挡编写能力。</del></pre></div><div>修改后（新增）<pre><ins>提供文档编写能力。</ins></pre></div></div>';$('suggestions').append(details);['接受','拒绝'].forEach(action=>{let b=document.createElement('button');b.textContent=action;b.disabled=busy||failed||s.state!=='待处理';b.onclick=()=>{if(action==='接受'&&docs[selected]!==s.base){s.state='过期';note('建议已过期，请重新校对，未覆盖当前内容。')}else if(action==='接受'){docs[selected]=s.base.replace('文挡','文档');s.state='已接受';translated=false;$('review').checked=false;note('已接受并模拟保存。')}else{s.state='已拒绝';note('已拒绝，原文保持。')}render()};$('suggestions').append(b)})}let exists=Object.values(docs).every(Boolean),pending=Object.values(suggestions).some(s=>['待处理','过期'].includes(s.state));$('summary').disabled=busy||failed;$('edit').disabled=busy||failed||!exists;$('proof').disabled=busy||failed||!exists;$('translate').disabled=busy||failed||!checked||pending;$('commit').disabled=busy||failed||!checked||pending||!translated||!$('review').checked;}
function run(t,fn){busy=true;note(t+'中…');render();setTimeout(()=>{busy=false;fn();render()},650)}
$('summary').onclick=()=>run('AI 总结',()=>{docs={'README.md':'# 项目介绍\n提供文挡编写能力。','FEATURES.md':'# 功能说明\n提供文挡编写能力。'};suggestions={};checked=false;translated=false;$('review').checked=false;note('模拟初稿已生成。真实流程需复制提示词交 Agent 执行并接收回执。')});
$('edit').onclick=()=>{$('editname').textContent=selected;$('input').value=docs[selected];$('input').hidden=false;$('preview').hidden=true;$('saveState').textContent='';$('editor').showModal()};function dirty(){return $('input').value!==docs[selected]}$('refresh').onclick=()=>{if(dirty()&&!confirm('放弃未保存内容并刷新？'))return;$('input').value=docs[selected];$('preview').textContent=docs[selected];$('saveState').textContent='已刷新'};$('previewBtn').onclick=()=>{$('preview').textContent=$('input').value;$('input').hidden=!$('input').hidden;$('preview').hidden=!$('input').hidden};$('save').onclick=()=>{docs[selected]=$('input').value;checked=false;translated=false;$('review').checked=false;$('saveState').textContent='已模拟保存；请重新校对与翻译。';render()};function closeEditor(){if(dirty()&&!confirm('放弃未保存内容并关闭？'))return;$('editor').close()}$('close').onclick=closeEditor;$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
$('proof').onclick=()=>run('AI 校对',()=>{suggestions={};Object.entries(docs).forEach(([f,t])=>{if(t.includes('文挡'))suggestions[f]={base:t,state:'待处理'}});checked=true;note('校对完成，请切换文件逐条处理建议；未处理建议会阻止翻译。')});$('translate').onclick=()=>run('翻译',()=>{translated=true;note($('langs').value==='cn'?'无其他语言，可跳过翻译并完成人工核对。':'已模拟生成英文译稿，请完成最终人工核对。')});$('review').onchange=render;$('langs').onchange=()=>{translated=false;render();note('语言集变化，请重新检查翻译目标。')};$('commit').onclick=()=>run('提交',()=>note('模拟提交成功 · demo-commit（非真实 hash），未合并或发布。'));$('empty').onclick=()=>{docs={'README.md':'','FEATURES.md':''};suggestions={};checked=false;translated=false;busy=false;failed=false;note('空态：尚无初稿。');render()};$('loading').onclick=()=>{busy=true;note('正在读取文档… 可点击「重试 / 恢复」结束模拟。');render()};$('failure').onclick=()=>{busy=false;failed=true;note('读取失败（模拟）：已保留正文，请重试。');render()};$('retry').onclick=()=>{busy=false;failed=false;note('已恢复。请先保存并处理全部建议，再翻译、人工核对和提交。');render()};$('clean').onclick=()=>{suggestions={};checked=true;note('模拟校对完成：未发现问题。');render()};note('请先 AI 总结，生成默认语言初稿。');render();
</script></html>
