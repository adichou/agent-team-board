<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>构建布局交互演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#243247;font:14px system-ui}main{max-width:1240px;margin:28px auto;padding:20px}h1{font-size:24px}button,input,select{font:inherit;border:1px solid #ccd4e0;border-radius:7px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #9bacff}.primary,.active{background:#405dd5;color:white}.bar,.acts,.head,.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar{padding:16px 0}.push{margin-left:auto}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px}.card,article{border:1px solid #d8dfea;background:white;border-radius:12px;padding:18px}.card{margin-bottom:12px}.selected{border:2px solid #405dd5}.muted,small{color:#637087}.acts{margin-top:16px}.row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:12px;padding:18px 0;border-bottom:1px solid #edf0f4;align-items:center}.pager{justify-content:flex-end;padding-top:20px}.feedback{padding:50px 12px;text-align:center}.head input{min-width:180px;flex:1}.head{margin:22px 0 10px}dialog{border:0;border-radius:14px;max-width:480px;padding:28px}dialog::backdrop{background:#16233c70}.badge{background:#e7f5ee;color:#277449;padding:3px 7px;border-radius:5px}.notice{padding:12px;background:#e9eefc;border-radius:8px;margin-bottom:20px}code{word-break:break-all}@media(max-width:760px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head input{width:100%}}
</style><main><h1>构建</h1><p class="muted">交互演示 · 数据均为虚构 · 每页 5 条仅用于演示</p><div class="notice">演示状态 <select id="phase" aria-label="演示状态"><option value="normal">正常</option><option value="empty">空列表</option><option value="loading">加载中</option><option value="error">读取失败</option></select></div><nav class="bar"><button id="versions" class="active">版本计划</button><button id="branches">分支浏览</button><button class="primary push" id="new">＋ 新建版本</button></nav><div id="layout" class="layout"><aside id="cards"></aside><article><h2 id="name"></h2><p class="muted" id="desc"></p><div class="head"><strong>关联条目与 commit</strong><input id="query" aria-label="搜索关联条目与 commit" placeholder="单号 / 标题 / commit"><button id="clear">清空</button><button disabled title="演示版本均不提供编辑">＋ 添加条目</button></div><small id="count"></small><div id="rows" aria-live="polite"></div><footer class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer></article></div><section id="branchPane" hidden class="card">分支浏览页签示意：既有分支列表与提交搜索保持原行为。</section></main><dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="close">关闭</button></dialog><script>
const $=id=>document.getElementById(id);let selected=0,page=1;const names=['示例 0.4.0','示例 0.5.0'];const data=Array.from({length:17},(_,i)=>({id:'DEMO-'+String(i+1).padStart(3,'0'),title:['改进构建布局','优化搜索反馈','修复版本选择'][i%3]+' '+(i+1),commit:(i+1).toString(16).padStart(8,'0')+'abcdef0123456789abcdef0123456789ab'}));
function modal(title,text){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').showModal()}
function cards(){$('cards').innerHTML=names.map((n,i)=>`<div class="card ${selected===i?'selected':''}"><button data-select="${i}" aria-label="查看 ${n}"><strong>${n}</strong></button> <span class="badge">${i?'计划中':'已合并'}</span><p class="muted">BLD-DEMO-${i+1} · ${i?8:17} 个关联单</p><div class="acts"><button disabled>AI 完善</button><button disabled>合并入 main</button><button disabled>删除</button><button class="primary" data-release="${i}" ${i?'disabled':''}>创建发布</button><button data-record="${i}">查看发布记录</button></div>${i?'<p class="muted">创建发布：请先完成合并入 main</p>':''}</div>`).join('');document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=+b.dataset.select;page=1;$('query').value='';cards();render()});document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>modal('创建发布 · '+names[+b.dataset.release],'模拟既有发布版本号核对弹层；目标为所点击卡片，未执行真实发布。'));document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>modal('产品发布记录','模拟跳转到发布模块的产品发布页签；入口来自 '+names[+b.dataset.record]+'，不假定既有页签已实现按版本过滤。'))}
function render(){const phase=$('phase').value,q=$('query').value.trim().toLowerCase();const all=phase==='empty'?[]:data.slice(0,selected?8:17),filtered=all.filter(x=>(x.id+' '+x.title+' '+x.commit).toLowerCase().includes(q)),total=Math.ceil(filtered.length/5);page=Math.max(1,Math.min(page,total||1));const ready=phase==='normal'||phase==='empty';$('name').textContent=names[selected];$('desc').textContent='目标分支 main · 示例版本说明';$('count').textContent=ready?`匹配 ${filtered.length} / 共 ${all.length} 条`:'列表数据暂不可用';$('prev').disabled=!ready||page<=1;$('next').disabled=!ready||page>=total;$('page').textContent=ready?(total?`${page} / ${total} 页`:'0 条'):'—';if(phase==='loading'){$('rows').innerHTML='<div class="feedback">正在加载关联条目…</div>';return}if(phase==='error'){$('rows').innerHTML='<div class="feedback" role="alert">关联条目读取失败，请重试。<p><button id="retry">重试</button></p></div>';$('retry').onclick=()=>{$('phase').value='normal';render()};return}$('rows').innerHTML=filtered.length?filtered.slice((page-1)*5,page*5).map(x=>`<div class="row"><code>${x.id}</code><span>${x.title}</span><code title="${x.commit}">${x.commit.slice(0,8)}</code></div>`).join(''):`<div class="feedback">${all.length?'没有匹配的条目，请清空搜索重试。':'暂无关联条目。可编辑版本可通过添加条目纳入需求或 Bug。'}</div>`}
$('query').oninput=()=>{page=1;render()};$('clear').onclick=()=>{$('query').value='';page=1;render();$('query').focus()};$('phase').onchange=render;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('new').onclick=()=>modal('新建版本','模拟原有右侧新建面板入口：填写版本信息、选择已完成条目与 commit。此演示不保存业务数据。');$('close').onclick=()=>$('modal').close();function tab(branch){$('layout').style.display=branch?'none':'';$('branchPane').hidden=!branch;$('new').hidden=branch;$('versions').className=branch?'':'active';$('branches').className=branch?'active':''}$('branches').onclick=()=>tab(true);$('versions').onclick=()=>tab(false);cards();render();
</script></html>
