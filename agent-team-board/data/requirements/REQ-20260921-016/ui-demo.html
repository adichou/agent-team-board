<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版本计划操作布局演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#243149;font:15px system-ui}header{padding:24px 32px;background:#fff;border-bottom:1px solid #dce2ec}h1{font-size:22px;margin:0 0 8px}p{line-height:1.7}.muted{color:#65738a;font-size:13px}button,select,input,textarea{font:inherit;border:1px solid #cad3e1;border-radius:7px;padding:8px 12px;background:#fff;color:inherit}button{cursor:pointer}button:hover{background:#edf2ff}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #799cf0}main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:24px 32px}.card,article{background:#fff;border:1px solid #dce2ec;border-radius:12px;padding:20px}.card{margin-bottom:12px}.selected{border:2px solid #4c74d9}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.row strong{min-width:0;overflow-wrap:anywhere}.danger{color:#b73540}.actions{display:flex;gap:8px;flex-shrink:0}nav{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}.active{background:#e6edff;border-color:#6483d5}.badge{font-size:12px;background:#eaf0fc;padding:3px 7px;border-radius:5px}#notice{padding:8px 32px;min-height:38px;color:#345dad}dialog{border:1px solid #cad3e1;border-radius:14px;max-width:550px;width:90%;padding:24px}dialog::backdrop{background:#20304c70}textarea,input{width:100%;margin:8px 0}textarea{height:110px}.error{color:#b73540}footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:760px){main{grid-template-columns:1fr;padding:16px}.row{flex-wrap:wrap}.actions{margin-left:auto}} </style>
<header><h1>版本计划 · 操作入口优化</h1><p class="muted">REQ-20260921-016 · 交互原型，全部为内存示例，不执行真实操作。</p><label>场景 <select id="scene"><option value="normal">正常</option><option value="empty">空列表</option><option value="loading">加载中</option><option value="error">加载失败</option><option value="merging">合并中</option><option value="pushed">已推送正式发布</option><option value="merged">已合并未推送</option></select></label> <button id="reset">恢复示例</button></header><div id="notice" role="status" aria-live="polite"></div><main><section><h2>版本计划</h2><div id="list"></div></section><article id="detail"></article></main><dialog id="modal"></dialog>
<script>
const $=s=>document.querySelector(s);let rows=[{id:'BLD-20260921-001',name:'版本计划操作优化',desc:'精简列表操作，将 AI 完善集中到详情。'},{id:'BLD-20260921-002',name:'另一版本：长标题换行与删除按钮右对齐演示',desc:'用于验证切换版本后的操作目标。'}],selected=rows[0].id,step='版本计划';const steps=['版本计划','关联条目与提交','文档编写','合并入 main','正式发布'];function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function note(s){$('#notice').textContent=s}function close(){$('#modal').close()}function show(s){$('#modal').innerHTML=s;$('#modal').showModal()}function render(){let mode=$('#scene').value;let unavailable=['empty','loading','error'].includes(mode);$('#list').innerHTML=unavailable?`<p>${{empty:'暂无版本计划',loading:'正在加载版本计划…',error:'版本计划读取失败'}[mode]}</p>${mode==='error'?'<button id="retry">重试</button>':''}`:rows.map(v=>`<div class="card ${v.id===selected?'selected':''}"><div class="row"><strong title="${esc(v.name)}">${esc(v.name)}</strong><button class="danger" data-delete="${v.id}" ${mode==='merging'?'disabled title="合并中，不可删除"':''}>删除</button></div><p class="muted">${v.id}</p><button data-select="${v.id}">查看详情</button> <span class="badge">${mode==='normal'?'计划中':$('#scene').selectedOptions[0].text}</span></div>`).join('')||'<p>暂无版本计划</p>';let v=rows.find(v=>v.id===selected);$('#detail').innerHTML=unavailable||!v?'<p class="muted">'+(mode==='loading'?'详情加载中…':mode==='error'?'数据读取失败，请重试。':'请选择版本计划')+'</p>':`<h2>${esc(v.name)}</h2><p class="muted">${v.id}</p><nav>${steps.map(s=>`<button data-step="${s}" class="${s===step?'active':''}">${s}</button>`).join('')}</nav><div id="body">${step==='版本计划'?`<div class="row"><span>描述</span><div class="actions"><button id="ai" ${['merging','pushed'].includes(mode)?'disabled':''}>AI 完善</button><button id="edit" ${mode==='merging'?'disabled':''}>编辑</button></div></div><p>${esc(v.desc)}</p>${['merging','pushed'].includes(mode)?`<p class="muted">${mode==='merging'?'合并中，暂不可 AI 完善或编辑。':'已正式发布，不允许再 AI 完善；编辑沿用原规则。'}</p>`:''}`:step==='合并入 main'?'<h3>合并入 main</h3><button id="merge">合并入 main</button><p class="muted">沿用详情步骤内的门禁和确认流程。</p>':step==='正式发布'?'<h3>正式发布</h3><button id="publish">创建并预检</button><h4>发布记录</h4><p>暂无发布记录（示例）</p>':'<p>保留现有步骤内容（示例）。</p>'}</div>`;document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=b.dataset.step;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteModal(b.dataset.delete));$('#retry')?.addEventListener('click',()=>{$('#scene').value='normal';render();note('已重新加载示例')});$('#ai')?.addEventListener('click',()=>ai(v));$('#edit')?.addEventListener('click',()=>edit(v));$('#merge')?.addEventListener('click',()=>note('示例：进入现有合并核对流程，不执行真实合并'));$('#publish')?.addEventListener('click',()=>note('示例：进入现有创建与预检流程，不执行真实发布'))}
function deleteModal(id){let v=rows.find(v=>v.id===id);show(`<h2>删除版本确认</h2><p>${esc(v.name)} · ${v.id}</p><p>此操作不可撤销。演示只移除内存示例。</p><label><input id="fail" type="checkbox" style="width:auto"> 模拟删除失败</label><p id="err" role="alert"></p><footer><button id="cancel">取消</button><button class="danger" id="confirm">确认删除</button></footer>`);$('#cancel').onclick=close;$('#confirm').onclick=()=>{if($('#fail').checked){$('#err').textContent='删除失败：模拟服务不可用，请取消勾选后重试';return}rows=rows.filter(x=>x.id!==id);if(selected===id)selected=null;close();render();note('示例版本已删除')}}
function edit(v){$('#body').innerHTML=`<label>版本名称<input id="name" value="${esc(v.name)}"></label><label>描述<textarea id="desc">${esc(v.desc)}</textarea></label><button id="save">保存</button> <button id="cancelEdit">取消</button>`;$('#cancelEdit').onclick=render;$('#save').onclick=()=>{if(!$('#name').value.trim()){note('请输入版本名称');return}v.name=$('#name').value;v.desc=$('#desc').value;render();note('示例编辑已保存')}}
function ai(v){show(`<h2>AI 完善 · ${v.id}</h2><p>复制提示词 → 粘贴回答 → 解析 → 应用回填</p><button id="copy">模拟复制提示词</button><textarea id="answer" placeholder="填写示例描述以模拟解析；留空可查看失败反馈"></textarea><p id="feedback" role="status"></p><footer><button id="cancel">取消</button><button id="parse">解析</button><button id="apply" disabled>应用回填</button></footer>`);$('#cancel').onclick=close;$('#copy').onclick=()=>$('#feedback').textContent='已模拟复制；未访问剪贴板';$('#parse').onclick=()=>{let ok=!!$('#answer').value.trim();$('#feedback').textContent=ok?'解析成功，可以应用示例描述。':'解析失败：请填写示例回答。';$('#apply').disabled=!ok};$('#answer').oninput=()=>$('#apply').disabled=true;$('#apply').onclick=()=>{let value=$('#answer').value;$('#apply').disabled=true;$('#parse').disabled=true;$('#cancel').disabled=true;$('#feedback').textContent='应用中…';setTimeout(()=>{v.desc=value;close();render();note('AI 回填示例已应用到 '+v.id)},500)}}
$('#scene').onchange=()=>{note('');render()};$('#reset').onclick=()=>location.reload();render();
</script></html>
