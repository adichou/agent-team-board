<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目管理演示</title><style>body{margin:0;background:#101723;color:#e8edf6;font:16px system-ui}header,main{padding:24px;max-width:1000px;margin:auto}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin-right:auto}button,select,input{font:inherit;border:1px solid #53637c;border-radius:8px;padding:10px;background:#202f45;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:wait}input{width:min(90%,580px)}section{border:1px solid #43546c;border-radius:12px;padding:20px;margin:16px 0;background:#182335}.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #43546c;padding:16px 0;flex-wrap:wrap}.info{flex:1;min-width:190px;overflow-wrap:anywhere}small{display:block;color:#aebdd2;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}#notice{padding:14px;background:#253e58;border-radius:8px}#confirm{border-color:#efb35e}button.danger{color:#ffd0aa}label{display:block;margin:12px 0}p{line-height:1.6}</style><header><h1>Agent Team Board</h1><select id="switcher" aria-label="当前项目"></select><button id="manage">管理项目</button></header><main><p>交互原型 · 所有路径均为模拟数据，不读写磁盘。</p><label>演示状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><p id="board"></p><section id="panel"><div class="actions"><h2 style="flex:1;margin:0">项目管理</h2><button id="close">关闭</button></div><label>操作 <select id="mode"><option value="init">初始化项目</option><option value="import">导入项目</option></select></label><label>项目根目录绝对路径 <input id="path" placeholder="/demo/new-project"></label><small>模拟：路径含 existing 表示已有数据，含 missing 表示目录不存在；其他目录可初始化。</small><p id="target"></p><button id="submit">确认目标并提交</button><p id="notice" role="status" aria-live="polite">请选择操作或管理已有项目。</p><div id="list"></div><section id="confirm" hidden><p id="confirmText"></p><button id="cancel">取消</button> <button id="remove" class="danger">确认移出</button></section></section></main><script>
const $=id=>document.getElementById(id);let projects=['/demo/agent-team-board','/demo/existing-project'],current=projects[0],pending=null,busy=false;const known=new Set(projects);function note(t){$('notice').textContent=t}function render(){$('switcher').replaceChildren();for(const p of projects){const o=new Option(p.split('/').pop(),p);o.selected=p===current;$('switcher').add(o)}$('switcher').disabled=busy||!projects.length;$('board').textContent=current?'当前项目：'+current:'暂无项目，请初始化或导入项目。';$('list').replaceChildren();if(!projects.length){$('list').textContent='暂无项目。使用上方表单开始。'}for(const p of projects){const row=document.createElement('div');row.className='row';const info=document.createElement('div');info.className='info';info.textContent=p.split('/').pop()+(p===current?' · 当前':'');const small=document.createElement('small');small.textContent=p;info.append(small);row.append(info);for(const name of ['切换','移出']){const b=document.createElement('button');b.textContent=name;b.disabled=busy;b.onclick=()=>{if(name==='切换'){current=p;render();note('已切换：'+p)}else{pending=p;$('confirm').hidden=false;$('confirmText').textContent='移出 '+p+'？仅从列表移出，目录及需求、Bug 文档保留。'}};row.append(b)}$('list').append(row)}for(const id of ['submit','mode','path','remove','cancel'])$(id).disabled=busy}
$('path').oninput=()=>{$('target').textContent='请确认目标：'+$('path').value.trim()};$('switcher').onchange=()=>{current=$('switcher').value;render()};$('manage').onclick=()=>{$('panel').hidden=false};$('close').onclick=()=>{$('panel').hidden=true};$('cancel').onclick=()=>{pending=null;$('confirm').hidden=true;note('已取消，项目列表未变。')};$('remove').onclick=()=>{projects=projects.filter(p=>p!==pending);if(current===pending)current=projects[0]||'';note('已移出 '+pending+'，原文档保留，可重新导入。');pending=null;$('confirm').hidden=true;render()};$('submit').onclick=()=>{const p=$('path').value.trim().replace(/\/+$/,'');if(!p.startsWith('/'))return note('请输入项目根目录绝对路径。');if(p.includes('missing'))return note('目录不存在，请修改路径后重试。');if(projects.includes(p)){current=p;render();return note('该项目已在列表，已切换，不重复添加。')}const exists=known.has(p)||p.includes('existing');if($('mode').value==='init'&&exists)return note('已有看板数据，不覆盖；请改用导入。');if($('mode').value==='import'&&!exists)return note('未找到看板数据，请改用初始化。');known.add(p);projects.push(p);current=p;render();note('操作成功：'+p)};$('state').onchange=()=>{const s=$('state').value;busy=s==='loading';pending=null;$('confirm').hidden=true;if(s==='empty'){projects=[];current=''}else if(s==='normal'&&!projects.length){projects=['/demo/agent-team-board','/demo/existing-project'];current=projects[0]}render();note(s==='loading'?'正在加载项目列表…请选择正常状态恢复。':s==='error'?'读取失败：模拟权限不足。原列表保留，点击重试恢复。':s==='empty'?'暂无项目，请初始化或导入。':'已加载项目列表。');if(s==='error'){const b=document.createElement('button');b.textContent='重试';b.onclick=()=>{$('state').value='normal';$('state').onchange()};$('notice').append(' ',b)}};render();
</script></html>
