<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改需求 · 侧拉面板演示</title>
<style>
:root{color-scheme:light dark;--bg:#f3f5f9;--panel:white;--text:#202a3c;--border:#d5dce8;--muted:#667085;--accent:#3568d4}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui;background:var(--bg);color:var(--text)}main{padding:28px;max-width:800px}h1{font-size:24px}button,select,input,textarea{font:inherit;color:inherit;border:1px solid var(--border);border-radius:7px;padding:9px;background:var(--panel)}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:white}article{background:var(--panel);padding:22px;margin-top:20px;border:1px solid var(--border);border-radius:12px}small,p.hint{color:var(--muted)}aside{position:fixed;right:0;top:0;bottom:0;width:min(560px,92vw);background:var(--panel);border-left:1px solid var(--border);box-shadow:-12px 0 35px #0002;display:flex;flex-direction:column}aside[hidden]{display:none}header{display:flex;justify-content:space-between;align-items:start;padding:20px;border-bottom:1px solid var(--border);gap:12px}h2{font-size:18px;margin:0}header p{margin:6px 0 0}.body{overflow:auto;flex:1;padding:20px}label{display:block;margin-bottom:20px}input,textarea{width:100%;margin-top:7px}textarea{min-height:230px;resize:vertical}footer{display:flex;gap:10px;justify-content:end;margin-top:20px}.notice{padding:12px;border-radius:8px;background:var(--bg);margin-bottom:15px;white-space:pre-wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap}#toast{margin-top:20px;color:var(--accent)}@media(max-width:640px){aside{width:100vw;border:0}main{padding:16px}}@media(prefers-color-scheme:dark){:root{--bg:#171b24;--panel:#232a37;--text:#edf2ff;--border:#465164;--muted:#a8b4c8}}
</style><main><small>交互原型 · 内存模拟，不写入项目</small><h1>需求看板</h1><p>右侧修改面板参考新建条目，主界面无遮罩。切换场景后点击修改查看；面板打开时点击主界面不关闭，重复点击修改不叠加，Esc / 取消 / ✕ 关闭。</p><div class="toolbar"><label>演示场景 <select id="scenario"><option value="normal">正常</option><option value="empty">空描述</option><option value="loading">读取加载</option><option value="readfail">读取失败</option><option value="savefail">保存失败</option></select></label></div><article><small>REQ-DEMO-001 · 待接受（模拟）</small><h3 id="cardTitle">统一需求编辑体验</h3><p id="cardDesc">将修改对话框调整为右侧面板。</p><button id="open">✎ 修改</button> <button id="details">打开详情</button><div id="detail" hidden><hr><strong>需求详情</strong><p>从详情打开编辑后，关闭编辑仍保留此处。</p><button id="detailEdit">✎ 修改</button></div></article><p id="toast" role="status" aria-live="polite"></p></main>
<aside id="panel" hidden role="dialog" aria-labelledby="heading"><header><div><h2 id="heading">编辑 REQ-DEMO-001</h2><p class="hint">仅待接受条目可改 · 标题与描述</p></div><button id="close" aria-label="关闭修改面板">✕</button></header><div class="body"><div id="notice" class="notice" role="status" aria-live="polite"></div><button id="retry" hidden>重新读取</button><button id="loaded" hidden>模拟读取完成</button><form id="form"><label>标题（不超过 120 字，Enter 保存）<input id="title" maxlength="120"></label><label>描述（多行，Enter 换行，整体替换描述章节）<textarea id="desc" placeholder="描述可留空，后续补充"></textarea></label><footer><button type="button" id="cancel">取消</button><button id="save" class="primary">保存</button></footer></form></div></aside>
<script>
const $=id=>document.getElementById(id);let origin,busy=false,baseline,saveFailure=false;const stored={title:'统一需求编辑体验',desc:'将修改对话框调整为右侧面板。'};
function feedback(s){$('notice').textContent=s}function lock(v){busy=v;['title','desc','save','close','cancel'].forEach(id=>$(id).disabled=v);$('save').textContent=v?'保存中…':'保存'}
function ready(){ $('retry').hidden=true;$('loaded').hidden=true;$('form').hidden=false;lock(false);$('title').value=baseline.title;$('desc').value=baseline.desc;feedback(baseline.desc?'内容已读取，可以修改。':'描述为空，可留空或补充。');$('title').focus() }
function show(e){if(!$('panel').hidden)return;origin=e.currentTarget;baseline={...stored};if($('scenario').value==='empty')baseline.desc='';saveFailure=$('scenario').value==='savefail';$('panel').hidden=false;$('toast').textContent='';$('retry').hidden=true;$('loaded').hidden=true;lock(false);if(['loading','readfail'].includes($('scenario').value)){$('form').hidden=true;feedback($('scenario').value==='loading'?'正在读取描述…':'读取描述失败：模拟网络错误，请重试。');$('loaded').hidden=$('scenario').value!=='loading';$('retry').hidden=$('scenario').value!=='readfail';$('close').focus()}else ready()}
function close(){if(busy)return;$('panel').hidden=true;origin?.focus()}
$('open').onclick=show;$('detailEdit').onclick=show;$('details').onclick=()=>{$('detail').hidden=!$('detail').hidden};$('close').onclick=close;$('cancel').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').hidden){e.preventDefault();close()}});$('loaded').onclick=ready;$('retry').onclick=ready;
$('form').onsubmit=e=>{e.preventDefault();if(busy)return;const title=$('title').value.trim(),desc=$('desc').value.trim();if(!title){feedback('标题不能为空');$('title').focus();return}if(title===baseline.title&&desc===baseline.desc.trim()){feedback('标题与描述均无变化');return}lock(true);feedback('正在保存，请稍候…');setTimeout(()=>{lock(false);if(saveFailure){saveFailure=false;feedback('保存失败：模拟网络错误。输入已保留，再次点击保存重试。');return}stored.title=title;stored.desc=desc;$('cardTitle').textContent=title;$('cardDesc').textContent=desc||'暂无描述';close();$('toast').textContent='✓ REQ-DEMO-001 标题与描述已更新（仅演示内存）'},1100)};
</script></html>
