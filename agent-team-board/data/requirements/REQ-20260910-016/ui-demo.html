<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排序与搜索定位组演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#202b3d;font:15px system-ui}main{max-width:1050px;margin:32px auto;padding:20px}button,select,input{font:inherit;padding:10px;border:1px solid #bdc8d8;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #668eff}header,.head,.locate,.search,.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head{justify-content:space-between;margin:24px 0 12px}.locate{max-width:100%;margin-left:auto}.search{flex-wrap:nowrap;flex:1;min-width:150px;background:white;padding:0 8px;border:1px solid #bdc8d8;border-radius:8px}.search input{width:100%;min-width:45px;border:0}.search span{white-space:nowrap;color:#596779}h1{font-size:22px}h2{font-size:17px}.feedback{padding:14px;background:#e5edfc;border-radius:8px;margin:12px 0}.card{background:white;border:1px solid #d8dfeb;border-radius:10px;padding:18px;margin:10px 0}.muted{color:#62718a}small{display:block;margin-top:6px}.controls{border-top:1px solid #ccd5e4;padding-top:18px;margin-top:24px}[hidden]{display:none!important}@media(max-width:600px){main{margin:0;padding:14px}.locate{width:100%;margin:0}.search{min-width:140px}select{max-width:100%}}
</style><main><header><h1>Agent Team Board</h1><label>模块 <select id="module"><option>需求</option><option>讨论</option><option>文件</option></select></label></header><p class="muted">REQ-20260910-016 · 布局提案 / 示例数据</p><div class="head"><h2 id="sub">需求与 Bug</h2><div class="locate"><select id="sort" aria-label="列表排序"><option value="updated-desc">最新更新</option><option value="updated-asc">最早更新</option><option value="created-desc">最新创建</option><option value="created-asc">最早创建</option><option value="id-asc">单号</option></select><div class="search"><span id="scope">需求</span><input id="q" type="search" placeholder="搜单号 / 标题…" aria-label="搜索当前模块"><button id="clear" aria-label="清除搜索">×</button><span>/</span></div></div></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="list"></div><div class="controls"><strong>演示状态</strong><select id="state" aria-label="模拟状态"><option value="normal">正常</option><option value="empty">空结果</option><option value="loading">加载</option><option value="error">失败</option></select><button id="retry" hidden>重试</button><button id="reset">恢复示例</button></div><p class="muted">状态控件仅供验收演示，不属于产品界面。切换排序保留关键词；可缩窄窗口检查布局。</p></main><script>
const $=id=>document.getElementById(id),rows=[{id:'REQ-DEMO-001',title:'排序菜单靠近搜索',created:1,updated:3},{id:'REQ-DEMO-002',title:'列表定位与筛选',created:2,updated:1},{id:'REQ-DEMO-003',title:'搜索反馈说明',created:3,updated:2}];
function render(){const mode=$('module').value,s=$('state').value;$('sort').hidden=mode!=='需求';$('scope').textContent=mode;$('sub').textContent=mode==='需求'?'需求与 Bug':mode;$('clear').hidden=!$('q').value;$('retry').hidden=s!=='error';const term=$('q').value.trim().toLowerCase();let items=rows.filter(x=>(x.id+' '+x.title).toLowerCase().includes(term));const [key,dir]=$('sort').value.split('-');items.sort((a,b)=>key==='id'?a.id.localeCompare(b.id):(a[key]-b[key])*(dir==='asc'?1:-1));$('list').replaceChildren();if(mode!=='需求'){$('feedback').textContent='当前为'+mode+'模块，需求排序入口隐藏；切回需求恢复选择。';return}if(s==='loading'){$('feedback').textContent='搜索中… 保留当前排序和关键词';return}if(s==='error'){$('feedback').textContent='搜索失败，请重试。排序和关键词已保留。';return}if(s==='empty')items=[];$('feedback').textContent=items.length?'命中 '+items.length+' 项 · '+$('sort').selectedOptions[0].textContent:'没有匹配结果，可清空关键词或恢复示例。';items.forEach(x=>{const e=document.createElement('article');e.className='card';e.textContent=x.id+' · '+x.title;const t=document.createElement('small');t.className='muted';t.textContent='示例创建顺序 '+x.created+' / 更新顺序 '+x.updated;e.append(t);$('list').append(e)})}
$('sort').onchange=()=>{try{localStorage.setItem('req016-demo-sort',$('sort').value)}catch{}render()};try{const saved=localStorage.getItem('req016-demo-sort');if([...$('sort').options].some(o=>o.value===saved))$('sort').value=saved}catch{}$('q').oninput=render;$('clear').onclick=()=>{$('q').value='';render();$('q').focus()};$('module').onchange=render;$('state').onchange=render;$('retry').onclick=()=>{$('state').value='normal';render()};$('reset').onclick=()=>{$('state').value='normal';$('q').value='';render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement===$('q')){$('clear').click()}if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('q').focus()}});render();
</script></html>
