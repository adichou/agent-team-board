<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不存在目录检测演示</title><style>body{font:16px system-ui;background:#edf1f6;color:#243047;margin:24px}main{max-width:820px;margin:auto;background:white;padding:28px;border-radius:16px}button,select{font:inherit;padding:9px;margin:4px;border:1px solid #becadc;border-radius:7px;background:#f7f9fd}button:enabled{cursor:pointer}button:disabled{opacity:.45}.row{padding:16px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}.muted{color:#637087}#notice,#confirm{padding:16px;background:#edf3ff;border-radius:8px;margin:12px 0}.badge{float:right}h1{font-size:24px}button:focus-visible{outline:3px solid #4978ed}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style><main><h1>管理项目</h1><p class="muted">需求交互演示 · 虚构目录 · 仅更新内存列表</p><label>演示场景 <select id="scene"><option value="normal">正常（含不存在目录）</option><option value="empty">无项目</option><option value="healthy">全部存在</option><option value="loading">检测中</option><option value="error">检测失败</option><option value="partial">部分移出失败</option></select></label><p id="current"></p><button id="scan">重新检测</button><button id="remove">移出所有不存在目录</button><div id="notice" role="status" aria-live="polite"></div><div id="list"></div><section id="confirm" hidden><strong>确认移出以下目录？</strong><pre id="paths"></pre><p>仅从列表移出，不删除目录与文档，不停止任务。恢复目录后可重新导入。</p><button id="yes">确认移出</button><button id="cancel">取消</button></section></main><script>
const $=id=>document.getElementById(id);let rows=[],busy=false,failed=false,timer,candidates=[];const seed=()=>[{path:'/example/active-project',state:'存在'},{path:'/example/old-project',state:'不存在'},{path:'/example/archived-project',state:'不存在'},{path:'/example/private-project',state:'检测失败：权限不足'}];function render(){const missing=rows.filter(r=>r.state==='不存在');$('remove').disabled=busy||failed||!missing.length;$('scan').disabled=busy;$('yes').disabled=busy;$('cancel').disabled=busy;$('remove').textContent=`移出所有不存在目录（${missing.length}）`;$('current').textContent=rows.length?'当前项目：'+rows[0].path:'当前未选择项目';$('list').replaceChildren();for(const r of rows){const row=document.createElement('div');row.className='row';row.textContent=r.path;const badge=document.createElement('span');badge.className='badge';badge.textContent=busy?'检测/处理中…':failed?'待确认':r.state;row.append(badge);$('list').append(row)}if(!rows.length)$('list').textContent='暂无项目。可通过原有初始化项目或导入项目入口添加。'}function summary(){return `共 ${rows.length} 项，不存在 ${rows.filter(r=>r.state==='不存在').length} 项，检测失败 ${rows.filter(r=>r.state.startsWith('检测失败')).length} 项。`+(rows.every(r=>r.state!=='不存在')?'未发现不存在的目录。':'')}function reset(){clearTimeout(timer);busy=false;failed=false;$('confirm').hidden=true;const s=$('scene').value;rows=s==='empty'?[]:s==='healthy'?seed().slice(0,1):seed();if(s==='loading')busy=true;if(s==='error')failed=true;$('notice').textContent=busy?'检测中…（可切换场景）':failed?'检测请求失败，请重新检测。':summary();render()}$('scene').onchange=reset;$('scan').onclick=()=>{busy=true;failed=false;$('confirm').hidden=true;$('notice').textContent='检测中…';render();timer=setTimeout(()=>{busy=false;$('notice').textContent=summary();render()},700)};$('remove').onclick=()=>{candidates=rows.filter(r=>r.state==='不存在');$('paths').textContent=candidates.map(r=>r.path).join('\n');$('confirm').hidden=false;$('yes').focus()};$('cancel').onclick=()=>{$('confirm').hidden=true;$('notice').textContent='已取消，项目列表未变更。'};$('yes').onclick=()=>{busy=true;$('notice').textContent='重新核实候选并移出中…';render();timer=setTimeout(()=>{const partial=$('scene').value==='partial';const removed=partial?candidates.slice(0,1):candidates;rows=rows.filter(r=>!removed.includes(r));busy=false;$('confirm').hidden=true;$('notice').textContent=`成功 ${removed.length} 项，跳过 0 项，失败 ${candidates.length-removed.length} 项。`+(partial?'失败：'+candidates[1].path+'（模拟写入失败）；记录保留，请重新检测后重试。':'已更新项目列表。');render()},700)};reset();</script></html>
