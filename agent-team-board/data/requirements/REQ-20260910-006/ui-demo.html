<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>列表操作单行演示</title><style>
*{box-sizing:border-box}body{font:15px system-ui;background:#10151d;color:#e1e8f2;padding:24px;margin:0}h1{font-size:22px}button,select,input{font:inherit}button,select{background:#202a38;color:inherit;border:1px solid #485770;border-radius:8px;padding:8px 12px}button{cursor:pointer;white-space:nowrap}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid #82b7ff;outline-offset:2px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#board{width:760px;max-width:100%;border:1px solid #485770;padding:12px;border-radius:12px}.card{background:#18212d;padding:14px;border-radius:10px;margin-bottom:12px}.top{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.info{display:flex;align-items:center;gap:8px;max-width:100%;flex-wrap:wrap}.id{font:14px monospace;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:4px 2px;margin-left:auto}.actions button{flex:none;min-width:74px}.title{font-weight:600;line-height:1.6;margin:14px 0}.time{text-align:right;color:#93a5be;font-size:13px}#feedback{min-height:48px;margin-top:16px;color:#9dc5ff}dialog{background:#18212d;color:#e1e8f2;border:1px solid #485770;border-radius:12px;max-width:90vw}dialog input{display:block;width:100%;padding:8px;margin:12px 0}dialog::backdrop{background:#0009}.hint{color:#a4b4c9;line-height:1.6}
</style><h1>列表操作按钮平铺在一行</h1><p class="hint">离线交互草图 · 所有操作仅模拟，不修改项目数据。窄宽度可横向滚动操作区。</p><div class="controls"><label>容器宽度 <select id="width"><option>760</option><option>480</option><option>320</option><option>240</option></select></label><label>列表状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><label>条目状态 <select id="status"><option value="submitted">待接受</option><option value="accepted">已接受</option></select></label><label><input type="checkbox" id="fail">模拟操作失败</label><button id="reset">重置</button></div><main id="board" aria-label="需求列表"></main><div id="feedback" role="status" aria-live="polite"></div><dialog id="modal"><form method="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><input id="edit" aria-label="条目标题"><button value="cancel">取消</button> <button value="ok">确认</button></form></dialog><script>
const $=id=>document.getElementById(id);let title='支持项目管理与较长的需求标题展示，检查按钮与标题之间没有遮挡',deleted=false,pending=false,action='';function feedback(s){$('feedback').textContent=s}function render(){const state=$('state').value;const board=$('board');board.style.width=$('width').value+'px';if(state==='loading'){board.textContent='正在加载列表…';return}if(state==='empty'||deleted){board.textContent='暂无条目';return}if(state==='error'){board.innerHTML='<p role="alert">列表加载失败，请重试。</p><button id="retry">重试</button>';$('retry').onclick=()=>{$('state').value='normal';render();feedback('已重新加载模拟列表')};return}board.innerHTML='<article class="card"><div class="top"><div class="info"><input type="checkbox" aria-label="选择 REQ-20260910-006"><span class="id">REQ-20260910-006</span></div><div class="actions" aria-label="条目操作"><button data-action="复制">复制</button>'+($('status').value==='submitted'?'<button data-action="接受">✓ 接受</button><button data-action="修改">✎ 修改</button><button data-action="删除">🗑 删除</button>':'')+'</div></div><div class="title"></div><div class="time">09-10 08:41</div></article>';board.querySelector('.title').textContent=title;board.querySelector('.card').onclick=()=>feedback('模拟打开 REQ-20260910-006 详情');board.querySelector('input').onclick=e=>{e.stopPropagation();feedback(e.target.checked?'已选择条目':'已取消选择')};board.querySelectorAll('[data-action]').forEach(b=>{b.disabled=pending;b.onclick=e=>{e.stopPropagation();action=b.dataset.action;if(action==='修改'||action==='删除'){ $('dialogTitle').textContent=action==='修改'?'修改标题':'删除条目';$('dialogText').textContent=action==='删除'?'仅模拟删除，确认后可用重置恢复。':'仅编辑演示标题。';$('edit').hidden=action!=='修改';$('edit').value=title;$('modal').showModal()}else run(action,b)}})}function run(a,b){pending=true;document.querySelectorAll('[data-action]').forEach(x=>x.disabled=true);feedback(a+'处理中…');setTimeout(()=>{pending=false;if($('fail').checked){feedback(a+'失败，请重试');render();return}if(a==='接受')$('status').value='accepted';if(a==='删除')deleted=true;if(a==='修改')title=$('edit').value.trim()||title;render();if(a==='复制'){const btn=document.querySelector('[data-action="复制"]');if(btn)btn.textContent='已复制 ✓';feedback('模拟复制成功：REQ-20260910-006（未写入剪贴板）')}else feedback(a+'成功（模拟）')},650)}$('modal').addEventListener('close',()=>{if($('modal').returnValue==='ok')run(action)});['width','state','status'].forEach(id=>$(id).onchange=render);$('reset').onclick=()=>{deleted=false;$('state').value='normal';$('status').value='submitted';$('fail').checked=false;render();feedback('演示已重置')};render();
</script></html>
