<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REQ-20260914-002 分支浏览 · 提交记录搜索 — 界面演示</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --ink: #1f2328; --muted: #6a737d;
    --brand: #3b82f6; --brand-ink: #ffffff; --ok: #1a9c60; --err: #d13c3c; --mark: #ffe58f;
    --hover: #f0f3f7; --sel: #e8f1fe; --chip: #eef1f4; --shadow: 0 1px 3px rgba(16,24,40,.08);
  }
  html[data-theme="dark"] {
    --bg: #10151c; --panel: #171e27; --line: #2a3340; --ink: #e6edf3; --muted: #8b98a5;
    --brand: #4c8dff; --brand-ink: #0b1220; --ok: #37b57c; --err: #f07171; --mark: #7a5b12;
    --hover: #1d2632; --sel: #1c3050; --chip: #222c38; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; }

  /* ---- 顶栏（构建页签激活，仅作布局定位示意） ---- */
  .topbar { display: flex; align-items: center; gap: 18px; padding: 8px 18px; background: var(--panel);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; }
  .module-nav { display: flex; gap: 4px; }
  .module-nav button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .module-nav button:hover { background: var(--hover); color: var(--ink); }
  .module-nav button.active { background: var(--sel); color: var(--brand); font-weight: 600; }

  .page-head { display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .page-head .sub { color: var(--muted); }
  .page-head .mod-search { flex: 1; max-width: 340px; margin-left: auto; padding: 5px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--muted); }

  main { max-width: 1180px; margin: 0 auto; padding: 14px 18px 90px; }

  /* ---- 演示控制条 ---- */
  .demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 12px;
    background: var(--panel); border: 1px dashed var(--brand); border-radius: 10px; box-shadow: var(--shadow); }
  .demo-bar .t { font-weight: 700; color: var(--brand); margin-right: 4px; }
  .demo-bar button { border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .demo-bar button:hover { background: var(--hover); }
  .demo-bar button.on { border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .demo-bar .note { color: var(--muted); font-size: 12px; }

  /* ---- 构建模块：子页签 ---- */
  .rel-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .rel-tabs button { border: 1px solid var(--line); background: var(--panel); padding: 5px 14px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--muted); }
  .rel-tabs button.active { border-bottom-color: var(--panel); color: var(--brand); font-weight: 600; background: var(--panel); }

  /* ---- 分支浏览分栏 ---- */
  .rel-split { display: grid; grid-template-columns: 240px 1fr; gap: 12px; }
  @media (max-width: 860px) { .rel-split { grid-template-columns: 1fr; } }
  .rel-list, .rel-detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
  .bld-branch-tools { display: flex; gap: 6px; margin-bottom: 8px; }
  .bld-group-head { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  .bld-branch { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
  .bld-branch:hover { background: var(--hover); }
  .bld-branch.sel { background: var(--sel); }
  .bld-branch span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bld-branch .st { margin-left: auto; font-size: 12px; border-radius: 6px; padding: 0 6px; background: var(--chip); color: var(--muted); flex: none; }
  .bld-branch .st.run { background: var(--sel); color: var(--brand); }

  /* ---- 提交记录面板 ---- */
  .bld-log-head { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .bld-log-head strong { font-size: 15px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .btn:hover { background: var(--hover); }
  .btn.small { font-size: 12px; padding: 3px 8px; }
  .btn.quiet { background: var(--chip); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* REQ-20260914-002：搜索行（新增，位于面板头部下方） */
  .bld-log-search { display: flex; align-items: center; gap: 6px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .bld-log-search input[type="text"] { flex: 1; max-width: 340px; padding: 5px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); }
  .bld-log-search input[type="text"]:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .bld-log-search .hint { color: var(--muted); font-size: 12px; }

  .bld-search-count { padding: 8px 0 2px; color: var(--muted); font-size: 12px; }
  .bld-search-count b { color: var(--ink); }

  ul.bld-log { list-style: none; margin: 6px 0 4px; padding: 0; }
  ul.bld-log li { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; border-radius: 6px; flex-wrap: wrap; }
  ul.bld-log li:hover { background: var(--hover); }
  ul.bld-log code { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; flex: none; }
  ul.bld-log .subj { flex: 1; min-width: 220px; }
  ul.bld-log .meta { color: var(--muted); font-size: 12px; flex: none; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .bld-log-pager { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 0 4px; border-top: 1px solid var(--line); margin-top: 8px; }
  .bld-log-pager button, .bld-log-pager .gap { border: 1px solid var(--line); background: var(--panel); border-radius: 7px;
    min-width: 30px; padding: 2px 8px; cursor: pointer; }
  .bld-log-pager button.on { border-color: var(--brand); color: var(--brand); font-weight: 700; }
  .bld-log-pager .gap { border: 0; }
  .bld-log-pager select { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 2px 6px; }
  .bld-log-pager .range { color: var(--muted); font-size: 12px; margin-left: auto; }
  .bld-log-eof { color: var(--muted); font-size: 12px; padding: 8px 0 2px; text-align: center; }

  .rel-empty, .rel-empty-mini { text-align: center; color: var(--muted); padding: 26px 10px; }
  .rel-empty h3 { margin: 0 0 6px; color: var(--ink); }
  .rel-empty-mini { padding: 14px 6px; }
  .rel-form-err { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--err) 35%, transparent); border-radius: 8px; padding: 7px 10px; margin: 8px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* toast */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--ok);
    border-radius: 8px; padding: 8px 14px; box-shadow: var(--shadow); max-width: 380px; }
  .toast.err { border-left-color: var(--err); }
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Agent Team Board</span>
    <nav class="module-nav" aria-label="模块导航">
      <button type="button">需求</button>
      <button type="button" class="active">构建</button>
      <button type="button">任务</button>
      <button type="button">设置</button>
    </nav>
  </header>
  <div class="page-head">
    <span class="sub">版本计划与分支，集中在这里</span>
    <span class="mod-search" title="顶部模块搜索：只过滤版本计划列表（版本名 / 单号），与本演示的提交搜索互不串扰">🔍 搜版本 / 单号 / 分支…（模块级，非本需求入口）</span>
  </div>

  <main>
    <div class="demo-bar" id="demoBar">
      <span class="t">演示控制</span>
      <button type="button" data-demo="normal">正常数据</button>
      <button type="button" data-demo="nomatch">模拟无匹配</button>
      <button type="button" data-demo="loading">模拟加载中</button>
      <button type="button" data-demo="fail">模拟失败</button>
      <button type="button" data-demo="empty">空分支</button>
      <button type="button" id="themeBtn">🌙 深浅色切换</button>
      <span class="note">dev 分支共 66 条提交（50 条/页）：试试搜「REQ-20260913-001」「BUG-20260914-009」「7c3f9a2」「merge」等命中第 2 页的记录</span>
    </div>

    <nav class="rel-tabs" aria-label="构建子页签">
      <button type="button">版本计划</button>
      <button type="button" class="active">分支浏览</button>
    </nav>

    <div class="rel-split">
      <div class="rel-list" aria-label="分支列表">
        <div class="bld-branch-tools">
          <button type="button" class="btn small" id="syncBtn" title="fetch --all --prune 拉取远端，再推送本地开发分支（main 除外）">⟳ 和远端同步</button>
          <button type="button" class="btn small quiet" id="branchRefreshBtn">刷新</button>
        </div>
        <div class="bld-group-head">本地</div>
        <div id="localBranches"></div>
        <div class="bld-group-head">远端</div>
        <div id="remoteBranches"></div>
      </div>
      <div class="rel-detail" aria-label="提交记录">
        <div class="bld-log-head">
          <strong id="logBranchName">提交记录</strong>
          <button type="button" class="btn small quiet" id="logRefreshBtn" style="margin-left:auto">刷新</button>
        </div>
        <!-- REQ-20260914-002：搜索行（新增） -->
        <div class="bld-log-search">
          <input type="text" id="kwInput" placeholder="搜提交说明 / 作者 / hash…" aria-label="在当前分支提交记录中搜索">
          <button type="button" class="btn small primary" id="searchBtn">搜索</button>
          <button type="button" class="btn small quiet" id="clearBtn">清除</button>
          <span class="hint">范围：当前分支全部提交（跨分页）</span>
        </div>
        <div id="logArea"></div>
      </div>
    </div>
  </main>
  <div id="toasts"></div>

<script>
'use strict';
/* ============ 演示数据（确定性生成，无外网依赖） ============ */
function mulberry32(a) { return function() { a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hexOf(rng, n) { let s = ''; for (let i = 0; i < n; i++) s += '0123456789abcdef'[Math.floor(rng() * 16)]; return s; }

const AUTHORS = ['adichou', 'refine-1', 'dev-2', 'zcode-agent', 'codex-agent'];
const DEV_SUBJECTS = [
  'REQ-20260913-001 新增构建模块：版本管理 + 分支浏览与同步',       // 命中第 2 页的关键单号
  'BUG-20260914-009 分支提交记录分页：放开 50 条截断，limit/offset + 总数',
  'REQ-20260914-002 分支浏览提交记录支持关键词搜索（本需求演示数据）',
  'REQ-20260913-004 版本卡片行内操作：AI 完善 / 合并 / 删除',
  'BUG-20260914-004 一条目至多纳入一个版本：候选去重与服务端兜底',
  'REQ-20260913-006 AI 完善解析预览可编辑表单',
  'BUG-20260914-011 同步远端改为 fetch 后推送除 main 外本地分支',
  'REQ-20260911-009 设置页 Git 工作流分区与 dev 初始化',
  'BUG-20260914-006 远端空态三分：未配置 / 未同步 / 远端为空',
  'REQ-20260912-001 Git 工作流 dev + main 双分支说明',
  'BUG-20260913-005 弹窗「去新建会话」宿主探测与降级提示',
  'REQ-20260910-029 发布模块插入营销与设置之间',
  'BUG-20260914-012 main 分支不渲染推送入口（归发布模块）',
  'REQ-20260913-003 去批次概念：「排队中」随批次移除',
  'chore: 升级依赖并整理 licenses.md',
  'docs: 补充构建模块 design.md 开源选型说明',
  'test: build-serve 增补 branch-log ref 注入拒绝用例',
  'style: 深色模式变量对齐分支浏览面板',
  'fix: 翻页失败时保留已加载内容并显示行内错误',
  'refactor: logPagerHtml 抽为纯函数供测试复用',
];
const MAIN_SUBJECTS = [
  'merge: 版本 v0.9.0 合并入 main（--noff，临时工作树执行）',
  'release: v0.9.0 发布构建物归档',
  'merge: 版本 v0.8.2 合并入 main',
  'chore: main 分支基线整理',
  'release: v0.8.1 发布',
];
const FEAT_SUBJECTS = [
  'feat: 提交搜索行首版（仅提交说明匹配）',
  'wip: 搜索结果分页联调',
  'feat: hash 前缀与作者匹配',
];

function makeCommits(seed, count, subjects) {
  const rng = mulberry32(seed);
  const out = [];
  let t = Date.UTC(2026, 8, 14, 12, 0, 0);
  for (let i = 0; i < count; i++) {
    const subj = subjects[Math.floor(rng() * subjects.length)];
    t -= Math.floor(2 + rng() * 30) * 3600 * 1000; // 新→旧递减
    const d = new Date(t);
    out.push({
      hash: hexOf(rng, 40),
      author: AUTHORS[Math.floor(rng() * AUTHORS.length)],
      date: d.toISOString().slice(0, 16).replace('T', ' '),
      subject: subj + (i % 7 === 3 ? `（#${i + 1}）` : ''),
    });
  }
  return out;
}
// 固定几条"埋点"提交，保证演示关键词可稳定命中（并落在第 2 页，即第 51 条之后）
function plant(commits, idx, hash8, subj, author) {
  commits[idx] = { hash: hash8 + '0123456789abcdef0123456789abcdef01234', author,
    date: '2026-09-0' + (1 + (idx % 9)) + ' 09:30', subject: subj };
}
const DEV = makeCommits(20260914, 66, DEV_SUBJECTS);
plant(DEV, 58, '7c3f9a2b', 'REQ-20260913-001 构建模块首版落地：版本计划 + 分支浏览页签', 'adichou');
plant(DEV, 61, 'a1b2c3d4', 'BUG-20260914-009 提交记录分页上线前修正总数统计', 'dev-2');
plant(DEV, 64, '99887766', 'REQ-20260914-002 提交搜索：搜索行交互稿', 'refine-1');
const MAIN = makeCommits(777, 24, MAIN_SUBJECTS);
const FEAT = makeCommits(31, 6, FEAT_SUBJECTS);
const EMPTY = []; // 「空分支」演示

const BRANCHES = {
  current: 'dev',
  local: ['dev', 'main', 'feat/log-search'],
  remote: ['origin/main', 'origin/dev'],
};

/* ============ 状态 ============ */
const S = {
  selected: null,          // 当前所选分支（未选 = 右侧引导空态）
  data: null,              // 所选分支提交（新→旧）
  phase: 'idle',           // idle | loading | error | empty
  error: null,             // 首次加载失败信息
  inlineError: null,       // 列表上方行内错误（保留旧内容口径）
  keyword: '',
  searched: null,          // 已执行搜索的关键词（null = 未处于搜索态）
  results: null,
  page: 1,
  pageSize: 50,
  busy: false,             // 搜索/加载执行中（防重复）
  failNext: false,         // 演示：下一次请求失败
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* 关键词高亮（大小写不敏感） */
function hl(text, q) {
  const t = String(text || ''); if (!q) return esc(t);
  const lower = t.toLowerCase(), k = q.toLowerCase();
  let out = '', i = 0, j;
  while ((j = lower.indexOf(k, i)) !== -1) {
    out += esc(t.slice(i, j)) + '<mark>' + esc(t.slice(j, j + k.length)) + '</mark>';
    i = j + k.length;
  }
  return out + esc(t.slice(i));
}
/* 匹配：提交说明 / 作者 / hash（短或完整前缀），大小写不敏感 —— README 口径 */
function matchCommit(c, q) {
  const k = q.trim().toLowerCase();
  if (!k) return true;
  return c.subject.toLowerCase().includes(k)
    || c.author.toLowerCase().includes(k)
    || c.hash.toLowerCase().startsWith(k)
    || (k.length <= 8 && c.hash.slice(0, 8).includes(k));
}

/* ============ 渲染 ============ */
function renderBranchList() {
  const cur = BRANCHES.current;
  $('#localBranches').innerHTML =
    `<div class="bld-branch${S.selected === cur ? ' sel' : ''}" data-branch="${cur}"><span class="nm">${cur}</span><span class="st run">当前</span></div>` +
    BRANCHES.local.filter((b) => b !== cur).map((b) =>
      `<div class="bld-branch${S.selected === b ? ' sel' : ''}" data-branch="${esc(b)}"><span class="nm">${esc(b)}</span></div>`).join('');
  $('#remoteBranches').innerHTML = BRANCHES.remote.map((b) =>
    `<div class="bld-branch${S.selected === b ? ' sel' : ''}" data-branch="${esc(b)}"><span class="nm">${esc(b)}</span></div>`).join('');
}

function pagerHtml(page, pages, size, total) {
  const p = Math.max(1, Math.min(pages, page));
  const start = (p - 1) * size, len = Math.max(0, Math.min(size, total - start));
  const want = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - p) <= 1) want.push(String(i));
    else if (want[want.length - 1] !== '…') want.push('…');
  }
  const nums = want.map((w) => w === '…' ? '<span class="gap">…</span>'
    : `<button type="button" data-pg="${w}"${w === String(p) ? ' class="on" aria-current="page"' : ''}>${w}</button>`).join('');
  const sizes = [20, 50, 100].map((n) => `<option value="${n}"${n === size ? ' selected' : ''}>${n} 条/页</option>`).join('');
  return `<div class="bld-log-pager" role="navigation" aria-label="提交记录分页">
      <button type="button" data-pg="prev"${p <= 1 ? ' disabled' : ''}>上一页</button>${nums}
      <button type="button" data-pg="next"${p >= pages ? ' disabled' : ''}>下一页</button>
      <select id="sizeSel" aria-label="每页条数">${sizes}</select>
      <span class="range">第 ${start + 1}–${start + len} 条 / 共 ${total} 条</span></div>`;
}

function commitRow(c, q) {
  return `<li><code title="完整提交号：${esc(c.hash)}">${esc(c.hash.slice(0, 8))}</code>
    <span class="subj">${hl(c.subject, q)}</span>
    <span class="meta">${hl(c.author, q)} · ${esc(c.date)}</span></li>`;
}

function renderLogArea() {
  const area = $('#logArea');
  if (!S.selected) { area.innerHTML = '<div class="rel-empty-mini muted">点击左侧分支查看提交记录</div>'; return; }
  if (S.phase === 'loading') {
    area.innerHTML = `<p class="muted" style="padding:18px 4px"><span class="spin">◐</span> ${S.searched !== null && S.keyword ? '搜索中…' : '加载提交记录中…'}</p>`;
    return;
  }
  if (S.phase === 'error') {
    area.innerHTML = `<div class="rel-empty"><h3>提交记录读取失败</h3>
      <p class="rel-form-err" role="alert">${esc(S.error || '')} <button type="button" class="btn small" id="logRetry">重试</button></p></div>`;
    return;
  }
  if (S.phase === 'empty') {
    area.innerHTML = '<p class="rel-empty-mini muted small" style="padding:16px 4px">该分支暂无提交</p>';
    return;
  }
  // 搜索态 / 默认列表（同一渲染路径，仅数据源与计数条不同）
  const searching = S.searched !== null;
  const src = searching ? S.results : S.data;
  const q = searching ? S.searched : '';
  if (!src || !src.length) {
    area.innerHTML = `<p class="rel-empty-mini muted" style="padding:16px 4px">没有匹配的提交（关键词：${esc(q)}）
      <button type="button" class="btn small" id="inlineClear">清除搜索</button></p>`;
    return;
  }
  const total = src.length, pages = Math.max(1, Math.ceil(total / S.pageSize));
  const page = Math.min(Math.max(1, S.page), pages);
  const slice = src.slice((page - 1) * S.pageSize, (page - 1) * S.pageSize + S.pageSize);
  const countBar = searching
    ? `<div class="bld-search-count">搜索「${esc(q)}」共 <b>${total}</b> 条匹配（范围：${esc(S.selected)} 分支全部提交）</div>`
    : '';
  const inline = S.inlineError
    ? `<p class="rel-form-err" role="alert">提交记录读取失败：${esc(S.inlineError)} <button type="button" class="btn small" id="inlineRetry">重试</button></p>`
    : '';
  const eof = page === pages ? `<div class="bld-log-eof">已到末尾 · 共 ${total} 条${searching ? '匹配' : '提交'}（可翻至${searching ? '最后一条匹配' : '分支首个提交'}）</div>` : '';
  area.innerHTML = countBar + inline + `<ul class="bld-log">${slice.map((c) => commitRow(c, q)).join('')}</ul>` + eof
    + pagerHtml(page, pages, S.pageSize, total);
}

function renderControls() {
  $('#logBranchName').textContent = S.selected || '提交记录';
  $('#logRefreshBtn').disabled = !S.selected || S.busy;
  $('#searchBtn').disabled = !S.selected || S.busy;
  $('#clearBtn').disabled = !S.selected || S.busy || S.searched === null;
  $('#kwInput').disabled = !S.selected || S.busy;
  $('#syncBtn').disabled = S.busy;
}
function render() { renderBranchList(); renderLogArea(); renderControls(); }

/* ============ 行为 ============ */
function branchData(b) {
  if (b === 'dev') return DEV;
  if (b === 'main' || b === 'origin/main') return MAIN;
  if (b === 'feat/log-search') return FEAT;
  if (b === 'origin/dev') return DEV;
  if (b === '__empty__') return EMPTY;
  return DEV;
}
function delay(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* 加载分支提交（首次 / 刷新）。演示用 550ms 模拟请求；failNext 模拟失败 */
async function loadBranch(b, { keepSearch = true } = {}) {
  if (S.busy) return;
  S.busy = true;
  if (!keepSearch) { S.searched = null; S.results = null; S.keyword = ''; $('#kwInput').value = ''; }
  S.selected = b; S.page = 1; S.phase = 'loading'; S.inlineError = null; S.error = null;
  render();
  await delay(550);
  S.busy = false;
  if (S.failNext) {
    S.failNext = false;
    // 已有内容（含搜索态）保留旧内容 + 行内错误；首次加载失败走全区错误（BUG-20260914-009 口径）
    if (S.data) { S.inlineError = '模拟：请求超时，已保留此前加载内容（演示）'; S.phase = S.data.length ? 'idle' : 'empty'; }
    else { S.phase = 'error'; S.error = '模拟：git log 读取失败（演示）'; }
    render(); return;
  }
  S.data = branchData(b);
  S.phase = S.data.length ? 'idle' : 'empty';
  if (S.searched !== null) S.results = S.data.filter((c) => matchCommit(c, S.searched));
  render();
}

/* 执行搜索：在当前分支全部提交内匹配（不受当前页限制） */
async function doSearch() {
  if (!S.selected || S.busy) return;
  const kw = $('#kwInput').value.trim();
  if (!kw) { doClear(); return; }
  S.busy = true; S.keyword = kw; S.phase = 'loading'; S.inlineError = null;
  render();
  await delay(550);
  S.busy = false;
  if (S.failNext) {
    S.failNext = false;
    // 搜索失败：保留已加载的旧结果，列表上方行内错误 + 重试
    S.phase = 'idle'; S.inlineError = '模拟：搜索请求失败（演示）';
    if (S.results === null) { S.searched = null; S.phase = 'idle'; }
    render(); return;
  }
  S.searched = kw;
  S.results = (S.data || []).filter((c) => matchCommit(c, kw));
  S.page = 1; S.phase = 'idle';
  render();
}

/* 清除：恢复默认全量分页列表 */
function doClear() {
  if (S.busy) return;
  S.keyword = ''; S.searched = null; S.results = null; S.page = 1; S.inlineError = null;
  $('#kwInput').value = '';
  if (S.data && !S.data.length) S.phase = 'empty';
  render();
}

/* ============ 事件绑定 ============ */
document.addEventListener('click', (e) => {
  const b = e.target?.closest?.('[data-branch]');
  if (b && !e.target.closest('button')) { loadBranch(b.dataset.branch, { keepSearch: false }); return; } // 切分支重置搜索

  const pg = e.target?.closest?.('[data-pg]');
  if (pg) {
    const total = (S.searched !== null ? S.results : S.data)?.length || 0;
    const pages = Math.max(1, Math.ceil(total / S.pageSize));
    const v = pg.dataset.pg;
    const next = v === 'prev' ? S.page - 1 : v === 'next' ? S.page + 1 : Number(v);
    if (next >= 1 && next <= pages) { S.page = next; renderLogArea(); }
    return;
  }

  const id = e.target?.closest?.('button')?.id;
  if (id === 'searchBtn') doSearch();
  else if (id === 'clearBtn' || id === 'inlineClear') doClear();
  else if (id === 'logRefreshBtn') loadBranch(S.selected, { keepSearch: true }); // 刷新保持关键词重查
  else if (id === 'branchRefreshBtn') { toast('✓ 分支列表已刷新（演示）'); }
  else if (id === 'logRetry') loadBranch(S.selected, { keepSearch: true });
  else if (id === 'inlineRetry') doSearch(); // 行内重试：重发失败的搜索
  else if (id === 'syncBtn') { toast('✓ 已同步远端：fetch 完成，已推送 dev → origin（演示）'); }
});

$('#kwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
document.addEventListener('change', (e) => {
  if (e.target?.id === 'sizeSel') { S.pageSize = Number(e.target.value) || 50; S.page = 1; renderLogArea(); }
});

/* 演示控制条 */
$('#demoBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-demo]'); if (!btn) return;
  S.busy = false; // 演示动作可从「定格加载」等 busy 态退出
  for (const b of document.querySelectorAll('.demo-bar button[data-demo]')) b.classList.remove('on');
  btn.classList.add('on');
  const act = btn.dataset.demo;
  if (act === 'normal') {
    loadBranch('dev', { keepSearch: false });
    toast('恢复正常：dev 66 条提交，第 1 页');
  } else if (act === 'nomatch') {
    if (!S.selected || S.phase === 'loading') { toast('请先在正常数据下选中分支再演示', true); return; }
    $('#kwInput').value = 'zzz不存在的关键词';
    doSearch();
  } else if (act === 'loading') {
    // 定格加载态：已选分支时演示「搜索中… / 加载提交记录中…」指示（按钮与输入防重复禁用）
    if (!S.selected) S.selected = 'dev';
    S.busy = true; S.phase = 'loading'; S.inlineError = null; render();
  } else if (act === 'fail') {
    if (!S.selected || S.phase === 'loading') { toast('请先选中分支并加载完成后再模拟失败', true); return; }
    S.failNext = true; doSearch();
  } else if (act === 'empty') {
    loadBranch('__empty__', { keepSearch: false });
  }
});

/* 深浅色切换 */
$('#themeBtn').addEventListener('click', () => {
  const html = document.documentElement;
  const dark = html.dataset.theme === 'dark';
  html.dataset.theme = dark ? 'light' : 'dark';
  $('#themeBtn').textContent = dark ? '🌙 深浅色切换' : '☀️ 深浅色切换';
});

/* 初始：未选分支的引导空态 */
render();
</script>
</body>
</html>
