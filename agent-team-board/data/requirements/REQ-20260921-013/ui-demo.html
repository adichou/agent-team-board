<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>概况 · AI 完善入口演示</title><style>body{font:15px system-ui;background:#f3f5f9;color:#243047;margin:24px}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #bcc6d6;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.shell{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-top:20px}aside,main,dialog{background:white;border:1px solid #dae0eb;border-radius:14px;padding:20px}aside button{display:block;width:100%;margin:10px 0;text-align:left}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:16px}.active{background:#315ce9;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}p{line-height:1.7}.muted{color:#657186}dialog{width:min(520px,85vw)}dialog::backdrop{background:#17233377}textarea,input{box-sizing:border-box;width:100%;margin:8px 0}textarea{height:90px}#msg{color:#b13535} @media(max-width:650px){.shell{grid-template-columns:1fr}body{margin:12px}}</style><h1>发布 · 版本计划</h1><p class="muted">交互原型，仅模拟操作；AI 完善入口已迁入详情概况。</p><label>演示状态 <select id="mode"><option value="normal">正常</option><option value="empty">空：未选择版本</option><option value="loading">加载中</option><option value="fail">读取失败</option><option value="merging">合并中</option><option value="pushed">已正式发布</option><option value="merged">已合并未推送</option></select></label><div class="shell"><aside id="list"></aside><main id="detail"></main></div><dialog id="modal"><h2 id="mt"></h2><p>既有完善流程示意：复制提示词 → 回答解析 → 编辑并应用</p><textarea readonly>请完善当前选中版本的名称与描述（演示提示词）。</textarea><button id="copy">模拟复制提示词</button><button id="parse">模拟粘贴并解析回答</button><label>名称<input id="name"></label><label>描述<textarea id="desc"></textarea></label><label><input type="checkbox" id="bad" style="width:auto">模拟应用失败</label><p id="msg" role="status"></p><button id="apply">应用回填</button> <button id="cancel">取消</button></dialog><script>const names=['版本 A','版本 B'],descs=['优化版本概况与发布体验',''];let selected=0,step=0,target=0;const tabs=['概况','关联条目与提交','文档编写','合并入 main','正式发布'];const $=id=>document.getElementById(id);function render(){$('list').replaceChildren();names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n+' · BLD-DEMO-00'+(i+1);b.onclick=()=>{selected=i;step=0;$('mode').value='normal';render()};$('list').append(b)});const m=$('mode').value,d=$('detail');if(m==='empty'){d.innerHTML='<p>请选择左侧版本查看详情</p>';return}if(m==='loading'){d.innerHTML='<p role="status">正在加载版本详情…</p>';return}if(m==='fail'){d.innerHTML='<p role="alert">读取版本失败，请重试。</p><button id="retry">重试</button>';$('retry').onclick=()=>{$('mode').value='normal';render()};return}d.innerHTML='<h2 id="heading"></h2><p>BLD-DEMO-00'+(selected+1)+'</p><nav class="tabs" id="tabs"></nav><section id="pane"></section>';$('heading').textContent=names[selected];tabs.forEach((n,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+n;b.className=i===step?'active':'';b.onclick=()=>{step=i;render()};$('tabs').append(b)});if(step!==0){$('pane').innerHTML='<p>'+tabs[step]+'内容区（其余流程沿用既有功能）</p>';return}let lock=m==='merging'||m==='pushed',reason=m==='merging'?'合并中，请稍候……':m==='pushed'?'已正式发布，不允许再 AI 完善':m==='merged'?'已合并未推送，可继续 AI 完善':'';$('pane').innerHTML='<div class="row"><h3>概况</h3><button id="ai" '+(lock?'disabled':'')+'>AI 完善</button></div><p>目标分支 main</p><p id="description"></p><p role="status">'+reason+'</p>';$('description').textContent=descs[selected]||'（无描述）';$('ai').title=reason;$('ai').onclick=()=>{target=selected;$('mt').textContent='AI 完善 · BLD-DEMO-00'+(target+1);$('name').value=names[target];$('desc').value=descs[target];$('msg').textContent='';$('modal').showModal()}}$('mode').onchange=render;$('cancel').onclick=()=>$('modal').close();$('copy').onclick=()=>{$('msg').textContent='模拟提示词已复制（未访问剪贴板）'};$('parse').onclick=()=>{$('name').value=names[target]+' · 已完善';$('desc').value='此处是模拟解析后的版本说明，可继续编辑。';$('msg').textContent='解析成功，请核对并应用'};$('apply').onclick=()=>{if(!$('name').value.trim()){$('msg').textContent='版本名称不能为空';return}$('apply').disabled=true;$('cancel').disabled=true;$('msg').textContent='应用中…';setTimeout(()=>{$('apply').disabled=false;$('cancel').disabled=false;if($('bad').checked){$('msg').textContent='应用失败：模拟网络错误，输入已保留，可重试';return}names[target]=$('name').value;descs[target]=$('desc').value;$('modal').close();render();let p=document.createElement('p');p.setAttribute('role','status');p.textContent='✓ 已应用版本信息';$('pane').append(p)},600)};render();</script></html>
