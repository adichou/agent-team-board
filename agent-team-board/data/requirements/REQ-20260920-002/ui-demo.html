<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>切换至 dev 分支 · 交互演示</title>
<style>body{margin:0;background:#f3f5f9;color:#202c3e;font:16px/1.6 system-ui,sans-serif}main{max-width:800px;margin:48px auto;padding:24px}section,.controls{background:white;border:1px solid #d9e0ea;border-radius:12px;padding:24px;margin:20px 0}h1{font-size:26px}h2{font-size:19px;margin:0 0 12px}p{margin:12px 0}.muted{color:#65748a;font-size:14px}button,select{font:inherit;border:1px solid #bac7d9;border-radius:7px;padding:8px 14px;background:white;color:inherit;cursor:pointer}button.primary{background:#285dd4;color:white;border-color:#285dd4}button:disabled{opacity:.5;cursor:default}.line{background:#f4f7fc;padding:12px;margin:18px 0}.feedback{margin-top:12px;min-height:26px;color:#21673b}.error{color:#ac2934}dialog{border:1px solid #d9e0ea;border-radius:14px;max-width:470px;padding:26px}dialog::backdrop{background:#18233488}.actions{display:flex;justify-content:flex-end;gap:10px}.controls label{display:block;margin:8px 0}small{display:block;color:#65748a}</style>
<main><h1>设置 / Git 工作流</h1><p class="muted">REQ-20260920-002 · 交互规格演示，不执行真实 Git 操作</p><div class="controls"><label>演示场景 <select id="scenario"><option value="normal">正常：main，dev 已存在</option><option value="missing">dev 未创建</option><option value="ready">已在 dev</option><option value="empty">空态：非 Git 仓库</option><option value="loading">正在读取状态</option><option value="error">状态读取失败</option></select></label><label><input type="checkbox" id="fail"> 模拟切换失败（未提交修改冲突）</label></div><section id="card" aria-live="polite"></section></main>
<dialog id="confirm"><h2>切换至 dev 分支？</h2><p>将把整个项目工作区切换至 dev 分支。若 dev 不存在，将先创建再切换。仅本地操作，不 push。</p><div class="actions"><button id="cancel">取消</button><button class="primary" id="accept">切换至 dev</button></div></dialog>
<script>
const scenario=document.querySelector('#scenario'),card=document.querySelector('#card'),modal=document.querySelector('#confirm');let busy=false,feedback='',failed=false,timer;
function render(){const s=scenario.value;card.innerHTML='<h2>Git 工作流</h2>';if(s==='loading'){card.innerHTML+='<p>正在获取 Git 状态…</p><button id="loaded">模拟加载完成</button>';document.querySelector('#loaded').onclick=()=>{scenario.value='normal';render()};return}if(s==='error'){card.innerHTML+='<p class="error">Git 状态加载失败：无法读取仓库状态。</p><button id="retry">重试</button>';document.querySelector('#retry').onclick=()=>{scenario.value='loading';render();timer=setTimeout(()=>{scenario.value='normal';render()},800)};return}card.innerHTML+='<p class="muted">dev 分支承载需求设计、开发和测试；main 分支承载版本构建，发布构建物。每单开发完成后自动提交到本地，不 push。</p>';if(s==='empty')card.innerHTML+='<p>项目不是 git 仓库：请先在终端完成 git 初始化（新项目可经 atb init 自动初始化）。</p>';card.innerHTML+='<div class="line">'+(s==='empty'?'当前分支：—（不是 git 仓库）':'当前分支：'+(s==='ready'?'dev':'main')+' · dev 分支：'+(s==='missing'?'未创建':'已存在'))+'</div><button class="primary" id="switch" '+(busy||s==='ready'||s==='empty'?'disabled':'')+'>'+(s==='ready'?'已在 dev 分支':'切换至 dev 分支')+'</button><div role="status" class="feedback '+(failed?'error':'')+'">'+(busy?'正在切换至 dev 分支…':feedback)+'</div>';document.querySelector('#switch').onclick=()=>modal.showModal()}
scenario.onchange=()=>{clearTimeout(timer);busy=false;feedback='';failed=false;render()};document.querySelector('#cancel').onclick=()=>{modal.close();feedback='已取消，未执行切换。';render()};document.querySelector('#accept').onclick=()=>{modal.close();busy=true;feedback='';failed=false;render();timer=setTimeout(()=>{busy=false;if(document.querySelector('#fail').checked){failed=true;feedback='失败：未提交修改会被切换覆盖，请处理后重试。';}else{scenario.value='ready';feedback='已切换至 dev 分支。';}render()},900)};render();
</script></html>
