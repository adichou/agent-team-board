<script>
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(arr,cur)=>arr.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('');

/* ---------- 五类入口与外部技能（候选，coreyhaines31/marketingskills，引入前均为未安装状态以“缺失”场景演示） ---------- */
const TYPES={
 positioning:{name:'梳理定位',page:'定位与定价',goal:'基于现有定位档案与项目 README，梳理目标受众、差异点与未决问题，输出可采纳的定位更新候选。'},
 pricing:{name:'分析定价',page:'定位与定价',goal:'基于档案、定价历史版本与指标快照，给出下一周期候选定价方案、建议理由与验证方法。'},
 channels:{name:'制定渠道计划',page:'渠道与行动',goal:'基于档案与现有渠道 / 实验，提出新渠道与实验候选，标注为待验证假设并给出验证标准。'},
 content:{name:'生成内容',page:'渠道与行动',goal:'基于定位档案与实验目标，生成具体行动的内容草稿（人工复制发布，不自动发送）。'},
 review:{name:'复盘',page:'效果与复盘',goal:'基于指定观察期的指标快照与实验记录生成复盘草稿；数据不足时输出补采建议，不生成虚构结论。'}
};
const SKILLS_BY_TYPE={
 positioning:['product-marketing'],
 pricing:['pricing','product-marketing'],
 channels:['marketing-plan','social'],
 content:['content-strategy','copywriting'],
 review:['analytics','attribution']
};
const INPUTS_BY_TYPE={
 positioning:[['positioning.md',2],['profile.json',3],['README.md',null]],
 pricing:[['profile.json',3],['pricing/v1.json',1],['pricing/v2.json',1],['positioning.md',2]],
 channels:[['profile.json',3],['channels/*.json',1],['experiments/exp-landing.json',3]],
 content:[['profile.json',3],['experiments/exp-landing.json',3],['activities/act-*.json',1]],
 review:[['metrics/observations（快照 metrics@r2）',2],['experiments/exp-landing.json',3],['activities/act-*.json',1],['reviews/RV-1.md',1]]

/* ---------- 回执草稿样例（均为演示数据） ---------- */
const DRAFTS={

  evidence:['README.md（当前版本）','positioning.md@v2#E3','agent-runs/run-001/draft.md'],
  missing:['目标市场语言偏好在 profile.json 中未记录','访谈样本 n=2，不足以支撑结论'],
  candidates:[
   {id:'c1',kind:'定位',title:'差异点补充：跨会话可追溯的团队协作记录',reason:'现有差异点未覆盖访谈中提到的可追溯需求',verify:'下周期访谈 5 名目标用户确认表述',adoptTo:'positioning.md@v3（差异点小节）'},
   {id:'c2',kind:'假设',title:'目标受众假设：3~10 人小团队负责人',reason:'访谈样本集中于该画像，但 n=2 样本不足，只能作为假设',verify:'渠道行动收集 20 份问卷后复核',adoptTo:'positioning.md@v3（假设小节，显式标记「假设」）'}
  ]},
 pricing:{
  facts:['定价 v2（订阅 ¥29/月）运行 4 周，付费人数 0（真实零，metrics@r2）','竞品 A 订阅 $9/月；竞品 B 买断 $49（positioning.md@v2 竞品表）'],
  assumptions:['价格可能不是唯一阻碍：激活→付费漏斗中间数据未采集','目标用户对买断制接受度可能更高（访谈 2/2 提及，样本不足）'],
  toConfirm:['¥29 是否高于目标用户心理价位'],
  evidence:['metrics@r2（09-01~09-07 快照）','pricing/v2.json@r1','positioning.md@v2#竞品'],
  missing:['付费转化漏斗中间数据未采集','竞品 B 功能范围未核实'],
  candidates:[
   {id:'c1',kind:'定价',title:'候选定价 v3：订阅 ¥19/月（年付 ¥190）',reason:'低于竞品 A、贴近访谈提到的心理价位区间',verify:'exp-pricing 半流量 A/B，观察付费转化是否 ≥1%',adoptTo:'pricing/v3.json（候选版本，不自动成为当前方案）'},
   {id:'c2',kind:'定价',title:'候选定价 v3b：买断 ¥99（含 1 年更新）',reason:'访谈偏好一次性付费，但样本不足，仅作候选',verify:'落地页价格页 A/B 两种模式同时展示',adoptTo:'pricing/v3.json（候选版本，不自动成为当前方案）'}
  ]},
 channels:{
  facts:['现有渠道：官网、X，均为「待验证假设」（channels@r1）','exp-landing 观察中，主指标=订阅新增，当前 0（真实零）'],

  toConfirm:['目标用户活跃社区的具体版块与规则'],
  evidence:['channels/*.json@r1','experiments/exp-landing.json@r3','metrics@r2'],
  missing:['各社区发帖规则与限制未核实','现有渠道未积累足够观察数据'],
  candidates:[
   {id:'c1',kind:'渠道',title:'新渠道候选：开发者社区（V2EX / 即刻）',reason:'与受众假设匹配，发帖成本低于视频制作',verify:'2 周内发 3 帖，观察新增订阅是否 ≥3',adoptTo:'channels/ch-dev.json（待验证假设，不自动标记已验证）'},
   {id:'c2',kind:'实验',title:'新实验：社区首发帖（成功标准：订阅新增 ≥3）',reason:'承接新渠道的验证需求',verify:'观察 09-15~09-28，定价绑定当前版本 v2',adoptTo:'experiments/exp-community.json（草稿状态，人工确认后开始）'}
  ]},
 content:{
  facts:['act-1（落地页文案）已发布，观察中（activities@r1）','产品阶段=验证，主指标=激活人数（profile.json@v3）'],
  assumptions:['技术叙事比营销话术更能打动目标受众'],
  toConfirm:['社区帖的合适篇幅与代码示例比例'],
  evidence:['profile.json@v3','experiments/exp-landing.json@r3','activities/act-1/content.md'],
  missing:['尚无已验证的高转化文案样本'],
  candidates:[
   {id:'c1',kind:'行动',title:'社区帖草稿：《用看板管理多 Agent 协作的 3 周实践》',reason:'差异化叙事直指目标受众痛点，附真实截图',verify:'发布后 2 周观察点击与新增订阅（人工复制发布，不自动发送）',adoptTo:'activities/act-3/content.md（行动草稿，人工复制发布）'}
  ]},
 review:{
  facts:['09-01~09-07：订阅新增 0（真实零）、激活 12（metrics@r2）','exp-landing 主指标目标：订阅新增 ≥5'],
  assumptions:['激活 12 说明流量可到达，订阅 0 更可能是首屏转化问题而非流量问题'],
  toConfirm:['访客数据未录入，无法计算订阅转化率'],
  evidence:['metrics@r2 快照','experiments/exp-landing.json@r3','reviews/RV-1.md'],
  missing:['访客（分母）未录入，转化率不可计算'],
  candidates:[
   {id:'c1',kind:'复盘',title:'复盘 RV-2：exp-landing 首期未达标（0 < 5）',reason:'激活与订阅差距指向首屏转化，但缺乏访客分母，只能作为假设',verify:'结论绑定 metrics@r2；下一周期修改首屏标题后再验证，并补采访客',adoptTo:'experiments/exp-landing/reviews/RV-2.md（依据固定为 metrics@r2）'}
  ]},
 reviewNoData:{
  insufficient:true,
  facts:['09-08~09-14 观察期尚无任何观察记录（未录入 ≠ 0）'],
  assumptions:[],
  toConfirm:['该观察期是否已实际开始收集数据'],
  evidence:['metrics/observations（该周期无记录）'],
  missing:['订阅新增 / 激活 / 访客均无数据','无法计算任何转化率或改善幅度'],
  advice:['建议先补采：订阅新增、激活、访客（分母）三项基础指标','数据录入后再生成复盘，本周期不输出结论'],

 }

/* ---------- 档案与运行记录 ---------- */
let archive=null,runs=[],nextRun=3;
const state={mode:'normal',tab:'overview',message:''};
function buildArchive(mode){
 const a={
  profile:{ver:3,stage:'验证',goal:'验证首次使用价值',metric:'激活人数'},
  positioning:{ver:2,audience:'3~10 人小团队负责人（假设）',pain:'跨会话状态不清晰',diff:'多 Agent 协作看板 + 状态铁律'},
  evidence:[['事实','现有用户访谈 n=2 提到跨会话状态不清晰'],['假设','受众为小团队负责人'],['待确认','个人开发者需求强度']],
  pricing:[{v:'v1',mode:'买断 ¥19',status:'候选'},{v:'v2',mode:'订阅 ¥29/月',status:'当前'}],
  channels:[{name:'官网',status:'待验证假设'},{name:'X',status:'待验证假设'}],
  experiments:[{id:'exp-landing',name:'落地页首屏实验',status:'观察中',rev:3}],
  contents:[],
  metrics:[['订阅新增','0（真实零）'],['激活','12'],['点赞','87'],['Star 新增','34']],
  reviews:[{id:'RV-1',period:'08-11~08-24',snap:'metrics@r1',conclusion:'首屏价值表达不足，转化低于预期。'}],
  init:true
 };
 if(mode==='empty'){a.init=false}
 if(mode==='stale'){a.experiments[0].rev=4;a.experiments[0].note='r4（已被并发更新：补充了预算字段）'}
 return a;
}
function currentVer(ref){
 if(ref==='profile.json')return archive.profile?archive.profile.ver:undefined;
 if(ref==='positioning.md')return archive.positioning?archive.positioning.ver:undefined;
 if(ref==='experiments/exp-landing.json'){const e=archive.experiments&&archive.experiments.find(x=>x.id==='exp-landing');return e?e.rev:undefined}
 if(ref==='channels/*.json')return archive.channels&&archive.channels.length?1:undefined;
 return undefined;
}
function buildRuns(mode){
 if(mode==='empty')return[];
 return[
  {id:'run-001',type:'positioning',inputs:[{ref:'positioning.md',ver:1},{ref:'profile.json',ver:2},{ref:'README.md',ver:null}],
   status:'done',session:'外部 Agent 会话 A（演示）',at:'09-09 15:20',
   summary:'输出 2 条事实、1 条假设；候选 2 项：采纳 1 项（差异点 → positioning.md@v2），保留草稿 1 项。',
   draftRef:'agent-runs/run-001/draft.md',result:'success',
   adopted:['差异点补充：跨会话可追溯（写入 positioning.md@v2）'],kept:['受众细分假设（样本不足）'],continueOf:null},
  {id:'run-002',type:'channels',inputs:INPUTS_BY_TYPE.channels.map(([r,v])=>({ref:r,ver:v})),
   status:'copied',session:null,at:'09-10 17:10',summary:null,
   draftRef:null,result:'waiting',adopted:[],kept:[],continueOf:null}
 ];
}
function resetMode(m){
 state.mode=m;archive=buildArchive(m);runs=buildRuns(m);state.message='已切换演示场景：「'+$('#mode option:checked').text+'」，页面数据已重置为该场景初始状态。';render();
}

function promptHeader(run,type,fallback,emptyProject){
 const t=TYPES[type];
 const lines=[
 '# project-growth 任务提示词（'+t.name+'）',
 '- 项目：agent-team-board（演示项目路径 /demo/agent-team-board）；只允许访问该项目授权范围内的路径。',
 '- 执行方式：本提示词由界面复制而来，在可访问项目文件的 Agent 会话中人工执行；界面不自动运行任何模型。',
 '- 营销资料目录：docs/agent-team-board/marketing/'
 ];
 if(emptyProject){
  lines.push('- 输入：营销档案不存在（docs/agent-team-board/marketing/ 未初始化，演示）。仅可读取项目 README.md，输出必须标注「档案缺失，仅基于 README 与通用方法」。');

 );

/* ---------- 回执 ---------- */
function findRun(id){return runs.find(r=>r.id===id)}
function loadDraft(run){
 const d=run.type==='review'&&run.obs&&run.obs.indexOf('无观察记录')>=0?DRAFTS.reviewNoData:DRAFTS[run.type];
 run.draft=JSON.parse(JSON.stringify(d));
 run.draftWarn=state.mode==='empty'?'输入资料缺失：以下输出仅基于 README 与通用方法（兜底，演示）。':null;
}
function simulateReceipt(id){
 const run=findRun(id);if(!run)return;
 const stale=(run.inputs||[]).filter(i=>{const c=currentVer(i.ref);return c!==undefined&&i.ver!==null&&i.ver!==undefined&&c>i.ver});
 if(stale.length){
  run.status='stale';run.at='刚刚';run.result='rejected:stale';
  run.summary='回执被拒绝：输入基线过期（'+stale.map(s=>s.ref+' 任务输入 r'+s.ver+' < 当前 r'+currentVer(s.ref)).join('；')+'）。未写入任何草稿。';
  state.message='输入基线过期：任务创建后档案已变化，回执未写入。请按当前版本重建任务并重新执行（旧草稿不落地，不会覆盖他人更新）。';
  closeModal();render();return;
 }
 if(state.mode==='savefail'){
  loadDraft(run);run.status='failed';run.at='刚刚';run.result='error:write-failed';
  state.message='保存失败：写入 agent-runs/'+run.id+' 失败（演示）。草稿内容已保留在面板中未丢失，旧成果未受影响；可重试保存。';
  closeModal();openDraft(run.id);render();return;
 }
 loadDraft(run);
 run.status='receipt';run.at='刚刚';run.session='外部 Agent 会话（演示）';run.result='success';
 run.draftRef='agent-runs/'+run.id+'/draft.md';
 run.summary=run.draft.insufficient?'数据不足：输出补采建议，未生成结论。':'输出 '+run.draft.facts.length+' 条事实、'+run.draft.assumptions.length+' 条假设；候选 '+run.draft.candidates.length+' 项待逐项处理。';
 state.message='回执已写入 '+run.id+'：草稿待处理——请逐项编辑 / 采纳 / 保留草稿；未采纳项保留在草稿中。';
 openDraft(run.id);render();
}
function simulateDupReceipt(id){
 const run=findRun(id);if(!run)return;
 if(run.status!=='receipt'&&run.status!=='done'){state.message='尚未收到首次回执，无「重复提交」可言（演示）。';render();return}
 state.message='重复回执：任务 ID 相同（'+run.id+'），幂等跳过，未重复保存、草稿引用不变。';render();
}
function retrySave(id){
 const run=findRun(id);if(!run||run.status!=='failed')return;
 run.status='receipt';run.result='success';run.draftRef='agent-runs/'+run.id+'/draft.md';
 state.message='重试保存成功：草稿已写入 '+run.id+'（此前失败的草稿内容与本次一致，未丢失）。';
 openDraft(run.id);render();
}
function rebuildRun(id){
 const old=findRun(id);if(!old)return;
 const run={id:'run-'+String(nextRun++).padStart(3,'0'),type:old.type,
  inputs:INPUTS_BY_TYPE[old.type].map(([r,v])=>({ref:r,ver:currentVer(r)??v})),
  status:'copied',session:null,at:'刚刚',summary:null,draftRef:null,result:'waiting',adopted:[],kept:[],continueOf:null,
  obs:old.obs};
 run.prompt=promptHeader(run,old.type,panel?panel.fallback&&state.mode==='noskill':false,false);
 runs.unshift(run);old.status='stale';
 state.message='已按当前版本重建任务 '+run.id+'（输入引用已更新），请复制新提示词在外部会话重新执行；旧回执未写入。';
 closeModal();render();
}

 const sec=(title,arr)=>`<div class="dbox"><h4>${title}</h4><ul>${(arr||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="mut">—</li>'}</ul></div>`;
 const candHtml=d.insufficient
  ?'<div class="notice warn">数据不足：该观察期无观察记录（未录入 ≠ 0）。本草稿仅输出补采建议，不生成业绩结论或因果判断；补采后再生成复盘。</div><div class="dbox"><h4>补采建议</h4><ul>'+d.advice.map(a=>`<li>${esc(a)}</li>`).join('')+'</ul></div>'
  :d.candidates.map(c=>{
   const adopted=run.adopted.includes(c.id),kept=run.kept.includes(c.id);
   const cls=adopted?'adopted':kept?'kept':'';
   return `<div class="cand ${cls}"><div class="ttl"><span class="badge acc">${esc(c.kind)}</span> ${esc(c.title)} ${adopted?'<span class="badge zero">已采纳</span>':kept?'<span class="badge">保留草稿</span>':''}</div>
    <div class="kv">建议理由：${esc(c.reason)}</div><div class="kv">验证方法：${esc(c.verify)}</div><div class="kv">显式采纳后写入：${esc(c.adoptTo)}</div>
    <div class="ops">${(!adopted&&!kept)?`<button data-action="cand-edit" data-id="${run.id}" data-cid="${c.id}">编辑</button> <button class="primary" data-action="cand-adopt" data-id="${run.id}" data-cid="${c.id}">采纳</button> <button data-action="cand-keep" data-id="${run.id}" data-cid="${c.id}">保留草稿</button>`:''}</div></div>`;
  }).join('');
 openModal(`<h2>返回草稿 · ${run.id}（${TYPES[run.type].name}${run.obs?' · '+esc(run.obs):''}）</h2>
  <div class="grid2"><div>来源会话：${esc(run.session||'—')}</div><div>回执时间：${esc(run.at)}</div><div>草稿引用：${esc(run.draftRef||'（未写入）')}</div><div>输入引用：${run.inputs.map(i=>esc(i.ref)+(i.ver!=null?'@r'+i.ver:'')).join(' · ')}</div></div>
  ${run.status==='failed'?'<div class="notice error">保存失败：草稿内容已保留在本面板（未写入 agent-runs），旧成果不受影响。关闭后可在运行记录中「重试保存」。</div>':''}
  ${run.draftWarn?'<div class="notice warn">'+esc(run.draftWarn)+'</div>':''}
  <div class="draft-cols">${sec('事实',d.facts)}${sec('假设',d.assumptions)}${sec('待确认',d.toConfirm)}</div>
  <h3>证据引用</h3><div class="dbox"><ul>${d.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>
  <h3 style="margin-top:14px">候选行动（逐项处理：编辑 → 采纳 / 保留草稿）</h3>${candHtml}
  <h3 style="margin-top:14px">缺失信息</h3><div class="dbox"><ul>${d.missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>
  <div class="actions"><button class="demo-ctl" data-action="receipt-dup" data-id="${run.id}">模拟重复提交回执（演示）</button><span style="flex:1"></span><button data-action="close">关闭</button><button data-action="continue-prompt" data-id="${run.id}">复制继续任务提示词</button></div>`);
}
function settle(run){
 const d=run.draft;
 if(d.candidates.every(c=>run.adopted.includes(c.id)||run.kept.includes(c.id))){
  run.status='done';run.result='success';
  run.summary='候选 '+(d.candidates.length)+' 项：采纳 '+run.adopted.length+' 项，保留草稿 '+run.kept.length+' 项。';
 }
}
function adoptCand(id,cid){
 const run=findRun(id);if(!run)return;
 const c=run.draft.candidates.find(x=>x.id===cid);if(!c)return;
 if(run.draft.insufficient){state.message='数据不足的草稿没有候选行动可采纳（演示）。';render();return}
 /* 显式采纳 → 写入正式档案；候选不自动生效 */
 let msg='';
 if(c.kind==='定价'){
  const nv='v'+(archive.pricing.length+1);
  archive.pricing.push({v:nv,mode:c.title.replace(/^候选定价 [^：]+：/,''),status:'候选'});
  msg='已写入候选版本 '+nv+'（pricing/'+nv+'.json）。当前方案未改变——候选价格不自动生效，需在「定位与定价」页显式设为当前。';
 }else if(c.kind==='定位'){
  archive.positioning.ver++;archive.evidence.push(['假设',c.title]);
  msg='定位档案已更新（positioning.md@v'+archive.positioning.ver+'），采纳内容标记为「假设」待验证。';
 }else if(c.kind==='渠道'){
  archive.channels.push({name:c.title.replace(/^新渠道候选：/,''),status:'待验证假设'});
  msg='渠道已写入 channels/（状态=待验证假设）：候选渠道不自动变为已验证，需按验证方法执行实验。';
 }else if(c.kind==='实验'){
  archive.experiments.push({id:'exp-community',name:'社区首发帖',status:'草稿',rev:1});
  msg='实验已写入 experiments/exp-community.json（草稿状态）：开始观察前仍需人工确认。';
 }else if(c.kind==='行动'){
  archive.contents.push({title:c.title});
  msg='行动草稿已写入 activities/：内容仅生成草稿，人工复制发布，不自动发送。';
 }else if(c.kind==='复盘'){
  archive.reviews.unshift({id:'RV-2',period:run.obs||'08-11~09-07',snap:'metrics@r2',conclusion:c.title+'（'+c.reason+'）'});
  msg='复盘已写入并绑定快照 metrics@r2：后续数据修订不改变本复盘依据。';
 }
 run.adopted.push(cid);settle(run);
 state.message='已采纳 1 项：'+msg+(run.status==='done'?' 本任务全部候选处理完毕。':'');
 openDraft(run.id);render();
}
function keepCand(id,cid){
 const run=findRun(id);if(!run)return;
 const c=run.draft.candidates.find(x=>x.id===cid);if(!c)return;
 run.kept.push(cid);settle(run);
 state.message='已保留草稿（未写入正式档案）：候选保留在 agent-runs/'+run.id+'，可随时重新处理。';
 openDraft(run.id);render();
}
function editCand(id,cid){
 const run=findRun(id);if(!run)return;
 const c=run.draft.candidates.find(x=>x.id===cid);if(!c)return;
 openModal(`<h2>编辑候选（${esc(c.kind)}）</h2>
  <div class="row"><label>标题 / 内容</label><textarea id="ce-title" rows="3" class="full">${esc(c.title)}</textarea></div>
  <div class="row"><label>验证方法</label><textarea id="ce-verify" rows="2" class="full">${esc(c.verify)}</textarea></div>
  <div class="err-msg" id="ce-err"></div>
  <div class="actions"><button data-action="close">取消</button><button class="primary" data-action="cand-edit-save" data-id="${run.id}" data-cid="${cid}">保存编辑</button></div>`);
}
function saveCandEdit(id,cid){
 const run=findRun(id);const c=run&&run.draft.candidates.find(x=>x.id===cid);if(!c)return;
 const t=$('#ce-title').value.trim(),v=$('#ce-verify').value.trim();
 if(!t){$('#ce-err').textContent='标题 / 内容不能为空。';return}
 c.title=t;c.verify=v||c.verify;c.edited=true;
 state.message='候选已编辑（保存回草稿，尚未采纳）：编辑结果保留在 '+run.id+' 草稿中。';
 openDraft(run.id);render();
}
function continueTask(id){
 const run=findRun(id);if(!run)return;
 const txt=continuePrompt(run);
 const type=panel?panel.type:run.type;const keepType=run.type;
 openModal(`<h2>继续任务提示词（接续 ${run.id}）</h2>
  <p class="hint">接续提示词包含历史草稿与采纳记录引用，可粘贴到新的外部会话继续任务（跨会话接续）。</p>
  <pre>${esc(txt)}</pre>
  <div class="actions"><button data-action="close">关闭</button><button class="primary" data-action="continue-copy" data-id="${run.id}">复制并登记新任务</button></div>`);
}
function continueCopy(id){
 const old=findRun(id);if(!old)return;
 const run={id:'run-'+String(nextRun++).padStart(3,'0'),type:old.type,
  inputs:INPUTS_BY_TYPE[old.type].map(([r,v])=>({ref:r,ver:currentVer(r)??v})),
  status:'copied',session:null,at:'刚刚',summary:null,draftRef:null,result:'waiting',adopted:[],kept:[],continueOf:old.id,obs:old.obs};
 run.prompt=continuePrompt(old);
 runs.unshift(run);
 copyText(run.prompt,'继续任务提示词');
 state.message='已复制继续任务提示词并登记 '+run.id+'（接续 '+old.id+'，含历史引用）；尚未收到结果。';
 closeModal();render();
}

/* ---------- 运行详情 ---------- */
function openRunInfo(id){
 const run=findRun(id);if(!run)return;
 const kv=(k,v)=>`<div><span class="mut">${k}：</span>${v}</div>`;
 openModal(`<h2>运行详情 · ${run.id}（${TYPES[run.type].name}）</h2>
  <div class="grid2">
  ${kv('任务 ID',esc(run.id))}${kv('来源会话',esc(run.session||'—（可得时记录）'))}
  ${kv('输入引用及版本',run.inputs.map(i=>esc(i.ref)+(i.ver!=null?'@r'+i.ver:'')).join(' · '))}
  ${kv('输出摘要',esc(run.summary||'—（尚未收到回执）'))}
  ${kv('草稿引用',esc(run.draftRef||'—'))}${kv('写入时间',esc(run.at||'—'))}
  ${kv('执行结果',esc(run.result||'—'))}
  ${kv('接续自',run.continueOf?esc(run.continueOf):'—')}
  </div>
  ${run.adopted.length||run.kept.length?'<h3 style="margin-top:12px">采纳记录</h3><div class="dbox"><ul>'+run.adopted.map(a=>`<li><span class="badge zero">已采纳</span> ${esc(a)}</li>`).join('')+run.kept.map(a=>`<li><span class="badge">保留草稿</span> ${esc(a)}</li>`).join('')+'</ul></div>':''}
  ${run.prompt?'<h3 style="margin-top:12px">任务提示词（留档）</h3><pre>'+esc(run.prompt)+'</pre>':''}
  <div class="actions"><button data-action="close">关闭</button></div>`);
}

/* ---------- modal 基础 ---------- */
function openModal(html){$('#modal').innerHTML=html;$('#overlay').hidden=false}
function closeModal(){$('#overlay').hidden=true;panel=null}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeModal()});

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const a=el.dataset.action,id=el.dataset.id,cid=el.dataset.cid;
 if(a==='theme'){const l=document.documentElement.classList.toggle('light');el.textContent=l?'切换深色':'切换浅色'}
 else if(a==='close')closeModal();
 else if(a==='panel')openPanel(el.dataset.type);
 else if(a==='panel-any')openPanel(null);
 else if(a==='copy-prompt')copyPrompt();
 else if(a==='receipt')simulateReceipt(id);
 else if(a==='receipt-dup')simulateDupReceipt(id);
 else if(a==='retry-save')retrySave(id);
 else if(a==='rebuild')rebuildRun(id);
 else if(a==='draft')openDraft(id);
 else if(a==='info')openRunInfo(id);
 else if(a==='cand-adopt')adoptCand(id,cid);
 else if(a==='cand-keep')keepCand(id,cid);
 else if(a==='cand-edit')editCand(id,cid);
 else if(a==='cand-edit-save')saveCandEdit(id,cid);
 else if(a==='continue-prompt')continueTask(id);
 else if(a==='continue-copy')continueCopy(id);
 else if(a==='copy-text'){copyText(el.dataset.title+'（演示文案样例）','行动文案');render()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='mode')resetMode(e.target.value);
 if(e.target.id==='panel-type'&&panel){panel.type=e.target.value;panel.runId=null;panel.fallback=state.mode==='noskill';panel.empty=state.mode==='empty';renderPanel()}
 if(e.target.name==='obs'&&panel){/* 观察期在选择时即时读取，无需处理 */}
});
document.addEventListener('click',e=>{ // 页签切换（无 data-action）
 const t=e.target.closest('[data-tab]');if(!t)return;
 state.tab=t.dataset.tab;state.message='';
 document.querySelectorAll('.modnav .tab').forEach(b=>b.classList.toggle('on',b===t));
 render();
});
archive=buildArchive(state.mode);runs=buildRuns(state.mode);render();
</script>
</body>
</html>
