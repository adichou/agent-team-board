<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择区域布局优化</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e2e7f0;font:15px system-ui}main{max-width:1200px;margin:30px auto;padding:20px}button,select{font:inherit;color:inherit;background:#202a3c;border:1px solid #49566d;border-radius:9px;padding:9px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.active{border-color:#9290ff;color:#aaa8ff}nav,.toolbar,.controls,.group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}nav{margin:20px 0}.panel{border:1px solid #394559;border-radius:16px;padding:16px}.toolbar{min-height:48px;border-bottom:1px solid #394559;padding-bottom:14px}.quick{margin-left:auto}.card{padding:22px 12px;background:#1a2230;margin-top:12px;border-radius:10px}.notice{padding:16px;color:#b9c6db}.error{color:#ffb5a6}input{width:18px;height:18px;margin-right:12px}.hint{color:#aebbd0}h1{font-size:24px}</style><main><h1>选择区域布局优化</h1><p class="hint">离线示意 · 操作仅作用于样例 · 缩窄窗口可验证自动换行</p><div class="controls"><label>演示状态 <select id="mode"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label></div><nav id="tabs" aria-label="分类"></nav><section class="panel"><div class="toolbar" id="toolbar"></div><div id="feedback" role="status" aria-live="polite"></div><div id="list"></div></section></main><script>
const names=['待接受','已接受','已计划','开发中','待测试','已完成'], counts=[6,4,3,2,5,180], selections=names.map(()=>new Set());let lane=0,order='最新更新',message='';
const mode=document.querySelector('#mode'),tabs=document.querySelector('#tabs'),toolbar=document.querySelector('#toolbar'),list=document.querySelector('#list'),feedback=document.querySelector('#feedback');
function render(){let m=mode.value, busy=m==='loading',empty=m==='empty',selectable=lane<3,selected=selections[lane],n=empty?0:Math.min(counts[lane],6);tabs.innerHTML=names.map((x,i)=>`<button class="${i===lane?'active':''}" aria-pressed="${i===lane}" data-lane="${i}">${x} ${empty&&i===lane?0:counts[i]}</button>`).join('');toolbar.innerHTML=`<select aria-label="列表排序" id="sort">${['最新更新','最早更新','最新创建','最早创建','单号'].map(x=>`<option ${x===order?'selected':''}>${x}</option>`).join('')}</select>`;
if(selectable){toolbar.innerHTML+=`<button id="all" ${busy||!n?'disabled':''}>☑ 全选</button><button id="none" ${busy||!selected.size?'disabled':''}>☐ 全不选</button>`;if(selected.size){toolbar.innerHTML+=`<div class="group"><strong>已选 ${selected.size} 项</strong>${(lane===0?['接受所选']:lane===1?['移入计划','驳回待接受']:['移出计划']).map(x=>`<button data-action="${x}" ${busy?'disabled':''}>${busy?'处理中…':x}</button>`).join('')}</div>`;}}
if(lane===1||lane===2)toolbar.innerHTML+=`<button class="quick" id="quick">${lane===1?'开始完善':'开始开发'}</button>`;
feedback.className='notice'+(m==='error'?' error':'');feedback.innerHTML=m==='loading'?'正在加载，请稍候…':m==='error'?'样例请求失败：REQ-DEMO-001 尚未处理。<button id="retry">重试</button>':message||(lane===5?'演示仅显示最新 6 / 180 项；更早条目可通过搜索获取。':'');
let ids=Array.from({length:n},(_,i)=>i);if(order==='最早更新'||order==='最早创建')ids.reverse();list.innerHTML=empty?'<p class="notice">当前分类暂无条目</p>':busy?'<p class="notice">列表加载中…</p>':ids.map(i=>`<div class="card"><label>${selectable?`<input type="checkbox" data-id="${i}" ${selected.has(i)?'checked':''}>`:''}REQ-DEMO-00${i+1} · ${names[lane]}示例条目 ${i+1}</label></div>`).join('');
document.querySelector('#sort').onchange=e=>{order=e.target.value;render()};document.querySelector('#all')?.addEventListener('click',()=>{ids.forEach(i=>selected.add(i));render()});document.querySelector('#none')?.addEventListener('click',()=>{selected.clear();render()});document.querySelector('#quick')?.addEventListener('click',()=>{message='已模拟导航到'+(lane===1?'批量完善':'批量开发')+'面板（与勾选无关）';render()});document.querySelector('#retry')?.addEventListener('click',()=>{mode.value='normal';message='重试成功（演示），保留选择';render()});}
tabs.onclick=e=>{if(e.target.dataset.lane!==undefined){lane=Number(e.target.dataset.lane);message='';render()}};list.onchange=e=>{const i=Number(e.target.dataset.id);e.target.checked?selections[lane].add(i):selections[lane].delete(i);render()};toolbar.onclick=e=>{if(e.target.dataset.action){message=e.target.dataset.action+'完成（演示），共 '+selections[lane].size+' 项';selections[lane].clear();render()}};mode.onchange=()=>{message='';if(mode.value==='empty')selections[lane].clear();render()};render();</script></html>
