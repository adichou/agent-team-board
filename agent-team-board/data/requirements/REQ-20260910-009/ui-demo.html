<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索模块优化演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#243047;font:15px system-ui}main{max-width:1080px;margin:auto;padding:24px}nav,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #b6c2d5;border-radius:8px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e8efff}:focus-visible{outline:3px solid #477cf0}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:25px 0}.search{display:flex;align-items:center;gap:8px;flex:1;max-width:620px}.search input{min-width:0;flex:1;width:100%}.panel{padding:20px;background:white;border:1px solid #dce2eb;border-radius:14px;margin:14px 0}.muted{color:#68758b;font-size:13px}.result{display:block;width:100%;text-align:left;margin:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#results{max-height:360px;overflow:auto}.error{color:#b63838}h1{font-size:22px;white-space:nowrap}#detail{overflow-wrap:anywhere}@media(max-width:650px){main{padding:14px}header{align-items:stretch;flex-direction:column}.search{max-width:none;flex-wrap:wrap}.search label{width:100%}}
</style><main><p class="muted">REQ-20260910-009 · 离线交互演示 · 所有结果均为示意数据</p><nav aria-label="模块"><button>讨论</button><button>需求</button><button>任务</button><button>全局</button><button>文件</button></nav><header><h1 id="heading">需求搜索</h1><div class="search"><label id="scope" for="query">当前需求</label><input id="query" type="search" placeholder="输入“搜索”体验" autocomplete="off"><button id="clear">清除</button></div></header><div class="row"><label for="mode">演示状态</label><select id="mode"><option value="normal">正常</option><option value="empty">空结果</option><option value="loading">加载</option><option value="error">失败</option><option value="truncated">截断</option></select><span class="muted">输入自动搜索；Enter 搜索；Esc 清空</span></div><section class="panel"><div id="message" role="status" aria-live="polite"></div><div id="actions"></div><div id="results"></div></section><section id="detail" class="panel">详情预览：点击搜索结果在此查看。</section></main><script>
const q=document.getElementById('query'),mode=document.getElementById('mode'),message=document.getElementById('message'),results=document.getElementById('results'),actions=document.getElementById('actions');let moduleName='需求',timer;const data={需求:[['条目','示例需求：搜索模块优化'],['文档','示例需求 / README.md：搜索布局与验收标准']],文件:[['文件','docs/example/README.md — 搜索说明']],讨论:[['讨论','示例讨论：搜索体验反馈']],任务:[['任务','示例任务：搜索文档完善']],全局:[['跨项目任务','示例项目 / 示例批次：搜索改进']]};
function button(text,fn,parent=actions){const b=document.createElement('button');b.textContent=text;b.onclick=fn;parent.append(b);return b}
function render(){clearTimeout(timer);results.replaceChildren();actions.replaceChildren();message.className='';const term=q.value.trim();if(!term){message.textContent='在'+moduleName+'范围内搜索。当前显示模块原有内容（示意）。';return}if(mode.value==='loading'){message.textContent='正在搜索“'+term+'”… 可继续输入或清除';return}if(mode.value==='error'){message.className='error';message.textContent='搜索失败：演示连接异常。关键词已保留。';button('重试',()=>{mode.value='normal';render()});return}const rows=mode.value==='empty'?[]:data[moduleName].filter(x=>x[1].includes(term));if(!rows.length){message.textContent='未找到“'+term+'”的匹配结果，请修改关键词或清除搜索。';button('清除搜索',clear);return}message.textContent='“'+term+'” · '+moduleName+' · '+rows.length+' 条示意命中'+(moduleName==='需求'?'（条目 1 · 文档 1；当前筛选可见条目 1）':'')+(mode.value==='truncated'?' · 仅显示部分结果，请缩小关键词':'');rows.forEach(([kind,text])=>{const b=button(kind+' · '+text,()=>{document.getElementById('detail').textContent='已打开 '+text+'。这是对应内容的本地预览示意。'},results);b.className='result';b.title=text});if(moduleName==='需求')button('文件命中 1 · 在文件查看',()=>switchTo('文件'));if(moduleName==='文件')button('在需求查看相关命中',()=>switchTo('需求'))}
function clear(){clearTimeout(timer);q.value='';render();q.focus()}function switchTo(name){moduleName=name;document.getElementById('heading').textContent=name+'搜索';document.getElementById('scope').textContent=name==='全局'?'跨项目':'当前'+name;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===name)));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTo(b.textContent));q.oninput=()=>{clearTimeout(timer);timer=setTimeout(render,250)};q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();render()}if(e.key==='Escape'){e.stopPropagation();clear()}};document.getElementById('clear').onclick=clear;mode.onchange=()=>{if(!q.value)q.value='搜索';render()};switchTo('需求');
</script></html>
