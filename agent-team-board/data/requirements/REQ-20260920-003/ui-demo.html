<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布流程 · REQ-20260920-003</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#243046;font:15px system-ui}header{background:#172238;color:white;padding:20px 28px}h1{font-size:22px;margin:0}h2{font-size:21px}small,.muted{color:#66748b}header small{color:#c4d0e1}.shell{display:grid;grid-template-columns:260px 1fr;max-width:1250px;margin:24px auto;gap:22px;padding:0 20px}aside,main{background:white;border:1px solid #dae0e9;border-radius:14px;padding:22px}button,select{font:inherit;padding:9px 13px;border:1px solid #c6cedc;background:white;border-radius:7px;cursor:pointer;margin:4px}button:hover{background:#edf2ff}button:disabled{cursor:not-allowed;opacity:.45}.primary,.active{background:#285dcc!important;color:white;border-color:#285dcc}nav{display:flex;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:12px}.notice{padding:13px;background:#fff4d7;border:1px solid #e5c36f;border-radius:8px;margin:15px 0}.ok{background:#e6f5ec;border-color:#8dbda0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.editor{display:grid;grid-template-columns:1fr 1fr;gap:15px}textarea{width:100%;min-height:190px;border:1px solid #b8c4d8;border-radius:8px;padding:14px;font:14px monospace}pre{white-space:pre-wrap;word-break:break-word;background:#f4f6fa;border-radius:8px;padding:15px;min-height:80px}.card{padding:14px;border:1px solid #ccd5e4;border-radius:8px;margin:12px 0}.badge{display:inline-block;background:#e8efff;padding:6px;border-radius:5px;color:#2454a7}label{display:inline-block;margin:5px}footer{margin:20px;color:#66748b;font-size:13px}@media(max-width:780px){.shell,.editor{grid-template-columns:1fr}aside{padding:12px}}
</style><header><h1>Agent Team Board / 发布</h1><small>交互原型 · 所有提交、IDE、合并和检测均为模拟；仅本地模拟，无真实副作用</small></header><div class="shell"><aside><h2>版本计划</h2><button id="create">＋ 创建示例计划</button><div id="plan"></div><hr><label>场景 <select id="scene"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><p class="muted">场景切换用于检查反馈，恢复正常保留当前进度。</p></aside><main><nav id="steps"></nav><div id="feedback" role="status" aria-live="polite"></div><div id="content"></div></main></div><footer>四类文档共八个文件已确认；官网每分钟检查本地主分支，不代表已推送或部署。仅扫描项目推送成功后的时间窗口；不做全历史扫描。</footer><script>
const $=s=>document.querySelector(s), names=['版本计划','关联范围','文档编写','合并入 main','正式发布'];let step=0,exists=true,linked=false,stale=false,committed=false,merged=false,pushed=false,matched=false,doc='README',lang='中文',conflict=false,branch='dev',pushTime='',scanState='waiting';const docs={};let notice='';
function text(){return docs[doc+lang]??(lang==='中文'?'# '+doc+'\n\n用简洁语言说明本版本用户可见变化。\nREADME 应链接 CHANGELOG.md 与 FEATURES.md。':'# '+doc+'\n\nExplain user-visible changes clearly.\nLink to CHANGELOG and FEATURES.');}
function msg(s){notice=s;render();}function render(){const scene=$('#scene').value;$('#plan').innerHTML=exists?'<div class="card"><strong>发布流程优化</strong><p>BLD-20260920-001</p><span class="badge">版本 20260920-001</span><p>'+ (matched?'正式发布完成':pushed?'等待官网同步':merged?'已合并':committed?'文档已提交':'计划中')+'</p></div>':'<p>暂无版本计划</p>';$('#steps').innerHTML=names.map((n,i)=>'<button class="'+(step===i?'active':'')+'" data-step="'+i+'">'+(i+1)+' '+n+'</button>').join('');$('#feedback').textContent=notice;$('#feedback').className=notice?'notice':'';if(scene==='loading'){$('#content').innerHTML='<h2>正在读取版本资料…</h2><p>操作暂不可用，请切回正常场景继续。</p>';return}if(scene==='error'){$('#content').innerHTML='<h2>读取失败</h2><p>模拟：仓库不可访问，进度与编辑内容已保留。</p><button id="retry">重试</button>';$('#retry').onclick=()=>{$('#scene').value='normal';render()};return}if(scene==='empty'||!exists){$('#content').innerHTML='<h2>尚无版本计划</h2><p>先创建版本，再关联需求和 Bug。</p>';return}
let html='';if(step===0)html='<h2>版本计划</h2><p>计划号：BLD-20260920-001</p><p>版本号：<strong>20260920-001</strong>（自动提取）</p><p>名称：发布流程优化</p><button id="next" class="primary">关联条目与提交</button>';
if(step===1)html='<h2>关联范围</h2><div class="card">'+(linked?'示例需求 B · bbbbbbb<br>示例 Bug C · ccccccc':'暂无关联条目，请先添加')+'</div><button id="link">'+(linked?'模拟更换关联 commit':'关联示例条目')+'</button><p class="muted">模拟记录，不对应真实项目单据；修改范围会使已有文档过期。</p>';
if(step===2)html='<h2>文档编写</h2><div class="notice">'+(!linked?'请先关联条目':stale?'范围已变更：需重新编写':committed?'已提交 · 示例 hash ddddddd':'文档未提交')+'</div><button id="prompt">AI 写作提示词</button><button id="ide">TRAE CN / TRAE 编辑</button><div id="promptbox"></div><div class="row"><label>文档 <select id="doc">'+['README','CHANGELOG','FEATURES','AGENTS'].map(d=>'<option '+(d===doc?'selected':'')+'>'+d+'</option>').join('')+'</select></label><label>语言 <select id="lang"><option '+(lang==='中文'?'selected':'')+'>中文</option><option '+(lang==='English'?'selected':'')+'>English</option></select></label></div><div class="editor"><label>编辑<textarea id="edit"></textarea></label><div>内容预览（纯文本）<pre id="preview"></pre></div></div><button id="review" '+(!linked?'disabled':'')+'>确认已按当前范围重写</button><button id="commit" class="primary" '+(!linked||stale||committed?'disabled':'')+'>提交文档到 Git</button>';
if(step===3)html='<h2>合并入 main</h2><div class="card">范围：'+(linked?'需求 B + Bug C':'未关联')+'<br>文档提交：'+(committed?'ddddddd':'尚未提交')+'<br>开发工作目录：'+branch+'</div><label>模拟当前分支 <select id="branch">'+['dev','main','feature/demo','detached HEAD'].map(b=>'<option '+(b===branch?'selected':'')+'>'+b+'</option>').join('')+'</select></label><p>'+ (branch!=='dev'?'当前不在 dev，请自行切换回 dev 后重试；禁止隔离执行绕过。':'dev 工作区保持不变')+'</p><p>普通 merge 可能夹带祖先 A；必须核对实际变化。</p><label><input id="conflict" type="checkbox" '+(conflict?'checked':'')+'> 模拟 B 依赖未选 A</label><div class="notice">'+(conflict?'范围隔离失败：需要未选 A，阻止合并':merged?'已合并；dev 工作区未变':!committed||stale?'请先完成并提交最新文档':'范围核对通过：仅 B、C 和文档，可模拟隔离合并')+'</div><button id="merge" class="primary" '+(!committed||stale||conflict||merged||branch!=='dev'?'disabled':'')+'>合并入 main</button>';
if(step===4)html='<h2>正式发布</h2><div class="card"><h3>1 · 推送主分支</h3><p>'+ (pushed?'已推送 origin/main':merged?'目标：origin/main · 版本 20260920-001':'请先完成合并')+'</p><button id="push" '+(!merged||pushed||branch!=='dev'?'disabled':'')+'>推送 main</button></div><div class="card"><h3>2 · 官网同步</h3><p>每分钟检查官网本地主分支；不自动 fetch。匹配不代表已推送或网站已部署。</p><button id="site" '+(!pushed?'disabled':'')+'>官网 AI 写作提示词</button><div id="sitebox"></div><p>'+ (matched?'正式发布完成 · 官网主分支命中 BLD-20260920-001 · 示例 eeeeeee':pushed?'等待官网主分支提交包含完整计划号':'等待推送成功')+'</p><p>官网路径：示例 /demo/site · 实际分支：main</p><p>扫描起点：'+(pushTime||'缺少推送完成时间，待核对')+'</p><p>仅检查起点之后（含边界）的本地主分支提交；不自动扩大为全历史。后台分批，未扫完不作未命中结论。</p><p role="status">检测状态：'+({waiting:'等待检测',scanning:'扫描中，可继续操作其他步骤',empty:'本窗口未命中，等待官网同步',error:'检测失败：模拟超时，可重试；不代表未命中',missing:'缺少推送完成时间，待核对',matched:'命中完整计划号'}[scanState])+'</p><button id="scan" '+(!pushed?'disabled':'')+'>模拟扫描中</button><button id="scanerror" '+(!pushed?'disabled':'')+'>模拟检测失败</button><button id="missing" '+(!pushed?'disabled':'')+'>模拟缺失起点</button><button id="detect" '+(!pushed?'disabled':'')+'>立即检测（模拟未命中）</button><button id="match" '+(!pushed?'disabled':'')+'>模拟检测命中</button></div>';
$('#content').innerHTML=html;bind();}
function on(id,f){if($(id))$(id).onclick=f}function bind(){on('#next',()=>{step=1;render()});on('#link',()=>{linked=true;stale=committed||step===1&&Object.keys(docs).length>0;committed=false;merged=false;pushed=false;matched=false;msg(stale?'范围已变化，请重新写作并提交。':'已关联示例条目，可进入文档编写。')});if($('#edit')){$('#edit').value=text();$('#preview').textContent=text();$('#edit').setAttribute('aria-label',doc+(lang==='中文'?'.md':'.en.md'));$('#preview').insertAdjacentHTML('beforebegin','<p>'+doc+(lang==='中文'?'.md':'.en.md')+'</p>');$('#edit').oninput=e=>{docs[doc+lang]=e.target.value;$('#preview').textContent=e.target.value;committed=false;merged=false;pushed=false;matched=false;$('#commit').disabled=!linked||stale;$('#feedback').textContent='编辑尚未提交';$('#feedback').className='notice'};$('#doc').onchange=e=>{doc=e.target.value;render()};$('#lang').onchange=e=>{lang=e.target.value;render()}}
on('#prompt',()=>{$('#promptbox').innerHTML='<pre></pre>';$('#promptbox pre').textContent='你是技术写作人员。主会话派发一个子代理，为 BLD-20260920-001 / 20260920-001 写作文档。核实当前关联范围 B、C 及实际代码，简练通俗说明用户可见变化；不得简单罗列条目。补齐四类文档中英文，README 链接 CHANGELOG、FEATURES。未知事实待确认。示例项目路径仅为原型，正式提示词使用实际路径。';});on('#ide',()=>msg('模拟：未检测到 TRAE，请手动在 TRAE CN / TRAE 打开项目路径；未执行真实启动。'));on('#review',()=>{stale=false;msg('已确认按当前范围重写（模拟），请提交最新文档。')});on('#commit',()=>{committed=true;msg('已提交 · ddddddd（模拟，仅文档范围）')});if($('#branch'))$('#branch').onchange=e=>{branch=e.target.value;render()};if($('#conflict'))$('#conflict').onchange=e=>{conflict=e.target.checked;render()};on('#merge',()=>{merged=true;msg('合并完成（模拟）；仅本版变化，开发工作目录仍在 dev。')});on('#push',()=>{pushed=true;pushTime=pushTime||new Date().toISOString();scanState='waiting';msg('origin/main 推送成功（模拟），等待官网同步。')});on('#site',()=>{$('#sitebox').innerHTML='<pre></pre>';$('#sitebox pre').textContent='你是官网仓库中的技术写作人员。读取项目已发布版本 20260920-001 的 CHANGELOG.md、FEATURES.md 及英文资料，按官网自身架构更新内容。完成提交消息须带 BLD-20260920-001。官网架构不预设，项目路径与已发布基准使用实际值。';});on('#scan',()=>{scanState='scanning';matched=false;render()});on('#scanerror',()=>{scanState='error';matched=false;render()});on('#missing',()=>{scanState='missing';matched=false;msg('模拟存量记录缺少起点：不进行全历史扫描，请核对推送完成时间。')});on('#detect',()=>{scanState='empty';matched=false;msg('时间窗口检测未命中，继续等待；每分钟检查官网本地主分支，不代表已推送或部署。')});on('#match',()=>{matched=true;scanState='matched';msg('检测命中 BLD-20260920-001 · 主分支 · eeeeeee（模拟）。此标记不代表网站已经部署。')});}
$('#steps').onclick=e=>{if(e.target.dataset.step!==undefined){step=+e.target.dataset.step;notice='';render()}};$('#scene').onchange=render;$('#create').onclick=()=>{exists=true;$('#scene').value='normal';step=0;msg('已创建示例版本计划')};render();
</script></html>
