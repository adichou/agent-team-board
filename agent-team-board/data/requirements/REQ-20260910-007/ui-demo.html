<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快捷键演示</title><style>body{font:16px system-ui;background:#f3f5fa;color:#172640;margin:24px}header,section,aside{background:white;padding:20px;border:1px solid #cad3e1;border-radius:12px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;padding:9px;border:1px solid #a8b5ca;border-radius:6px}button{cursor:pointer;background:#edf2ff}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #375def}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}#list button{display:block;width:100%;margin:10px 0;text-align:left}dialog{border:1px solid #bbb;border-radius:14px;max-width:560px;max-height:80vh;overflow:auto}dialog::backdrop{background:#17264088}td,th{padding:12px;text-align:left}#msg{min-height:28px;color:#335abc}@media(max-width:650px){main{grid-template-columns:1fr}}</style><header><b>Status Board · 快捷键方案演示</b><input id="search" aria-label="搜索样例条目" placeholder="搜索样例条目 /"><button id="help">快捷键 ?</button></header><p>样例数据 · 非真实操作。点击页面空白后尝试快捷键。</p><label>数据状态 <select id="mode"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label><main><section><h2>需求列表</h2><div id="list"></div></section><aside id="detail" hidden><button id="close">关闭 Esc</button><h2 id="title"></h2><p>这是样例详情，无业务写入。</p><button id="prev">← 上一条</button> <button id="next">下一条 →</button></aside></main><p id="msg" role="status" aria-live="polite"></p><dialog id="helpBox"><h2>快捷键</h2><table><tr><th>按键</th><th>操作</th></tr><tr><td>/</td><td>聚焦当前搜索框</td></tr><tr><td>?</td><td>打开此帮助</td></tr><tr><td>← / →</td><td>切换已打开的详情，不循环</td></tr><tr><td>Esc</td><td>关闭最上层面板</td></tr></table><p>输入态及中文组合输入不触发导航；加载、失败、空态不能切换详情。Tab 在本面板内移动。</p><button id="helpClose">关闭帮助</button></dialog><script>
const $=id=>document.getElementById(id),items=['样例 01 · 项目管理','样例 02 · 支持快捷键','样例 03 · 文档浏览'];let selected=-1,opener=null;const filtered=()=>items.filter(x=>x.includes($('search').value));function say(s){$('msg').textContent=s}function render(){const mode=$('mode').value;$('list').replaceChildren();if(mode!=='normal'){selected=-1;$('detail').hidden=true;const p=document.createElement('p');p.textContent={empty:'暂无条目，导航不可用',loading:'正在加载… 导航暂不可用',error:'加载失败，请重试'}[mode];$('list').append(p);if(mode==='error'){const b=document.createElement('button');b.textContent='重试';b.onclick=()=>{$('mode').value='loading';render();setTimeout(()=>{$('mode').value='normal';render();say('已恢复');},700)};$('list').append(b)}return}const rows=filtered();if(!rows.length)$('list').textContent='没有匹配条目';rows.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>{opener=b;selected=i;draw()};$('list').append(b)});if(selected>=rows.length)selected=-1;draw()}function draw(){const rows=filtered();$('detail').hidden=selected<0;if(selected<0)return;$('title').textContent=rows[selected];$('prev').disabled=selected===0;$('next').disabled=selected===rows.length-1;say(selected===0?'已是第一条':selected===rows.length-1?'已是最后一条':'已切换详情')}function nav(delta){if(selected<0||$('mode').value!=='normal')return;selected=Math.max(0,Math.min(filtered().length-1,selected+delta));draw()}function closeDetail(){selected=-1;draw();(opener?.isConnected?opener:$('search')).focus();say('详情已关闭')}let helpOpener;function help(){if($('helpBox').open)return;helpOpener=document.activeElement;$('helpBox').showModal();$('helpClose').focus()}$('help').onclick=help;$('helpClose').onclick=()=>$('helpBox').close();$('helpBox').onclose=()=>helpOpener?.focus();$('close').onclick=closeDetail;$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);$('mode').onchange=()=>{say('');render()};$('search').oninput=()=>{selected=-1;render()};document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.repeat||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;if($('helpBox').open)return;if(e.key==='Escape'&&selected>=0){e.preventDefault();closeDetail();return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='/'){e.preventDefault();$('search').focus();say('已聚焦搜索框')}else if(e.key==='?'){e.preventDefault();help()}else if(selected>=0&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();nav(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>
