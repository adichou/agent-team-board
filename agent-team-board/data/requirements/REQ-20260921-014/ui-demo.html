<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本计划详情 · 概况页签编辑 · REQ-20260921-014</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f5f9;--panel:#fff;--text:#243046;--muted:#66748b;--border:#dae0e9;--primary:#285dcc;--hover:#edf2ff;--chip:#e8efff;--chipText:#2454a7;--err:#b3261e;--errBg:#fbeae9;--okBg:#e6f5ec;--okBd:#8dbda0;--notice:#fff4d7;--noticeBd:#e5c36f}
[data-theme=dark]{--bg:#12182a;--panel:#1c2538;--text:#d7e0ef;--muted:#8fa0b8;--border:#33415e;--primary:#5b8cff;--hover:#26334d;--chip:#26365a;--chipText:#a9c4ff;--err:#ff8f88;--errBg:#3a2225;--okBg:#1e3428;--okBd:#3f7a55;--notice:#3a321c;--noticeBd:#8a7434}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--border);padding:16px 24px}
h1{font-size:19px;margin:0}
h2{font-size:16px;margin:0 0 10px}
header small,.muted,small{color:var(--muted)}
.shell{display:grid;grid-template-columns:270px 1fr;gap:20px;max-width:1180px;margin:20px auto;padding:0 18px}
aside,.main{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
aside{align-self:start}
button,select,input,textarea{font:inherit;color:var(--text)}
button{padding:7px 12px;border:1px solid var(--border);background:var(--panel);border-radius:7px;cursor:pointer}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{cursor:not-allowed;opacity:.45}
.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.small{padding:4px 9px;font-size:13px}
label{display:block;margin:8px 0}
.vcard{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin:8px 0;cursor:pointer}
.vcard.sel{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 25%,transparent)}
.vcard strong{display:block;margin-bottom:4px}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--chipText);font-size:12.5px}
.st-draft{opacity:.85}.st-merging{color:#3b7ddd}.st-merged{color:#2c8a4b}.st-failed{color:var(--err)}
nav.steps{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border);padding-bottom:10px;margin:12px 0 14px}
nav.steps button{border-radius:999px}
nav.steps .active{background:var(--primary);border-color:var(--primary);color:#fff}
.detail-head h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{margin:6px 0 2px}
.desc-block{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.editable{cursor:pointer;border-radius:6px;padding:2px 5px}
.editable:hover{background:var(--hover)}
.desc-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.form{border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form .field label{margin:0 0 4px;display:flex;justify-content:space-between}
.counter{color:var(--muted);font-size:12.5px}
.counter.over{color:var(--err);font-weight:600}
input[type=text],textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:var(--bg)}
textarea{min-height:96px;resize:vertical}
.err{color:var(--err);background:var(--errBg);border-radius:7px;padding:8px 10px;font-size:13.5px}
.notice{background:var(--notice);border:1px solid var(--noticeBd);border-radius:8px;padding:10px 12px;margin:12px 0}
.ok-note{background:var(--okBg);border:1px solid var(--okBd);border-radius:8px;padding:10px 12px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;top:16px;right:16px;max-width:70vw;padding:10px 14px;border-radius:9px;background:var(--panel);border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(-6px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.fail{border-color:var(--err);color:var(--err)}
footer{margin:18px;color:var(--muted);font-size:13px;text-align:center}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
@media(max-width:820px){.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Agent Team Board / 发布 · 版本计划详情</h1>
    <small>REQ-20260921-014 交互原型 · 数据与保存均为本地模拟，无真实副作用</small>
  </div>
  <button id="themeBtn" aria-label="切换深浅色">深色</button>
</header>
<div class="shell">
  <aside>
    <h2>版本计划</h2>
    <div id="verList" role="listbox" aria-label="版本计划列表"></div>
    <hr>
    <label>场景
      <select id="scene">
        <option value="normal">正常</option>
        <option value="emptyDesc">空描述</option>
        <option value="loading">读取中</option>
        <option value="loadError">读取失败</option>
      </select>
    </label>
    <label><input type="checkbox" id="failSave"> 模拟保存失败</label>
    <p class="muted" style="font-size:13px">「合并中」版本用于检查编辑入口锁定；场景与开关用于检查各类状态反馈。切换版本 / 场景会退出编辑态（不误保存）。</p>
  </aside>
  <div class="main">
    <div id="detail"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<footer>原型聚焦详情第 1 步「版本计划」（概况）页签的显式编辑；第 2–5 步为布局占位。口径：名称必填且 ≤80 字（保存前去空白）、描述 ≤4000 字、合并中锁定。</footer>
<script>
'use strict';
const $=s=>document.querySelector(s);
const STATUS={draft:'计划中',merging:'合并中',merged:'已合并',failed:'失败'};
const STEPS=['版本计划','关联条目与提交','文档编写','合并入 main','正式发布'];
const versions=[
 {id:'BLD-20260918-001',name:'登录页改版与性能优化',desc:'包含登录页视觉改版、会话过期自动提示与首屏加载优化，共 3 个条目。',status:'draft',updatedAt:'2026-09-21 14:32'},
 {id:'BLD-20260916-002',name:'看板导出与筛选',desc:'看板支持按状态筛选与导出 Markdown 周报。',status:'merging',updatedAt:'2026-09-21 13:05'}
];
let selId=versions[0].id,step=0,editing=false,draft={name:'',desc:''},saving=false,errMsg=null,timer=null;
const cur=()=>versions.find(v=>v.id===selId);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,fail){const t=$('#toast');t.textContent=msg;t.className='show'+(fail?' fail':'');clearTimeout(timer);timer=setTimeout(()=>{t.className=''},2800);}
function verno(id){return id.replace(/^BLD-/,'');}
function chip(st){return '<span class="chip st-'+st+'">'+STATUS[st]+'</span>';}
function renderList(){
  $('#verList').innerHTML=versions.map(v=>'<div class="vcard'+(v.id===selId?' sel':'')+'" data-ver="'+v.id+'" role="option" aria-selected="'+(v.id===selId)+'" tabindex="0"><strong>'+esc(v.name||v.id)+'</strong><span class="muted" style="font-size:12.5px">'+v.id+' · '+verno(v.id)+'</span> '+chip(v.status)+'</div>').join('');
  $('#verList').querySelectorAll('.vcard').forEach(el=>{
    const pick=()=>{if(selId!==el.dataset.ver){selId=el.dataset.ver;step=0;resetEdit();render();}};
    el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};
  });
}
function resetEdit(){editing=false;saving=false;errMsg=null;}
function descOf(v){return $('#scene').value==='emptyDesc'?'' : v.desc;}
function renderDetail(){
  const scene=$('#scene').value,v=cur(),box=$('#detail');
  if(scene==='loading'){
    box.innerHTML='<div class="detail-head"><h3>正在读取版本详情…</h3></div><p class="muted">数据读取中，编辑入口暂不可用；读取完成后可继续操作（模拟）。</p>';
    return;
  }
  if(scene==='loadError'){
    box.innerHTML='<div class="detail-head"><h3>读取失败</h3></div><div class="err" role="alert">读取失败：模拟仓库不可访问。进度与列表保留，可重试。</div><p><button id="retryLoad" class="primary">重试</button></p>';
    $('#retryLoad').onclick=()=>{$('#scene').value='normal';render();toast('已恢复读取（模拟）');};
    return;
  }
  const locked=v.status==='merging';
  let body='';
  if(step===0){
    if(editing){
      const nc=draft.name.length,dc=draft.desc.length;
      body='<div class="form" role="form" aria-label="编辑版本计划信息">'
        +'<div class="field"><label for="fName">名称（标题）<span class="counter'+(nc>80?' over':'')+'" id="nameCnt">'+nc+' / 80</span></label>'
        +'<input type="text" id="fName" value="'+esc(draft.name)+'" aria-required="true"></div>'
        +'<div class="field"><label for="fDesc">描述<span class="counter'+(dc>4000?' over':'')+'" id="descCnt">'+dc+' / 4000</span></label>'
        +'<textarea id="fDesc" aria-label="版本计划描述">'+esc(draft.desc)+'</textarea></div>'
        +(errMsg?'<div class="err" role="alert">'+esc(errMsg)+'</div>':'')
        +'<div class="row"><button id="saveBtn" class="primary small"'+(saving?' disabled':'')+'>'+(saving?'保存中…':'保存')+'</button>'
        +'<button id="cancelBtn" class="small"'+(saving?' disabled':'')+'>取消</button>'
        +(saving?'<span class="muted" style="font-size:13px">保存中，已禁用重复提交</span>':'')+'</div></div>';
    }else{
      const d=descOf(v);
      body='<p class="meta muted" style="margin-top:4px">计划号 '+v.id+' · 版本号 '+verno(v.id)+' · 目标分支 main · 来源分支 dev</p>'
        +'<div class="desc-block"><span class="muted">描述</span>'
        +'<p class="desc-text editable" id="descText" title="点击也可进入编辑（既有行内入口，与显式按钮并存；取舍见 README 待确认）">'+(d?esc(d):'<span class="muted">（无描述，点「编辑」补充）</span>')+'</p></div>'
        +'<div class="row"><button id="editBtn" class="primary small"'+(locked?' disabled title="版本合并中，暂不可修改"':'')+'>编辑</button>'
        +'<span class="muted" style="font-size:13px">修改名称（标题）与描述，保存一次提交</span></div>'
        +(locked?'<p class="notice" role="note">版本合并中，暂不可修改；合并完成后可继续编辑（既有锁定口径）。</p>':'');
    }
  }else{
    body='<p class="muted">第 '+(step+1)+' 步「'+STEPS[step]+'」为布局占位：本原型聚焦第 1 步「版本计划」（概况）页签的显式编辑入口。</p>'
      +'<p><button id="backPlan" class="small">返回第 1 步</button></p>';
  }
  const nameHtml=editing?esc(draft.name)+' '+chip(v.status)
    :'<span class="editable" id="nameText" title="点击也可进入编辑（既有行内入口，与显式按钮并存；取舍见 README 待确认）">'+esc(v.name||v.id)+'</span> '+chip(v.status);
  box.innerHTML='<div class="detail-head"><h3>'+nameHtml+'</h3>'
    +'<p class="muted" style="font-size:13px">'+v.id+' · 版本号 '+verno(v.id)+' · 更新 '+v.updatedAt+'</p></div>'
    +'<nav class="steps" role="tablist" aria-label="发布五步流程">'+STEPS.map((n,i)=>'<button role="tab" aria-selected="'+(step===i)+'" data-step="'+i+'" class="'+(step===i?'active':'')+'">'+(i+1)+' '+n+'</button>').join('')+'</nav>'
    +body;
  bindDetail();
}
function bindDetail(){
  const v=cur();
  document.querySelectorAll('nav.steps [data-step]').forEach(b=>{b.onclick=()=>{if(step!==+b.dataset.step){step=+b.dataset.step;resetEdit();render();}};});
  const enter=()=>{if(cur().status==='merging'){toast('版本合并中，暂不可修改',true);return;}draft={name:v.name,desc:descOf(v)};editing=true;errMsg=null;render();const f=$('#fName');if(f)f.focus();};
  if($('#editBtn'))$('#editBtn').onclick=enter;
  if($('#nameText'))$('#nameText').onclick=enter;
  if($('#descText'))$('#descText').onclick=enter;
  if($('#backPlan'))$('#backPlan').onclick=()=>{step=0;render();};
  if($('#fName')){$('#fName').oninput=e=>{draft.name=e.target.value;const c=$('#nameCnt');c.textContent=draft.name.length+' / 80';c.className='counter'+(draft.name.length>80?' over':'');};}
  if($('#fDesc')){$('#fDesc').oninput=e=>{draft.desc=e.target.value;const c=$('#descCnt');c.textContent=draft.desc.length+' / 4000';c.className='counter'+(draft.desc.length>4000?' over':'');};}
  if($('#cancelBtn'))$('#cancelBtn').onclick=()=>{resetEdit();render();toast('已取消，未保存修改');};
  if($('#saveBtn'))$('#saveBtn').onclick=save;
}
function save(){
  const name=draft.name.trim();
  if(!name){errMsg='版本名称不能为空';render();$('#fName').focus();return;}
  if(name.length>80){errMsg='版本名称不超过 80 字（当前 '+name.length+' 字）';render();$('#fName').focus();return;}
  if(draft.desc.length>4000){errMsg='版本描述不超过 4000 字（当前 '+draft.desc.length+' 字）';render();$('#fDesc').focus();return;}
  errMsg=null;saving=true;render();
  setTimeout(()=>{
    if($('#failSave').checked){errMsg='保存失败：模拟网络错误，请重试（内容已保留，可重试或取消）';saving=false;render();toast('✕ 保存失败：模拟网络错误（内容已保留）',true);return;}
    const v=cur();v.name=name;v.desc=draft.desc;v.updatedAt='2026-09-21 16:'+(20+Math.floor(Math.random()*39)).toString().padStart(2,'0');
    resetEdit();render();toast('✓ 已保存版本信息');
  },650);
}
function render(){renderList();renderDetail();}
$('#scene').onchange=()=>{resetEdit();render();};
$('#themeBtn').onclick=()=>{const h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'浅色':'深色';};
render();
</script>
</body>
</html>
