<div id="open-discussion">
<style>
#open-discussion{--p:light-dark(#fff,#161d29);--bg:light-dark(#f4f6f9,#0e131b);--t:light-dark(#1b2434,#e5eaf3);--m:light-dark(#66748c,#8b98ad);--b:light-dark(#e2e7ef,#263041);--a:light-dark(#2563eb,#3b82f6);--v:light-dark(#4f46e5,#818cf8);--soft:light-dark(#eef0fc,#242742);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:var(--t);background:var(--bg);border:1px solid var(--b)}#open-discussion *{box-sizing:border-box}#open-discussion button,#open-discussion input,#open-discussion textarea,#open-discussion select{font:inherit;color:inherit}#open-discussion button{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}#open-discussion button:hover{border-color:var(--m)}#open-discussion button:disabled{opacity:.5;cursor:default}#open-discussion .primary{background:var(--a);border-color:var(--a);color:#fff}#open-discussion .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#open-discussion .grow{flex:1}#open-discussion .muted{font-size:12px;color:var(--m)}#open-discussion header{padding:10px 18px;background:var(--p);border-bottom:1px solid var(--b)}#open-discussion .logo{width:34px;height:34px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:17px}#open-discussion .nav{display:flex;padding:8px 18px;gap:4px;background:var(--p);border-bottom:1px solid var(--b)}#open-discussion .nav span{padding:6px 14px;color:var(--m)}#open-discussion .nav .on{background:var(--soft);color:var(--v);border-radius:8px}#open-discussion .filters{padding:12px 18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}#open-discussion .filters button[aria-pressed=true]{background:var(--soft);border-color:var(--v);color:var(--v)}#open-discussion .split{display:grid;grid-template-columns:285px minmax(0,1fr);border-top:1px solid var(--b)}#open-discussion .list{padding:14px 12px}#open-discussion .record{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border-radius:10px}#open-discussion .record[aria-pressed=true]{border-color:var(--v);background:var(--soft)}#open-discussion .record span{display:block;margin-top:6px}#open-discussion .detail{background:var(--p);border-left:1px solid var(--b);min-width:0}#open-discussion .head{padding:16px 18px 12px;border-bottom:1px solid var(--b)}#open-discussion h2{font-size:16px;font-weight:500;margin:6px 0 12px}#open-discussion h3{font-size:14px;font-weight:500;margin:12px 0 8px}#open-discussion .chip{font-size:11px;border:1px solid currentColor;border-radius:99px;padding:1px 8px;color:var(--v)}#open-discussion .body{padding:14px 18px 22px}#open-discussion .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}#open-discussion .meta label{display:block;color:var(--m);font-size:11px}#open-discussion .meta span{font-size:12px}#open-discussion .tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}#open-discussion .tabs button{border-radius:99px;padding:4px 12px;font-size:12px}#open-discussion .tabs button[aria-pressed=true]{background:var(--a);color:#fff;border-color:var(--a)}#open-discussion .paper{border:1px solid var(--b);border-radius:10px;padding:12px 16px}#open-discussion p{margin:6px 0 12px}#open-discussion ul{padding-left:20px}#open-discussion li{margin:7px 0}#open-discussion .draft{border:1px solid var(--b);border-radius:10px;padding:12px;margin:10px 0}#open-discussion input[type=text],#open-discussion textarea,#open-discussion select{width:100%;padding:7px 9px;border:1px solid var(--b);border-radius:6px;background:var(--bg);margin:5px 0 10px}#open-discussion textarea{min-height:90px;resize:vertical}#open-discussion input[type=checkbox]{accent-color:var(--a);width:16px;height:16px}#open-discussion .notice{padding:10px 12px;background:var(--soft);color:var(--v);border-radius:8px;margin:10px 0;font-size:12px}#open-discussion .back{display:none}#open-discussion footer{border-top:1px solid var(--b);padding:8px 18px;font-size:12px;color:var(--m)}#open-discussion [hidden]{display:none!important}@media(max-width:700px){#open-discussion .split{grid-template-columns:1fr}#open-discussion .detail{display:none;border-left:0}#open-discussion.focused .detail{display:block}#open-discussion.focused .list{display:none}#open-discussion .back{display:inline-block}#open-discussion .nav{padding:8px}#open-discussion .nav span{padding:6px 9px}#open-discussion .meta{grid-template-columns:1fr 1fr}#open-discussion input[type=text],#open-discussion textarea{font-size:16px}}@media(pointer:coarse){#open-discussion button{min-height:44px}}
</style>
<header class="row"><span class="logo">▦</span><div><div>智能体团队看板</div><div class="muted">agent-team-board</div></div><span class="grow"></span><button class="primary" data-new>＋ 新建讨论</button></header><div class="nav"><span class="on">讨论</span><span>需求</span><span>任务</span><span>文件</span><span style="margin-left:auto">设置</span></div><div class="filters"><button data-filter="active" aria-pressed="true">讨论中 <span data-activecount>2</span></button><button data-filter="archived" aria-pressed="false">已归档 <span data-archivecount>1</span></button><span class="grow muted">开放式讨论 · Agent 会话交流 · 看板沉淀成果</span></div><div class="split"><section class="list" aria-label="讨论记录"><div class="muted">最近更新</div><div data-records></div></section><section class="detail" aria-label="讨论详情"><div class="head"><div class="row"><button class="back" data-back>← 返回列表</button><span class="muted grow" data-id></span><span class="chip" data-status></span></div><h2 data-title></h2><div class="row"><button data-prompt="start">启动提示词</button><button data-finish>讨论完毕</button><span class="grow"></span><button data-archive>归档讨论</button></div></div><div class="body"><div class="meta"><div><label>讨论方式</label><span>Agent 外部会话</span></div><div><label>讨论范围</label><span>开放式 · 无需关联需求</span></div><div><label>成果</label><span data-outcome></span></div></div><div class="notice" data-notice></div><div data-promptbox hidden><label for="discussion-prompt" class="muted" data-promptlabel></label><textarea id="discussion-prompt" readonly></textarea><div class="row"><button class="primary" data-copy>复制提示词</button><button data-hideprompt>收起</button></div></div><div class="tabs"><button data-tab="minutes" aria-pressed="true">背景与纪要</button><button data-tab="drafts" aria-pressed="false">生成需求 / Bug</button></div><div data-pane></div></div></section></div><footer data-feedback aria-live="polite">交互 Demo · 不连接 Agent，不创建真实条目 · 窄屏点击记录进入详情</footer>
<script>
(()=>{const root=document.getElementById('open-discussion');const q=s=>root.querySelector(s);const records=[{id:'ASK-DEMO-001',title:'怎样提升看板的日常使用效率？',state:'active',ready:true,waiting:false,background:'集中讨论日常操作中不顺手的地方，梳理值得开发的能力和需要修复的问题。',drafts:[{type:'需求',title:'支持跨模块快速定位条目',desc:'提供统一入口，通过编号或标题定位需求、Bug 和讨论记录。',criteria:'输入编号或标题可查看匹配记录；点击结果进入对应详情；无匹配时显示空态。',created:false},{type:'Bug',title:'窄屏返回列表后丢失筛选条件',desc:'复现：筛选讨论中，打开详情，再返回列表。实际：筛选被重置。预期：保留筛选和阅读位置。',criteria:'返回后保持原筛选；列表停留在打开详情前的位置。',created:false}]},{id:'ASK-DEMO-002',title:'如何减少重复的手工操作？',state:'active',ready:false,waiting:false,background:'从日常使用习惯出发，讨论哪些操作适合简化。',drafts:[]},{id:'ASK-DEMO-003',title:'明确讨论与开发的边界',state:'archived',ready:true,waiting:false,background:'讨论哪些结论需要转成开发条目。',drafts:[]}];let filter='active',item=records[0],tab='minutes';const feedback=t=>q('[data-feedback]').textContent=t;function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function render(){q('[data-activecount]').textContent=records.filter(r=>r.state==='active').length;q('[data-archivecount]').textContent=records.filter(r=>r.state==='archived').length;q('[data-records]').replaceChildren();records.filter(r=>r.state===filter).forEach(r=>{const b=el('button',r.title,'record');b.setAttribute('aria-pressed',String(r===item));b.append(el('span',r.id,'muted'),el('span',r.state==='archived'?'已归档':r.waiting?'讨论中 · 等待纪要':r.ready?'讨论中 · 纪要已生成':'讨论中 · 外部会话','muted'));b.onclick=()=>{item=r;tab='minutes';q('[data-promptbox]').hidden=true;root.classList.add('focused');render();};q('[data-records]').append(b);});q('[data-id]').textContent=item.id;q('[data-title]').textContent=item.title;q('[data-status]').textContent=item.state==='active'?'讨论中':'已归档';q('[data-outcome]').textContent=item.drafts.filter(d=>d.created).length+' 条已生成 · '+item.drafts.filter(d=>!d.created).length+' 项草稿';q('[data-notice]').textContent=item.waiting?'讨论仍在进行：等待 Agent 输出纪要。':item.ready?'纪要已读取，可编辑候选条目并创建需求或 Bug。':'在 Agent 会话中自由讨论，结束后回这里生成收尾提示词。';q('[data-finish]').hidden=item.state==='archived';q('[data-archive]').textContent=item.state==='archived'?'继续讨论':'归档讨论';root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));const pane=q('[data-pane]');pane.replaceChildren();if(tab==='minutes'){const paper=el('div','','paper');paper.append(el('h3','讨论背景'),el('p',item.background));if(item.ready){paper.append(el('h3','讨论纪要'),el('p','共识：讨论在 Agent 会话中进行，看板负责归档成果；需要开发的结论转为需求，已存在的异常转为 Bug。'),el('h3','后续行动'),el('p',item.drafts.length?'核对候选条目的范围、描述与验收标准，再创建条目。':'本次仅记录结论，无需创建开发条目。'),el('h3','未决问题'),el('p','各条目的实施优先级，留待排期时确定。'));}else{paper.append(el('p','尚无纪要。对话内容保留在 Agent 会话中。','muted'));}pane.append(paper);if(item.waiting){const b=el('button','模拟纪要已落盘');b.onclick=()=>{item.ready=true;item.waiting=false;render();feedback('已模拟读取纪要。讨论状态仍为讨论中。');};pane.append(b);}}else{if(!item.drafts.length)pane.append(el('p','当前没有候选条目。纪要可以只有结论，不必生成需求或 Bug。','muted'));item.drafts.forEach((d,i)=>{const card=el('div','','draft');if(d.created){card.append(el('h3',d.type+' · '+d.title),el('p',d.number+' · 待接受 · 来源 '+item.id,'muted'));}else{const label=el('label','','row');const check=document.createElement('input');check.type='checkbox';check.checked=d.selected!==false;check.onchange=()=>{d.selected=check.checked;};label.append(check,el('span','创建'+d.type));card.append(label);[['标题','title'],['描述 / 复现信息','desc'],['验收标准','criteria']].forEach(([name,key])=>{const id='draft-'+i+'-'+key;const lab=el('label',name,'muted');lab.htmlFor=id;const input=document.createElement(key==='title'?'input':'textarea');if(key==='title')input.type='text';input.id=id;input.value=d[key];input.oninput=()=>d[key]=input.value;card.append(lab,input);});}pane.append(card);});if(item.drafts.some(d=>!d.created)){const create=el('button','创建勾选的条目','primary');create.onclick=()=>{const selected=item.drafts.filter(d=>!d.created&&d.selected!==false);if(!selected.length){feedback('请先勾选候选条目。');return;}if(selected.some(d=>!d.title.trim()||!d.desc.trim())){feedback('请填写标题与描述。');return;}selected.forEach(d=>{d.created=true;d.number=(d.type==='需求'?'REQ':'BUG')+'-DEMO-'+String(item.drafts.indexOf(d)+1).padStart(3,'0');});render();feedback('已在 Demo 中创建 '+selected.length+' 条待接受条目，保留讨论来源，不会重复创建。');};pane.append(create);}}}
function prompt(kind){q('[data-promptbox]').hidden=false;q('[data-promptlabel]').textContent=kind==='start'?'复制到 Agent 新会话':'复制到原 Agent 会话';q('textarea').value=['【演示提示词，不执行真实落盘】','讨论编号：'+item.id,'主题：'+item.title,kind==='start'?'请与我进行开放式讨论。无需绑定某一需求。讨论期间不修改代码或条目。':'请总结当前会话，输出共识、建议、未决问题与行动项，并将候选需求或 Bug 分别整理为标题、描述及验收标准草稿。只输出纪要与草稿，不直接创建或接受条目。'].join(String.fromCharCode(10));}q('[data-prompt]').onclick=()=>prompt('start');q('[data-finish]').onclick=()=>{item.waiting=true;tab='minutes';render();prompt('finish');};q('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(q('textarea').value);feedback('提示词已复制，请粘贴到 Agent 会话。');}catch{q('textarea').select();feedback('请按 ⌘C / Ctrl+C 复制选中的提示词。');}};q('[data-hideprompt]').onclick=()=>q('[data-promptbox]').hidden=true;root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;root.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const found=records.find(r=>r.state===filter);if(found)item=found;tab='minutes';root.classList.remove('focused');render();});q('[data-back]').onclick=()=>root.classList.remove('focused');q('[data-archive]').onclick=()=>{item.state=item.state==='active'?'archived':'active';filter=item.state;root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));render();feedback(item.state==='archived'?'讨论已归档，候选条目仍可查看与创建。':'讨论已恢复，继续在原 Agent 会话交流。');};q('[data-new]').onclick=()=>{const title=el('input');title.type='text';title.placeholder='例如：怎样简化日常工作流程？';const bg=el('textarea');bg.placeholder='填写讨论背景，不需要关联需求';const pane=q('[data-pane]');pane.replaceChildren(el('h3','新建开放式讨论'));const l=el('label','讨论标题');l.htmlFor='new-discussion-title';title.id=l.htmlFor;const bl=el('label','讨论背景');bl.htmlFor='new-discussion-background';bg.id=bl.htmlFor;const save=el('button','创建并生成启动提示词','primary');save.onclick=()=>{if(!title.value.trim()){feedback('请填写讨论标题。');return;}item={id:'ASK-DEMO-00'+(records.length+1),title:title.value.trim(),background:bg.value.trim(),state:'active',ready:false,waiting:false,drafts:[]};records.unshift(item);filter='active';tab='minutes';root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));render();prompt('start');};pane.append(l,title,bl,bg,save);root.classList.add('focused');};render();})();
</script>
</div>
