<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讨论类型文案演示</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#203047;font:16px system-ui}main{display:grid;grid-template-columns:1fr minmax(320px,480px);min-height:100vh}aside,section{padding:28px}section{background:white;border-left:1px solid #ccd5e0}label{display:block;margin:22px 0 8px}select,input,textarea,button{font:inherit;padding:12px;border:1px solid #aab8ca;border-radius:8px}select,input,textarea{width:100%}button{cursor:pointer;background:#edf2fa}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3978dd}footer{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}.primary{background:#2866ce;color:white}#notice{padding:15px;border-radius:8px;background:#e9f0fc;margin-top:20px}small{color:#63728a}#shot{margin-top:16px;border:1px dashed #aaa;padding:18px}button:disabled{opacity:.5;cursor:wait}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<main><aside><h1>讨论类型名称</h1><p>BUG-20260910-013 · 离线交互演示</p><label for="mode">对照模式</label><select id="mode"><option value="fixed">期望：讨论（ASK）</option><option value="broken">缺陷：讨论</option></select><label for="state">状态场景</label><select id="state"><option value="normal">正常</option><option value="empty">空标题</option><option value="loading">加载</option><option value="error">失败</option></select><p>展开右侧类型框检查全部选项，切换模式比较选中名称。</p><small>仅模拟展示；不会创建真实条目或发起网络请求。</small></aside>
<section aria-label="新建条目"><h2>新建条目</h2><p>需求 / Bug / 讨论同一表单，按类型切换字段</p><form id="form"><label for="type">类型</label><select id="type"><option value="req">需求（REQ）</option><option value="bug">Bug（BUG）</option><option value="ask" selected>讨论（ASK）</option></select><label for="title">标题</label><input id="title" maxlength="120" placeholder="一句话说清这条需求 / Bug / 讨论" value="讨论下一版布局"><label for="desc" id="descLabel">背景（可选）</label><textarea id="desc" rows="5" placeholder="填写讨论背景，可留空"></textarea><div id="shot" hidden>截图（可选） · 演示占位</div><div id="notice" role="status" aria-live="polite">可以填写并模拟创建。</div><footer><button type="button" id="cancel">取消</button><button class="primary" id="submit">创建</button></footer></form></section></main>
<script>
const $=id=>document.getElementById(id);let timer;
function render(){ $('type').querySelector('[value="ask"]').textContent=$('mode').value==='fixed'?'讨论（ASK）':'讨论';const ask=$('type').value==='ask';$('descLabel').textContent=ask?'背景（可选）':'描述';$('shot').hidden=ask;const loading=$('state').value==='loading';$('submit').disabled=loading;$('submit').textContent=loading?'创建中…':'创建';$('notice').textContent={normal:'可以填写并模拟创建。',empty:'标题不能为空，请填写后重试。',loading:'正在模拟创建，请稍候…',error:'模拟创建失败：服务暂不可用。输入已保留，可重试。'}[$('state').value];}
$('mode').onchange=render;$('type').onchange=render;$('state').onchange=()=>{clearTimeout(timer);if($('state').value==='empty')$('title').value='';render()};$('cancel').onclick=()=>{clearTimeout(timer);$('title').value='';$('desc').value='';$('state').value='normal';render();$('notice').textContent='已取消模拟并清空表单。'};$('form').onsubmit=e=>{e.preventDefault();if(!$('title').value.trim()){$('state').value='empty';render();$('title').focus();return}$('state').value='loading';render();timer=setTimeout(()=>{$('state').value='normal';render();$('notice').textContent='模拟创建成功。真实讨论创建后将进入讨论展示流程。'},900)};render();
</script></html>
