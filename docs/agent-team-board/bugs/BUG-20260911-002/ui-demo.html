<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUG-20260911-002 · 发布副标题演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#202b40;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:20px}.controls,header,.panel{background:white;border:1px solid #dce2ec;border-radius:12px;padding:20px}.controls{margin-bottom:24px;display:flex;gap:14px;flex-wrap:wrap}button,select{font:inherit;padding:7px 12px;border:1px solid #b9c5d7;background:white;border-radius:7px;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#e8efff;border-color:#3566d9;color:#254db0}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap}nav{display:flex;gap:8px}.sub{color:#62708a;padding:18px 4px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 2fr;gap:18px}.muted{color:#62708a}.badge{background:#e4f4e9;color:#27693c;padding:3px 8px;border-radius:6px}.error{color:#af3232}h2,h3{margin-top:0}button:focus-visible,select:focus-visible{outline:3px solid #86acff}footer{margin-top:20px;color:#62708a}@media(max-width:620px){.grid{grid-template-columns:1fr}main{margin:0;padding:12px}}
</style>
<main><h2>发布副标题 · 修复对照</h2><p class="muted">交互示意，数据虚构；不会触发构建或发布。</p><section class="controls" aria-label="演示控制"><label>文案 <select id="mode"><option value="fixed">修复后</option><option value="bug">缺陷现象</option></select></label><label>内容状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label></section><header><strong>智能体团队看板</strong><nav aria-label="模块导航"><button id="release" aria-pressed="true">发布</button><button id="runs" aria-pressed="false">任务</button></nav><span class="muted">演示项目</span></header><div id="subtitle" class="sub"></div><section id="content" aria-live="polite"></section><footer>副标题描述整体流程；具体能力由目标选项与详情表达。演示控制仅用于评审。</footer></main>
<script>
const mode=document.querySelector('#mode'),state=document.querySelector('#state'),content=document.querySelector('#content');let view='release',timer;
function render(){document.querySelector('#release').setAttribute('aria-pressed',view==='release');document.querySelector('#runs').setAttribute('aria-pressed',view==='runs');document.querySelector('#subtitle').textContent=view==='runs'?'进度、队列与结果集中在这里':mode.value==='bug'?'Git 远端与 App Store 发布流水线：预检 → 计划确认 → 执行 → 核验':'构建与发布流程：预检 → 计划确认 → 执行 → 核验';if(view==='runs'){content.innerHTML='<div class="panel">任务内容区域（示意）</div>';return;}const states={normal:'<div class="grid"><div class="panel"><h3>发布运行</h3><strong>桌面应用（Electron）</strong><p class="muted">macOS · 示例版本 1.0</p><span class="badge">成功</span></div><div class="panel"><h3>运行详情</h3><p>预检 → 计划确认 → 执行 → 核验</p><p class="muted">示例产物已核验。此处用于验证副标题可以概括桌面应用构建。</p></div></div>',empty:'<div class="panel"><h3>还没有发布运行</h3><p class="muted">创建运行后可在这里跟进进度与结果。</p></div>',loading:'<div class="panel" role="status">加载中…</div>',error:'<div class="panel"><h3 class="error">发布模块读取失败</h3><p>模拟连接失败，请重试。</p><button id="retry">重试</button></div>'};content.innerHTML=states[state.value];document.querySelector('#retry')?.addEventListener('click',()=>{state.value='loading';render();timer=setTimeout(()=>{state.value='normal';render()},800)});}
mode.onchange=render;state.onchange=()=>{clearTimeout(timer);render()};for(const name of ['release','runs'])document.querySelector('#'+name).onclick=()=>{view=name;render()};render();
</script></html>
