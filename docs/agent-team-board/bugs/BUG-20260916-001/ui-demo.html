<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>构建内发布与官网设置 · Bug 演示</title><style>
body{margin:0;background:#f3f5fa;color:#23314b;font:15px system-ui}header,main{max-width:1100px;margin:auto;padding:22px}button,select,input{font:inherit;padding:9px;border:1px solid #bdc8d9;border-radius:7px;background:white;color:inherit}button{cursor:pointer}.primary{background:#245bd8;color:white;border-color:#245bd8;font-weight:700}button:disabled{opacity:.5;cursor:default}nav,footer{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:250px 1fr;gap:18px}article,aside{background:white;padding:22px;border-radius:12px;border:1px solid #dce2eb}h1{font-size:23px}h2{font-size:20px}.note{padding:14px;background:#eef3ff;border-radius:8px}.bad{background:#fff0ed}.ok{background:#e6f7eb}label{display:block;margin:15px 0}input{display:block;width:90%;margin:9px 0}small{color:#62728b}dialog{border:1px solid #bdc8d9;border-radius:12px;max-width:480px}.directories{display:grid;grid-template-columns:1fr 1fr;gap:12px}.directory{padding:12px;border:1px solid #dce2eb;border-radius:8px}.directory code{display:block;overflow-wrap:anywhere;user-select:text;margin:10px 0}.directories small{display:block}dialog::backdrop{background:#0006}@media(max-width:650px){.grid,.directories{grid-template-columns:1fr}}
</style><header><h1>构建内发布与官网设置</h1><small>离线交互示意 · 虚构数据 · 不执行真实保存或发布</small><nav><label>场景 <select id="mode"><option value="fixed">期望修复</option><option value="bug">缺陷示意</option></select></label><label>数据状态 <select id="state"><option value="normal">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">失败</option></select></label></nav><nav><button onclick="page='build';draw()">构建</button><button onclick="page='settings';draw()">设置</button><button onclick="reset()">重置演示</button></nav></header><main id="app"></main><dialog id="plan"><h2>确认模拟发布计划</h2><p>版本 v1.2.0 · 来源：示例版本 A</p><p>核对冻结源码与 main/dev 推送目标，发布 Web App 和官网文档。此处仅演示确认交互，无网络操作。</p><button onclick="plan.close()">取消</button><button class="primary" onclick="startRelease()">确认发布</button></dialog><script>
let page='build',tab='release',saved='',draft='',message='',result='',checked=false,running=false,published=false,releaseTimer,dirState='empty',releaseRoot='',finderFailure=false,finderFeedback={},finderPending={};const app=document.getElementById('app'),mode=document.getElementById('mode'),state=document.getElementById('state'),plan=document.getElementById('plan');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));mode.onchange=state.onchange=()=>{message='';draw()};function reset(){finderFailure=false;finderFeedback={};finderPending={};clearTimeout(releaseTimer);running=published=false;plan.close();saved=draft=message=result=releaseRoot='';dirState='empty';checked=false;state.value='normal';mode.value='fixed';page='build';draw()}
function draw(){const bug=mode.value==='bug',s=state.value;if(s==='loading'){app.innerHTML='<article aria-live="polite">正在加载… <p>可通过顶部数据状态切换恢复。</p></article>';return}if(s==='error'){app.innerHTML='<article class="bad" role="alert">读取失败：模拟服务不可用。<p><button onclick="state.value=\'normal\';draw()">重试</button></p></article>';return}if(page==='settings'){app.innerHTML=bug?'<article><h2>设置</h2><p class="bad note">缺陷示意：本页面找不到官网仓库配置入口，配置仍藏在旧发布模块。</p></article>':`<article><h2>官网仓库</h2><p>作用范围：当前项目示意；最终跨项目共享策略待确认。</p><label>官网仓库根目录<input id="path" placeholder="/示例路径/homepage-repo" value="${esc(draft||saved)}" oninput="draft=this.value"></label><small>实际产品需校验目录、权限、Git 仓库及 main；此演示只校验非空与绝对路径格式。</small><footer><button id="save" onclick="save()">保存</button><button onclick="page='build';draw()">返回发布 · 示例版本 A</button></footer><p class="note" aria-live="polite">${esc(message|| (saved?'已配置：'+saved:'尚未配置'))}</p></article>`;return}app.innerHTML=`<div class="grid"><aside><h2>版本计划</h2><p>示例版本 A</p><p>已合并 · v1.2.0</p><small>当前项目：agent-team-board</small></aside><article><h2>示例版本 A</h2><nav><button onclick="tab='overview';draw()">概况</button><button onclick="tab='release';draw()">发布</button></nav>${tab==='overview'?'<p>版本说明与关联条目在此展示。发布运行独立于合并状态。</p>':bug?'<p class="note bad">缺陷示意：发布体验沿用旧模块，官网配置不能在设置中完成。</p><button onclick="page=\'settings\';draw()">前往设置查看缺失</button>':`<p class="note">${saved?'官网仓库：'+esc(saved):'官网仓库未配置，请先设置；版本上下文将保留。'}</p><button onclick="page='settings';draw()">${saved?'修改官网设置':'前往设置'}</button><h3>本版本发布</h3><p>${s==='empty'?'暂无发布记录。完成配置后可创建并预检。':'发行版本号 v1.2.0 · 草稿（示例）'}</p><footer><button ${!saved||running||published?'disabled':''} onclick="result='预检通过（模拟），可以预览计划';checked=true;draw()">创建并预检</button><button ${!checked||running||published?'disabled':''} onclick="plan.showModal()">预览发布计划</button><button class="primary" ${!saved||!checked||running||published?'disabled':''} onclick="plan.showModal()">${running?'发布中…':published?'已发布':'发布'}</button><button ${!checked||running||published?'disabled':''} onclick="releaseRoot=saved;dirState='partial';result='失败：官网目录生成失败；Web App 已完成，整体未完成';draw()">模拟部分失败</button></footer><p>${running?'正在发布，请等待；不可重复启动。':published?'本次发布已完成。':!saved?'发布不可用：请先配置官网仓库。':!checked?'发布不可用：请先创建并通过预检。':'预检通过，点击「发布」核对计划并确认执行。'}</p><p class="note" aria-live="polite">${esc(result||'等待配置或预检')}</p>${result.startsWith('失败')?'<button onclick="startRelease()">重试失败目标</button>':''}${directoryPanel()}`}</article></div>`}
function finderButton(kind,path){const pending=!!finderPending[kind];return `<button ${!path||pending?'disabled':''} onclick="openFinder('${kind}')">${pending?'正在打开…':'在 Finder 中打开'}</button><small>${path?'模拟可用目录；打开操作仅为演示':'不可打开：目录尚未生成或路径不可用'}</small><p role="status">${esc(finderFeedback[kind]||'')}</p>`}
function openFinder(kind){const path=directoryPaths()[kind];if(!path||finderPending[kind])return;finderPending[kind]=true;finderFeedback[kind]='正在模拟请求 Finder：'+path;draw();setTimeout(()=>{finderPending[kind]=false;finderFeedback[kind]=finderFailure?'模拟打开失败：目录不可访问或系统调用失败；请检查后重试。':'模拟：已请求 Finder 打开 '+path+'（未调用本机 Finder）';draw()},500)}
function directoryPaths(){return {artifact:dirState==='ready'||dirState==='partial'?'/示例路径/builds/agent-team-board/v1.2.0/dist':'',website:dirState==='ready'?(releaseRoot||saved).replace(/\/$/,'')+'/agent-team-board':''}}
function directoryPanel(){const available=dirState==='ready'||dirState==='partial', root=releaseRoot||saved, artifact='/示例路径/builds/agent-team-board/v1.2.0/dist', website=root.replace(/\/$/,'')+'/agent-team-board';const missing=dirState==='loading'?'生成中':dirState==='error'?'读取失败':dirState==='missing'?'未记录（待确认）':'尚未生成';return `<section aria-live="polite"><h3>发布目录</h3><small>以下路径均为演示值，仅表示当前示例运行；可选中复制。Finder 操作仅模拟，不调用本机 Finder、不验证真实目录可用性。</small><label><input type="checkbox" style="display:inline;width:auto" ${finderFailure?'checked':''} onchange="finderFailure=this.checked">模拟 Finder 打开失败（取消勾选后可重试）</label><div class="directories"><div class="directory"><strong>构建物目录</strong><code>${esc(available?artifact:missing)}</code>${finderButton('artifact',directoryPaths().artifact)}</div><div class="directory"><strong>官网目录</strong><code>${esc(dirState==='ready'?website:dirState==='partial'?'未生成：模拟官网目录生成失败':missing)}</code><small>官网产品内容目录${available?'；本次官网仓库根目录（演示值）：'+esc(root):''}</small>${finderButton('website',directoryPaths().website)}</div></div>${published?`<footer><button onclick="dirState='error';draw()">模拟目录读取失败</button><button onclick="dirState='missing';draw()">模拟历史未记录</button><button onclick="dirState='ready';draw()">恢复目录展示</button></footer>`:''}${dirState==='error'?'<p role="alert">目录信息读取失败：模拟服务不可用；发布状态保持原记录。</p><button onclick="dirState=\'ready\';draw()">重试读取目录</button>':''}</section>`}
function startRelease(){if(!saved||!checked||running||published)return;plan.close();running=true;dirState='loading';releaseRoot=saved;result='执行中：正在模拟核验两个目标';draw();releaseTimer=setTimeout(()=>{running=false;published=true;dirState='ready';result='已发布：Web App 与官网文档均核验通过（模拟）';draw()},800)}
function save(){draft=document.getElementById('path').value.trim();if(!draft||!draft.startsWith('/')){message='保存失败：请输入非空绝对路径，原配置保留。';draw();return}document.getElementById('save').disabled=true;message='保存中…';document.querySelector('[aria-live]').textContent=message;setTimeout(()=>{clearTimeout(releaseTimer);running=published=false;saved=draft;dirState='empty';releaseRoot='';checked=false;result='配置已变化，旧预检失效，请重新预检';message='保存成功（内存模拟），可返回原版本发布。';draw()},600)}draw();
</script></html>
