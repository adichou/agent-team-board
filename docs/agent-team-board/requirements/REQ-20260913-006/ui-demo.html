<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 完善回填可编辑 · 构建模块交互演示（REQ-20260913-006）</title>
<style>
:root{
  --bg:#eef2f8;--card:#fff;--ink:#213047;--muted:#61718a;--line:#b7c3d6;
  --btn:#eaf0ff;--btnink:#203d77;--primary:#2b5bd7;--primaryink:#fff;
  --ok:#1c7c43;--okbg:#e8f6ee;--warn:#9a6700;--warnbg:#fdf3d7;
  --err:#b3261e;--errbg:#fbeae9;--run:#1f6feb;--runbg:#e7f0fe;--graybg:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a24;--card:#1e2632;--ink:#e7edf6;--muted:#9aa8bd;--line:#3a4759;
    --btn:#28374e;--btnink:#bcd0f5;--primary:#5b8cff;--primaryink:#0d1526;
    --ok:#7fd8a1;--okbg:#1f3329;--warn:#e3b341;--warnbg:#3a3222;
    --err:#ff8f88;--errbg:#3a2422;--run:#7db1ff;--runbg:#1f2c42;--graybg:#262f3d}
}
html.force-light{--bg:#eef2f8;--card:#fff;--ink:#213047;--muted:#61718a;--line:#b7c3d6;
  --btn:#eaf0ff;--btnink:#203d77;--primary:#2b5bd7;--primaryink:#fff;
  --ok:#1c7c43;--okbg:#e8f6ee;--warn:#9a6700;--warnbg:#fdf3d7;
  --err:#b3261e;--errbg:#fbeae9;--run:#1f6feb;--runbg:#e7f0fe;--graybg:#eef1f5}
html.force-dark{--bg:#141a24;--card:#1e2632;--ink:#e7edf6;--muted:#9aa8bd;--line:#3a4759;
  --btn:#28374e;--btnink:#bcd0f5;--primary:#5b8cff;--primaryink:#0d1526;
  --ok:#7fd8a1;--okbg:#1f3329;--warn:#e3b341;--warnbg:#3a3222;
  --err:#ff8f88;--errbg:#3a2422;--run:#7db1ff;--runbg:#1f2c42;--graybg:#262f3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--btn);color:var(--btnink);padding:5px 11px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--primary);color:var(--primaryink);border-color:transparent}
button.quiet{background:transparent;color:var(--muted)}
button.small{padding:2px 9px;font-size:12.5px;border-radius:6px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
.muted{color:var(--muted)}.small{font-size:12.5px}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand .logo{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;background:var(--primary);color:var(--primaryink);border-radius:7px}
.module-nav{display:flex;gap:4px;flex-wrap:wrap}
.module-nav button{border-color:transparent;background:transparent;color:var(--muted);border-radius:8px;padding:5px 12px}
.module-nav button.active{background:var(--btn);color:var(--btnink);font-weight:600}
/* 模块头 */
.page-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px 0;max-width:1180px;margin:0 auto;width:100%}
.page-head h2{font-size:17px;margin:0}
.page-head .sub{color:var(--muted);font-size:13px}
/* 演示控制条 */
.demo-bar{max-width:1180px;margin:10px auto 0;padding:8px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--warnbg);border:1px dashed var(--warn);border-radius:9px;font-size:12.5px}
.demo-bar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.demo-bar button{padding:2px 9px;font-size:12.5px;border-radius:6px}
.demo-bar button.on{background:var(--primary);color:var(--primaryink)}
.demo-bar .sep{width:1px;height:16px;background:var(--warn)}
.demo-bar label{display:flex;gap:5px;align-items:center;cursor:pointer}
/* 主区：左列表 + 右详情 */
.main{display:flex;gap:12px;max-width:1180px;margin:12px auto;padding:0 16px 24px;width:100%;align-items:flex-start}
.ver-list{flex:1 1 380px;min-width:300px;display:flex;flex-direction:column;gap:8px}
.ver-detail{flex:1.5 1 460px;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:300px}
.list-head{display:flex;align-items:center;gap:8px;padding:0 2px}
.list-head strong{font-size:14px}
.rel-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s}
.rel-card:hover{border-color:var(--primary)}
.rel-card.sel{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.rel-card .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rel-card .t strong{font-size:14px}
.rel-card .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
/* 状态 chip */
.st{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.draft{background:var(--graybg);color:var(--muted)}
.st.merging{background:var(--runbg);color:var(--run)}
.st.merged{background:var(--okbg);color:var(--ok)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--run);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 详情 */
.det-head h3{margin:0 0 2px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.det-block{margin-top:12px}
.det-block .lbl{color:var(--muted);font-size:12.5px;display:block}
.det-desc{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:4px;font-size:13px}
.item-row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.item-row .iid{font-weight:600;white-space:nowrap}
.item-row .itl{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.commit-pill{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--graybg);border-radius:6px;padding:1px 7px}
.note{border-radius:9px;padding:8px 12px;font-size:13px;margin-top:12px}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.run{background:var(--runbg);color:var(--run)}
/* 空态 / 加载 / 失败占位 */
.placeholder{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 18px;text-align:center}
.placeholder h3{margin:0 0 6px;font-size:15px}
.skel-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.skel{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--graybg) 25%,var(--btn) 45%,var(--graybg) 65%);background-size:200% 100%;animation:sk 1.1s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.errbox{background:var(--errbg);color:var(--err);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* AI 完善弹窗 */
.modal-wrap{position:fixed;inset:0;background:rgba(10,16,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:15px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.bld-prompt-box{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:8px}
.bld-prompt-box textarea{width:100%;resize:vertical;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.bld-session-entry{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}
.bld-answer-box{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.bld-answer-box label.field{display:block}
.bld-answer-box textarea{width:100%;resize:vertical}
.form-err{background:var(--errbg);color:var(--err);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-top:8px}
/* 解析结果编辑表单（本需求核心） */
.bld-edit-preview{margin-top:12px;border:1px solid var(--primary);border-radius:9px;padding:10px 12px;background:var(--btn)}
.bld-edit-preview .hint{font-size:12.5px;color:var(--btnink);margin:0 0 8px}
.bld-edit-preview .old{font-size:12px;color:var(--muted);margin-bottom:3px;word-break:break-all}
.bld-edit-preview .fld{margin-top:8px}
.bld-edit-preview .fld .cap{font-size:12.5px;font-weight:600;display:block;margin-bottom:3px}
.bld-edit-preview input[type=text]{width:100%}
.bld-edit-preview textarea{width:100%;rows:4;min-height:74px;resize:vertical}
.bld-edit-preview .fld-err{color:var(--err);font-size:12.5px;margin-top:3px}
/* toast */
.toast-wrap{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:400px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;padding:9px 13px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin .18s ease-out}
.toast.err{border-left-color:var(--err);color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:960px){.main{flex-direction:column}.ver-list,.ver-detail{width:100%}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">ATB</span> Agent Team Board</div>
  <nav class="module-nav">
    <button type="button">需求</button>
    <button type="button" class="active">构建</button>
    <button type="button">任务</button>
    <button type="button">设置</button>
  </nav>
</header>

<div class="page-head">
  <h2>构建</h2>
  <span class="sub">版本计划 · 演示聚焦「AI 完善回填可编辑」（REQ-20260913-006）</span>
</div>

<div class="demo-bar" role="group" aria-label="演示控制条">
  <span class="grp"><strong>场景：</strong>
    <button type="button" data-scene="normal" class="on">正常</button>
    <button type="button" data-scene="loading">加载中</button>
    <button type="button" data-scene="loadError">加载失败</button>
    <button type="button" data-scene="empty">空列表</button>
  </span>
  <span class="sep"></span>
  <label><input type="checkbox" id="simFail"> 模拟应用失败（服务端报错）</label>
  <span class="sep"></span>
  <button type="button" id="themeBtn">深浅色切换</button>
  <button type="button" id="resetBtn">重置演示数据</button>
</div>

<main class="main">
  <section class="ver-list" aria-label="版本列表">
    <div class="list-head">
      <strong>版本计划</strong>
      <button type="button" class="small" disabled title="演示不含新建流程">＋ 新建版本</button>
    </div>
    <div id="verList"></div>
  </section>
  <section class="ver-detail" id="verDetail" aria-label="版本详情"></section>
</main>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
'use strict';
/* 演示数据（页面内存虚构；解析正则 / 锁定与文案口径对齐 scripts/web/build.js 与 scripts/lib/build-store.mjs） */
const INIT_VERSIONS = [
  { id:'BLD-20260913-003', name:'2026-09-13 修复批次', status:'draft',
    description:'收纳完善流程与批量任务的两笔修复，待确认后合并入 main。',
    items:[{itemId:'BUG-20260913-005',title:'完善弹窗宿主探测与会话深链',commit:'e4f5a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d'},
           {itemId:'BUG-20260913-002',title:'完善子代理认领冲突未释放',commit:'c19d02ef34a5b6c7d8e9f0a1b2c3d4e5f6071829'}] },
  { id:'BLD-20260913-002', name:'构建模块体验修复', status:'merging',
    description:'版本卡片操作入口与条目纳入口径的修复。',
    items:[{itemId:'BUG-20260913-004',title:'版本操作迁入版本卡片',commit:'a1b2c3d4e5f60718293a4b5c6d7e8f9012345d67'}] },
  { id:'BLD-20260913-001', name:'构建模块首版', status:'merged',
    description:'构建模块数据层、服务端路由与前端首个可用版本。',
    items:[{itemId:'REQ-20260913-001',title:'添加构建模块，支持版本管理',commit:'0f1e2d3c4b5a69788796a5b4c3d2e1f00918a726'}] },
];
const STATUS_LABEL = { draft:'计划中', merging:'合并中', merged:'已合并' };
const SAMPLE_ANSWER = '版本名称：2026-09-13 质量加固批次\n版本描述：收纳完善流程与批量任务两笔修复：完善子代理认领冲突释放、弹窗宿主探测与会话深链；合并后随版本发布，建议发布说明同步列出两笔单号。';
const short = (h)=>h.slice(0,7);

let state = { scene:'normal', versions:INIT_VERSIONS.map(v=>({...v,items:v.items.map(i=>({...i}))})),
              selId:INIT_VERSIONS[0].id, simFail:false, theme:'auto',
              answer:null }; // { verId, text, parsed:{name,description}, error, busy, edited }

/* ---------- 工具 ---------- */
const $ = (sel)=>document.querySelector(sel);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, isErr){
  const el=document.createElement('div');
  el.className='toast'+(isErr?' err':'');
  el.textContent=msg;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),260);},2800);
}
const chip = (s)=>`<span class="st ${s}">${s==='merging'?'<span class="spin"></span>':''}${STATUS_LABEL[s]||s}</span>`;
const findVer = (id)=>state.versions.find(v=>v.id===id);
/* 与 scripts/web/build.js parseAnswer 同口径：名称必含、描述可空 */
function parseAnswer(text){
  const raw = String(text||'');
  const nameM = raw.match(/(?:^|\n)\s*版本名称\s*[:：]\s*(.*)/);
  if(!nameM) return { ok:false, error:'未解析到「版本名称：」行：请检查回答是否按提示词约定格式（版本名称：… / 版本描述：…），或关闭弹窗改用手动编辑。' };
  const descM = raw.match(/(?:^|\n)\s*版本描述\s*[:：]\s*\n?([\s\S]*)/);
  return { ok:true, name:nameM[1].trim(), description:descM?descM[1].replace(/\s+$/,''):'' };
}
const buildPrompt = (v)=>[
  `请为看板版本 ${v.id} 生成「版本名称」与「版本描述」。`,
  `当前信息：名称「${v.name||'（空）'}」；描述「${v.description||'（空）'}」。`,
  '关联条目：',
  ...(v.items||[]).map((it)=>`- ${it.itemId} ${it.title||''}（commit ${short(it.commit)}）`),
  '请综合以上条目给出更完整的版本名称与描述；只按以下格式回答，不要附加其他内容：',
  '版本名称：<一行>',
  '版本描述：<可多行>',
].join('\n');

/* ---------- 渲染：版本列表 ---------- */
function renderVersionList(){
  const root=$('#verList');
  if(state.scene==='loading'){
    root.innerHTML='<div class="skel-card"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%"></div></div>'
      +'<div class="skel-card"><div class="skel" style="width:55%"></div><div class="skel" style="width:80%"></div></div>';
    return;
  }
  if(state.scene==='loadError'){
    root.innerHTML=`<div class="errbox">✕ 版本列表加载失败：服务暂不可用（演示）
      <button type="button" class="small" id="retryLoad">重试</button></div>`;
    $('#retryLoad').addEventListener('click',()=>{state.scene='normal';syncDemoBar();renderAll();});
    return;
  }
  if(state.scene==='empty' || !state.versions.length){
    root.innerHTML='<div class="placeholder muted">暂无版本计划：点右上「＋ 新建版本」从需求单 / Bug 单创建</div>';
    return;
  }
  root.innerHTML=state.versions.map((v)=>{
    const lock = v.status==='merging';
    return `
    <div class="rel-card${v.id===state.selId?' sel':''}" data-ver-id="${esc(v.id)}" role="button" tabindex="0"
         aria-label="版本 ${esc(v.name)}，${STATUS_LABEL[v.status]}">
      <div class="t"><strong>${esc(v.name)}</strong> ${chip(v.status)}</div>
      <div class="meta">${esc(v.id)} · ${v.items.length} 个关联单 · 更新 2026-09-13</div>
      <div class="card-acts">
        <button type="button" class="small quiet" data-act="answer" data-id="${esc(v.id)}"
          ${lock?` disabled title="合并中，请稍候……"`:` title="复制提示词给 Agent，回答直接粘贴回本弹窗自动解析，可修改后再保存"`}>AI 完善</button>
        <button type="button" class="small primary" data-act="merge" data-id="${esc(v.id)}" ${lock?` disabled title="合并中，请勿重复触发"`:''}>合并入 main</button>
      </div>
    </div>`;
  }).join('');
  root.querySelectorAll('[data-act]').forEach((b)=>{
    b.addEventListener('click',(e)=>{
      e.stopPropagation();
      const {act,id}=b.dataset;
      if(act==='answer') openAnswerModal(id);
      else if(act==='merge') toast('（演示）本演示聚焦「AI 完善回填可编辑」，合并确认流程不在此展开');
    });
  });
  root.querySelectorAll('.rel-card').forEach((card)=>{
    const go=()=>{state.selId=card.dataset.verId;renderAll();};
    card.addEventListener('click',go);
    card.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

/* ---------- 渲染：右侧详情 ---------- */
function renderDetail(){
  const root=$('#verDetail');
  if(state.scene==='loading'){
    root.innerHTML='<div class="skel" style="width:30%"></div><div class="skel" style="width:60%"></div><div class="skel" style="width:45%"></div>';
    return;
  }
  if(state.scene==='loadError'){
    root.innerHTML='<div class="placeholder muted">版本详情不可用（列表加载失败）</div>';
    return;
  }
  const v=findVer(state.selId);
  if(state.scene==='empty' || !v){
    root.innerHTML='<div class="placeholder muted">点击左侧版本查看详情</div>';
    return;
  }
  const lockItems=['merging','merged'].includes(v.status);
  const mergeNote = v.status==='merging'
    ? '<div class="note run">合并中，请稍候……（执行中已禁用重复触发、信息保存与条目编辑）</div>'
    : v.status==='merged'
      ? '<div class="note ok">已合并入 main：提交已在 main 分支。</div>'
      : '';
  root.innerHTML=`
    <div class="det-head">
      <h3>${esc(v.name)} ${chip(v.status)}</h3>
      <p class="muted small">${esc(v.id)} · 目标分支 main · 更新 2026-09-13</p>
    </div>
    <div class="det-block"><span class="lbl">描述</span><div class="det-desc">${v.description?esc(v.description):'<span class="muted">（无描述）</span>'}</div></div>
    <div class="det-block"><strong>关联条目与 commit</strong>
      ${v.items.map((it)=>`
        <div class="item-row">
          <span class="iid">${esc(it.itemId)}</span>
          <span class="itl" title="${esc(it.title||'')}">${esc(it.title||'')}</span>
          <span class="commit-pill">${esc(short(it.commit))}</span>
        </div>`).join('')}
    </div>
    ${mergeNote}`;
}

/* ---------- AI 完善弹窗（两段式；本需求：解析预览可编辑后再保存） ---------- */
function openAnswerModal(verId){
  const v=findVer(verId);
  if(!v) return;
  state.answer={ verId:v.id, text:'', parsed:null, error:null, busy:false, edited:false };
  renderModal();
}
function closeAnswerModal(){ state.answer=null; $('#modalRoot').innerHTML=''; }

function renderModal(){
  const root=$('#modalRoot');
  const a=state.answer;
  if(!a){ root.innerHTML=''; return; }
  const v=findVer(a.verId);
  if(!v){ closeAnswerModal(); return; }
  const lock = v.status==='merging';
  let previewHtml='';
  if(a.error){
    previewHtml=`<div class="form-err" role="alert">${esc(a.error)}</div>`;
  }else if(a.parsed){
    const nameEmpty=!a.parsed.name.trim();
    previewHtml=`
      <div class="bld-edit-preview" aria-label="解析结果编辑区">
        <p class="hint">已按回答解析出以下结果，<strong>可直接修改，点「应用」保存修改后的值</strong>。</p>
        <div class="fld">
          <span class="old">当前名称：${esc(v.name||'（空）')}</span>
          <label class="cap" for="bldEdName">版本名称（标题）</label>
          <input type="text" id="bldEdName" value="${esc(a.parsed.name)}" placeholder="版本名称">
          ${nameEmpty?'<div class="fld-err" role="alert">版本名称不能为空</div>':''}
        </div>
        <div class="fld">
          <span class="old">当前描述：${esc(v.description||'（空）')}</span>
          <label class="cap" for="bldEdDesc">版本描述（文本）</label>
          <textarea id="bldEdDesc" placeholder="版本描述（可为空）">${esc(a.parsed.description)}</textarea>
        </div>
      </div>`;
  }else{
    previewHtml='<p class="muted small" style="margin:10px 0 0">粘贴回答并点「解析并预览」后，此处出现可编辑的解析结果。</p>';
  }
  root.innerHTML=`
    <div class="modal-wrap" id="bldAnswerWrap" role="dialog" aria-label="AI 完善">
      <div class="modal">
        <h3>AI 完善（${esc(v.id)}）</h3>
        <p class="muted small" style="margin:0">上段：复制提示词交给 Agent；下段：把回答粘贴回来，解析为可编辑结果，修改后再应用——全程无需关闭本弹窗。</p>
        <div class="bld-prompt-box">
          <textarea class="bld-prompt-text" rows="7" readonly>${esc(buildPrompt(v))}</textarea>
          <div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button type="button" class="small primary" id="bldCopyPrompt">复制提示词</button>
            <span class="muted small">复制后去 Zcode / Codex 新建会话粘贴执行</span>
          </div>
        </div>
        <div class="bld-answer-box">
          <label class="field">Agent 回答（粘贴后点「解析并预览」）
            <textarea class="bld-answer-input" rows="5" placeholder="版本名称：…&#10;版本描述：…">${esc(a.text)}</textarea></label>
          <div style="margin-top:6px"><button type="button" class="small quiet" id="bldFillSample" title="演示辅助：填入一段符合格式的示例回答，便于体验流程">填入示例回答（演示辅助）</button></div>
          ${previewHtml}
        </div>
        <div class="modal-foot">
          <button type="button" id="bldAnswerClose">关闭</button>
          <button type="button" id="bldParseBtn" ${a.busy?'disabled':''}>解析并预览</button>
          <button type="button" class="primary" id="bldApplyBtn"
            ${a.busy||!a.parsed||!a.parsed.name.trim()?'disabled':''}
            ${a.parsed&&!a.parsed.name.trim()?' title="版本名称不能为空"':''}>应用</button>
        </div>
      </div>
    </div>`;
  bindModal(v);
}

function bindModal(v){
  const a=state.answer;
  if(!a) return;
  const input=$('#bldAnswerWrap .bld-answer-input');
  $('#bldCopyPrompt').addEventListener('click',()=>toast('✓ 提示词已复制，去 Agent 粘贴执行后把回答粘贴到下方（演示模拟）'));
  $('#bldFillSample').addEventListener('click',()=>{ input.value=SAMPLE_ANSWER; a.text=SAMPLE_ANSWER; toast('已填入示例回答（演示辅助）'); input.focus(); });
  $('#bldAnswerClose').addEventListener('click',closeAnswerModal);
  $('#bldParseBtn').addEventListener('click',()=>{
    a.text=input.value;
    const r=parseAnswer(a.text);
    if(!r.ok){ a.parsed=null; a.error=r.error; }
    else{
      const hadEdits=a.parsed&&a.edited;
      a.parsed={name:r.name,description:r.description};
      a.error=null; a.edited=false;
      renderModal();
      if(hadEdits) toast('已按最新回答重新预填：未保存的手工修改已被覆盖');
      return;
    }
    renderModal();
  });
  $('#bldApplyBtn').addEventListener('click',()=>doApply(v));
  /* 编辑联动：名称空即时提示并禁用应用 */
  const bindEdit=(id,key)=>{
    const el=$(id);
    el?.addEventListener('input',()=>{
      a.parsed[key]=el.value;
      a.edited=true;
      const nameEmpty=!a.parsed.name.trim();
      const btn=$('#bldApplyBtn');
      const errEl=$('#bldAnswerWrap .fld-err');
      if(key==='name'){
        if(nameEmpty&&!errEl) $('#bldEdName').insertAdjacentHTML('afterend','<div class="fld-err" role="alert">版本名称不能为空</div>');
        if(!nameEmpty) errEl?.remove();
      }
      if(btn){ btn.disabled=a.busy||nameEmpty; btn.title=nameEmpty?'版本名称不能为空':''; }
    });
  };
  bindEdit('#bldEdName','name');
  bindEdit('#bldEdDesc','description');
  $('#bldAnswerWrap').addEventListener('click',(e)=>{ if(e.target.id==='bldAnswerWrap') closeAnswerModal(); });
  $('#bldEdName')?.focus();
}

function doApply(v){
  const a=state.answer;
  if(!a?.parsed) return;
  const name=a.parsed.name.trim();
  if(!name) return; // 与数据层「版本名称不能为空」双保险
  a.busy=true;
  const btn=$('#bldApplyBtn'), parseBtn=$('#bldParseBtn');
  if(btn){ btn.disabled=true; btn.textContent='应用中……'; }
  if(parseBtn) parseBtn.disabled=true;
  setTimeout(()=>{ // 模拟服务端往返（POST /api/build/version/save）
    a.busy=false;
    if(state.simFail){
      renderModal(); // 弹窗与编辑内容保留，可重试
      toast(`✕ 保存失败：${v.id} 保存失败（演示：服务端返回错误）`,true);
      return;
    }
    if(v.status==='merging'){ // 数据层 assertEditableStatus 兜底（入口已禁，此为防御路径）
      renderModal();
      toast('✕ 保存失败：版本合并中，暂不可修改',true);
      return;
    }
    v.name=name;
    v.description=a.parsed.description;
    state.answer=null;
    $('#modalRoot').innerHTML='';
    toast('✓ 已应用回填：版本名称与描述已更新');
    renderAll();
  },650);
}

/* Esc 关闭弹窗（与 build.js 全局 Esc 口径一致，不保存） */
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'&&state.answer) closeAnswerModal();
});

/* ---------- 演示控制条 ---------- */
function syncDemoBar(){
  document.querySelectorAll('[data-scene]').forEach((b)=>b.classList.toggle('on',b.dataset.scene===state.scene));
  $('#simFail').checked=state.simFail;
}
document.querySelectorAll('[data-scene]').forEach((b)=>{
  b.addEventListener('click',()=>{
    state.scene=b.dataset.scene;
    if(state.scene==='empty') state.selId=null;
    if(state.scene==='normal'&&!state.versions.length) state.versions=INIT_VERSIONS.map(v=>({...v,items:v.items.map(i=>({...i}))}));
    if(state.scene==='normal'&&!findVer(state.selId)) state.selId=state.versions[0]?.id||null;
    if(state.scene!=='normal') closeAnswerModal();
    syncDemoBar(); renderAll();
  });
});
$('#simFail').addEventListener('change',(e)=>{state.simFail=e.target.checked;});
$('#resetBtn').addEventListener('click',()=>{
  state={...state,scene:'normal',versions:INIT_VERSIONS.map(v=>({...v,items:v.items.map(i=>({...i}))})),selId:INIT_VERSIONS[0].id,simFail:false,answer:null};
  $('#modalRoot').innerHTML=''; syncDemoBar(); renderAll(); toast('演示数据已重置');
});
$('#themeBtn').addEventListener('click',()=>{
  const order=['auto','light','dark'];
  state.theme=order[(order.indexOf(state.theme)+1)%3];
  document.documentElement.classList.remove('force-light','force-dark');
  if(state.theme!=='auto') document.documentElement.classList.add('force-'+state.theme);
  toast(state.theme==='auto'?'深浅色：跟随系统':state.theme==='light'?'深浅色：浅色':'深浅色：深色');
});

function renderAll(){ renderVersionList(); renderDetail(); }
syncDemoBar();
renderAll();
</script>
</body>
</html>
