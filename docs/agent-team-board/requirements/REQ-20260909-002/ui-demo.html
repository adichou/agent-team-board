<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>REQ-20260909-002 · 合并列表头演示</title>
<style>
:root{font:14px/1.6 system-ui,sans-serif;color:#23334a;background:#f2f5fa;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1120px;margin:auto}h1{font-size:23px;margin:0}p{color:#66738a}button,select,input{font:inherit}button,select,input[type=search]{border:1px solid #ccd6e5;border-radius:7px;background:white;color:inherit;padding:6px 10px}button{cursor:pointer}button:hover{background:#eaf0fc}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #759ff6;outline-offset:2px}.tools,.tabs,.left,.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools{margin:22px 0}.tabs{margin-bottom:16px}.active,.primary{background:#325bd7;color:white}.active:hover,.primary:hover{background:#284cbf}.warn{color:#9f4433}.board{background:white;padding:20px;border:1px solid #dbe2ee;border-radius:12px}.caption{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #dbe2ee;padding-bottom:14px}.right{border-left:1px solid #ccd6e5;padding-left:14px;margin-left:auto}.count{font-weight:650;white-space:nowrap}.row{display:flex;gap:12px;padding:18px 4px;border-bottom:1px solid #e6ebf3;align-items:center}.row input{width:18px;height:18px;flex:none}.row span{min-width:0;overflow-wrap:anywhere}.row small{display:block;color:#6c7890}.result{padding:12px;background:#ecf8f3;border-radius:8px;margin-top:14px;white-space:pre-line;overflow-wrap:anywhere}.result.error{background:#fff0eb;color:#9b382b}.empty{text-align:center;padding:45px 10px;color:#79869a}.hidden{display:none!important}.narrow{max-width:390px}.narrow .right{margin-left:0;width:100%;border-left:0;border-top:1px solid #dbe2ee;padding:10px 0 0}.note{font-size:12px}dialog{max-width:min(520px,calc(100vw - 32px));border:1px solid #cbd6e8;border-radius:12px;padding:24px}dialog::backdrop{background:#22324b66}.dialog-actions{display:flex;gap:8px;justify-content:flex-end}#confirmList{white-space:pre-line}@media(max-width:640px){body{padding:12px}.board{padding:14px}.right{margin-left:0;width:100%;border-left:0;border-top:1px solid #dbe2ee;padding:10px 0 0}h1{font-size:19px}.tools input[type=search]{width:100%}}
</style>
<main><h1>更紧凑的列表头</h1><p>REQ-20260909-002 · 选择和操作在同一行。所有操作仅作用于离线示例数据。</p>
<div class="tools"><input id="search" type="search" placeholder="搜索条目，输入不存在的文字看空态" aria-label="搜索示例条目"><button id="reload">重新加载</button><button id="reset">恢复示例</button><label><input id="fail" type="checkbox"> 模拟首项失败</label><label><input id="narrow" type="checkbox"> 窄屏预览</label></div>
<div id="tabs" class="tabs" role="group" aria-label="状态筛选"></div>
<section class="board" id="board" aria-label="需求列表"><div class="caption"><div class="left"><span id="total" class="count"></span><select id="sort" aria-label="列表排序"><option value="desc">最新更新</option><option value="asc">最早更新</option><option value="id">单号</option></select><button id="all" title="全选当前档搜索可见的可操作条目">☑ 全选</button><button id="none" title="仅取消当前档勾选">☐ 全不选</button></div><div class="right hidden" id="selection" role="group" aria-label="当前档批量操作"><span id="selected" class="count"></span><button id="action1" class="primary"></button><button id="action2" class="warn"></button></div></div><div id="result" class="result hidden" role="status" aria-live="polite"></div><div id="list"></div></section>
<p class="note">尝试：全选 → 移入计划 → 确认；或开启模拟失败后重试。切档保留其他档选择。列表头节点始终保留，窄屏允许分组换行。</p></main>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmList"></p><div class="dialog-actions"><button id="cancel">取消</button><button id="confirmGo" class="primary">确认</button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const names=['待接受','已接受','已计划','开发中','待测试','已完成'];
const actions=[['接受所选'],['移入计划','驳回待接受'],['进入批量开发','移出计划'],[],[],[]];
let rows=[],lane=1,busy=false,loading=false,pendingAction='',sets=names.map(()=>new Set()),feedback=names.map(()=>({text:'',error:false}));
function seed(){rows=names.flatMap((name,l)=>Array.from({length:l===4?0:l<3?3:1},(_,i)=>({id:`DEMO-${l+1}0${i+1}`,title:['列表界面优化','交互反馈完善','筛选体验调整'][i%3],lane:l,time:i})));sets=names.map(()=>new Set());feedback=names.map(()=>({text:'',error:false}));$('search').value='';render();}
function visible(){const q=$('search').value.trim();return rows.filter(r=>r.lane===lane&&(!q||(r.id+r.title).includes(q))).sort((a,b)=>$('sort').value==='id'?a.id.localeCompare(b.id):$('sort').value==='asc'?a.time-b.time:b.time-a.time);}
function sync(){const count=sets[lane].size;const disabled=busy||loading;$('total').textContent=loading?'加载中…':`${visible().length} 个条目`;$('selection').classList.toggle('hidden',count===0||lane>2);$('selected').textContent=`已选 ${count} 项`;$('all').disabled=disabled||lane>2||!visible().length;$('none').disabled=disabled||!count;['action1','action2'].forEach((id,i)=>{const label=actions[lane][i];$(id).classList.toggle('hidden',!label);$(id).textContent=busy&&label===pendingAction?({'接受所选':'接受中…','移入计划':'移入中…','驳回待接受':'驳回中…','移出计划':'移出中…'}[label]||'进入中…'):label||'';$(id).disabled=disabled||!count;$(id).title=label==='驳回待接受'?'完善中的单待本轮批量完善结束后再驳回':label==='进入批量开发'?'以勾选条目为范围进入批量开发':label||'';});document.querySelectorAll('[data-row]').forEach(box=>{box.checked=sets[lane].has(box.dataset.row);box.disabled=disabled;});$('search').disabled=disabled;$('sort').disabled=disabled;$('reload').disabled=disabled;$('reset').disabled=disabled;document.querySelectorAll('[data-lane]').forEach(b=>{b.disabled=disabled;b.classList.toggle('active',Number(b.dataset.lane)===lane);b.setAttribute('aria-pressed',String(Number(b.dataset.lane)===lane));});const f=feedback[lane];$('result').textContent=f.text;$('result').classList.toggle('hidden',!f.text);$('result').classList.toggle('error',f.error);}
function render(){const list=$('list');list.replaceChildren();if(loading){list.innerHTML='<div class="empty">正在加载条目，请稍候…</div>';sync();return;}const items=visible();if(!items.length)list.innerHTML='<div class="empty">当前筛选范围暂无条目，可切换档位或清除搜索。</div>';items.forEach(r=>{const row=document.createElement('label');row.className='row';if(lane<3){const box=document.createElement('input');box.type='checkbox';box.dataset.row=r.id;box.setAttribute('aria-label',`选择 ${r.id}`);box.onchange=()=>{box.checked?sets[lane].add(r.id):sets[lane].delete(r.id);sync();};row.append(box);}const text=document.createElement('span');text.textContent=r.title;const small=document.createElement('small');small.textContent=`${r.id} · ${names[r.lane]}`;text.append(small);row.append(text);list.append(row);});sync();}
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.dataset.lane=i;b.onclick=()=>{lane=i;render();};$('tabs').append(b);});
$('all').onclick=()=>{sets[lane]=new Set(visible().map(r=>r.id));sync();};$('none').onclick=()=>{sets[lane].clear();sync();};$('sort').onchange=render;$('search').oninput=()=>{const eligible=new Set(visible().map(r=>r.id));for(const id of sets[lane])if(!eligible.has(id))sets[lane].delete(id);render();};$('narrow').onchange=()=>{$('board').classList.toggle('narrow',$('narrow').checked);};$('reset').onclick=seed;$('reload').onclick=()=>{loading=true;render();setTimeout(()=>{loading=false;render();},1000);};
function ask(i){pendingAction=actions[lane][i];if(pendingAction==='进入批量开发'){feedback[lane]={text:`已打开批量开发入口（演示），范围：${[...sets[lane]].join('、')}。未启动真实任务。`,error:false};sync();return;}$('confirmTitle').textContent=`确定${pendingAction}所选 ${sets[lane].size} 条？`;$('confirmList').textContent=[...sets[lane]].join('\n');$('confirm').showModal();}
$('action1').onclick=()=>ask(0);$('action2').onclick=()=>ask(1);$('cancel').onclick=()=>{$('confirm').close();};
$('confirmGo').onclick=async()=>{$('confirm').close();const ids=[...sets[lane]],originalLane=lane,simulate=$('fail').checked;busy=true;let success=0;const failures=[];for(let i=0;i<ids.length;i++){feedback[originalLane]={text:`正在${pendingAction} ${i+1} / ${ids.length}…`,error:false};sync();await new Promise(resolve=>setTimeout(resolve,450));if(simulate&&i===0){failures.push(`${ids[i]}：${pendingAction==='驳回待接受'?'完善中，待本轮批量完善结束后再驳回（模拟）':'网络请求失败，请重试（模拟）'}`);continue;}const row=rows.find(r=>r.id===ids[i]);row.lane=pendingAction==='接受所选'?1:pendingAction==='移入计划'?2:pendingAction==='驳回待接受'?0:1;sets[originalLane].delete(ids[i]);success++;}busy=false;feedback[originalLane]={text:`${pendingAction}完成：成功 ${success} 条，失败 ${failures.length} 条。${failures.length?'\n'+failures.join('\n'):''}`,error:failures.length>0};render();};
seed();
</script>
</html>
