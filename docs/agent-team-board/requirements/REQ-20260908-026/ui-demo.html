<style>

-demo .at-tag{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--at-soft);color:var(--at-accent);font-size:12px}#atb-demo .at-ok{color:var(--at-green)}#atb-demo .at-current{margin:18px 0;padding-left:14px;border-left:3px solid var(--at-accent)}#atb-demo .at-stats{display:flex;gap:22px;flex-wrap:wrap;border-top:1px solid var(--at-line);padding-top:16px;margin-top:18px}#atb-demo .at-stats b{font-weight:500;margin-left:5px;color:var(--at-ink)}#atb-demo .at-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--at-line)}#atb-demo .at-item:last-child{border-bottom:0}#atb-demo .at-item button{font-size:12px}#atb-demo .at-note{padding:12px 14px;background:var(--at-soft);border-radius:7px;margin:14px 0;color:var(--at-accent)}#atb-demo select{padding:7px 10px;border:1px solid var(--at-line);background:var(--at-panel);border-radius:7px}#atb-demo .at-steps{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;color:var(--at-muted)}#atb-demo .at-steps span{padding:6px 10px;border-radius:6px;background:var(--at-bg)}#atb-demo .at-footer{padding:10px 24px;border-top:1px solid var(--at-line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--at-panel)}#atb-demo .at-footer button{font-size:12px;padding:4px 9px}#atb-demo .at-overlay{position:absolute;inset:0;background:light-dark(#18213955,#0009);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}#atb-demo .at-dialog{background:var(--at-panel);border:1px solid var(--at-line);border-radius:12px;padding:24px;max-width:520px;width:100%;box-shadow:0 18px 70px #0003}#atb-demo .at-add{padding:12px;background:light-dark(#edf8f0,#223c30);color:var(--at-green);border-radius:6px;margin:12px 0}#atb-demo .at-dialog .at-actions{justify-content:flex-end;margin-top:20px}#atb-demo .at-content{position:relative}#atb-demo .at-compact .at-item{padding:8px 0}@media(max-width:650px){#atb-demo .at-shell{grid-template-columns:1fr}#atb-demo nav{display:none}#atb-demo main{padding:16px}#atb-demo header{padding:14px 16px}#atb-demo .at-panel{padding:15px}#atb-demo .at-item{grid-template-columns:1fr}#atb-demo .at-overlay{align-items:flex-start}#atb-demo .at-stats{gap:12px}}
</style>

@media(max-width:650px){#atb-demo .at-shell{padding:8px 10px 18px}#atb-demo main{padding:12px}#atb-demo header{padding:10px 14px}#atb-demo .at-page-head{padding:10px 14px}#atb-demo .at-module-nav{padding:8px 10px}#atb-demo .at-module-nav button{padding:6px 10px}#atb-demo .at-search{flex-basis:100%}#atb-demo .at-path{max-width:240px}#atb-demo .at-item{gap:6px}}

<style>
#atb-demo .at-table-wrap{overflow-x:auto;margin-top:10px}#atb-demo table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}#atb-demo th{font-weight:500;color:var(--at-muted);background:var(--at-bg)}#atb-demo td,#atb-demo th{padding:9px 10px;border-bottom:1px solid var(--at-line);vertical-align:middle}#atb-demo td button{font-size:12px;padding:4px 8px}#atb-demo .at-dialog{max-width:710px}#atb-demo td select{max-width:190px;width:100%}#atb-demo .at-phase-failed{color:var(--at-red)}#atb-demo .at-phase-done{color:var(--at-green)}#atb-demo .at-phase-running{color:light-dark(#d97706,#fbbf24)}#atb-demo .at-section-head{margin-top:20px}#atb-demo .at-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--at-muted)}#atb-demo .at-prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--at-bg);border:1px dashed var(--at-line);padding:10px;font-size:12px}#atb-demo .at-settings-note{font-size:12px;color:var(--at-muted)}
</style>
<script>
(()=>{
const root=document.getElementById('atb-demo'),view=root.querySelector('#at-view'),modal=root.querySelector('#at-modal');
const titles=['重构批量流程和任务管理','修复导出文件名乱码','补充文件列表空状态','任务中断后的恢复处理','批量操作进度展示','改善搜索结果定位','修复任务列表刷新闪烁'];
const items=titles.map((title,i)=>({id:(i===1||i===6?'BUG':'REQ')+'-20260908-'+String(20+i).padStart(3,'0'),title}));
const make=()=>({phase:'running',agent:'Codex',records:[{...items[0],result:'running',attempt:1},{...items[1],result:'failed',attempt:1},{...items[2],result:'done',attempt:1}],queue:items.slice(3).concat([{id:'REQ-20260908-027',title:'优化目录切换反馈'},{id:'BUG-20260908-028',title:'修复状态计数未更新'}]),settings:[{agent:'Codex',model:'跟随会话默认值',effort:'high',hidden:false},{agent:'Zcode',model:'跟随会话默认值',effort:'high',hidden:false}],copied:false,external:false});
const state={kind:'refine',refine:make(),develop:make(),density:'舒适'};state.develop.settings.forEach(s=>s.effort='medium');
const cur=()=>state[state.kind],name=()=>state.kind==='refine'?'完善':'开发';let settingKind='refine';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function feedback(t){root.querySelector('#at-feedback').textContent=t;}
function prompt(){return '【UI Demo 演示提示词，不执行真实项目操作】\n任务：批量'+name()+'；执行 Agent：'+cur().agent+'。\n此文本仅用于验证启动时自动复制的交互，请勿据此操作项目。';}
async function copy(){try{await navigator.clipboard.writeText(prompt());cur().copied=true;feedback('调度提示词已复制（演示文本）');}catch{cur().copied=false;feedback('复制未成功，请展开提示词手动复制');}render();}
function filter(){const q=root.querySelector('#at-search').value.toLowerCase();view.querySelectorAll('[data-record]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));}
function render(){const c=cur(),t=name();const terminal=['done','aborted'].includes(c.phase),active=c.records.find(r=>r.result==='running');const options=c.settings.filter(s=>!s.hidden);if(!options.some(s=>s.agent===c.agent)&&c.phase==='idle')c.agent=options[0]?.agent||'';root.classList.toggle('at-compact',state.density==='紧凑');root.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===state.kind)));const status={idle:'未启动',prepared:'待启动',running:'运行中',pausing:'暂停后续领取',paused:'已暂停',done:'已结束',aborted:'已终止'}[c.phase];
view.innerHTML=`<div class="at-row"><span class="at-small">${state.kind==='refine'?'已接受且未完善的需求 / Bug':'已计划且未认领的需求 / Bug'} · 每轮实时读取</span><span class="at-small">${c.phase==='idle'?'':c.agent+' · 子代理模式'}</span></div><section class="at-panel"><div class="at-row"><h3>批量${t} ${c.phase==='idle'?'':'· 本轮任务'}</h3><span class="at-tag">${status}</span></div>${c.phase==='idle'?`<p class="at-small">当前待处理 ${c.queue.length} 项。启动时自动复制调度提示词。</p><div class="at-actions"><label>执行 Agent <select id="at-agent">${options.map(s=>`<option ${s.agent===c.agent?'selected':''}>${s.agent}</option>`).join('')}</select></label><button class="at-primary" data-act="start" ${options.length?'':'disabled'}>启动</button></div>${options.length?'':'<p class="at-phase-failed">全部 Agent 已隐藏，请在任务设置中取消隐藏。</p>'}`:c.phase==='prepared'?`<div class="at-note">任务已创建 · ${c.copied?'调度提示词已自动复制':'提示词尚未复制成功'}。请在 ${c.agent} 的项目会话中粘贴发送。</div><div class="at-actions"><button data-act="copy">重新复制调度提示词</button><button data-act="connect" class="at-primary">模拟收到执行登记</button><button data-act="abort" class="at-danger">终止本轮任务</button></div><details><summary>调度提示词</summary><pre class="at-prompt">${esc(prompt())}</pre></details>`:`<div class="at-current"><span class="at-small">${active?'当前处理':'当前状态'}</span><h3>${active?esc(active.title):c.phase==='paused'?'已暂停，等待恢复':terminal?'本轮已停止领取条目':'等待领取下一项'}</h3><span class="at-id">${active?active.id+' · '+c.agent.toLowerCase()+'-'+state.kind+' · 已用时 04:32':''}</span></div>${c.phase==='pausing'?'<div class="at-note">当前项继续执行，完成后暂停；不会领取下一项。</div>':''}${c.external?'<div class="at-note">派发已终止。请在原 Agent 会话停止当前子代理，再重新执行。</div>':''}<div class="at-actions">${!terminal?`<button data-act="pause">${['paused','pausing'].includes(c.phase)?'恢复后续领取':'暂停后续领取'}</button><button class="at-danger" data-act="abort">终止本轮任务</button><button data-act="copy">复制续接提示词</button>`:c.external?'<button data-act="stopped">模拟确认子代理已停止</button>':'<button class="at-primary" data-act="new">启动新一轮</button>'}</div><div class="at-stats"><span>已处理 <b>${c.records.filter(r=>r.result==='done').length}</b></span><span>异常 <b>${c.records.filter(r=>r.result==='failed').length}</b></span><span>处理中 <b>${active?1:0}</b></span><span>待处理 <b>${terminal?0:c.queue.length}</b></span></div>`}</section>
${!terminal?`<div class="at-row at-section-head"><h3>待处理队列</h3><span class="at-small">最近 ${Math.min(2,c.queue.length)} 条 / 共 ${c.queue.length} 条</span></div>${c.queue.slice(-2).reverse().map(r=>`<div class="at-item"><div>${esc(r.title)}<div class="at-id">${r.id}</div></div><span class="at-small">待${t}</span></div>`).join('')}${c.queue.length>2?'<p class="at-small">仅显示最近 2 条；其余条目仍在本轮处理范围内。</p>':''}`:''}
<div class="at-row at-section-head"><h3>本轮处理记录</h3><span class="at-small">最近 ${Math.min(2,c.records.length)} 条 / 共 ${c.records.length} 条</span></div><div class="at-table-wrap"><table><thead><tr><th>需求 / Bug</th><th>执行状态</th><th>次数</th><th>操作</th></tr></thead><tbody>${c.records.slice(0,2).map((r,i)=>`<tr data-record><td>${esc(r.title)}<div class="at-id">${r.id}</div></td><td class="at-phase-${r.result}">${({running:'处理中',done:'已处理',failed:'异常',interrupted:'已中断',waiting:'待重试'})[r.result]}${r.result==='failed'?'<div class="at-small">执行超时</div>':''}</td><td>第 ${r.attempt} 次</td><td>${['failed','interrupted'].includes(r.result)?`<button data-act="retry" data-index="${i}" ${c.external?'disabled':''}>重新执行</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4">尚未领取条目</td></tr>'}</tbody></table></div>${['running','pausing'].includes(c.phase)?'<div class="at-actions at-section-head"><button data-act="advance">模拟当前项完成</button><button data-act="add">模拟新增需求</button></div>':''}`;filter();}
function show(html){modal.innerHTML=`<div class="at-overlay"><section class="at-dialog" role="dialog" aria-modal="true" aria-label="任务管理">${html}</section></div>`;modal.querySelector('button')?.focus();}
function settings(){const rows=state[settingKind].settings;show(`<h3>任务设置</h3><div class="at-tabs"><button data-settings="refine" aria-pressed="${settingKind==='refine'}">批量完善</button><button data-settings="develop" aria-pressed="${settingKind==='develop'}">批量开发</button></div><div class="at-table-wrap"><table><thead><tr><th>执行 Agent</th><th>子代理模型</th><th>推理强度</th><th>是否隐藏</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${s.agent}</td><td><select data-model="${i}" aria-label="${s.agent} 子代理模型">${['跟随会话默认值','高能力模型（演示）','标准模型（演示）'].map(v=>`<option ${v===s.model?'selected':''}>${v}</option>`).join('')}</select></td><td><select data-effort="${i}" aria-label="${s.agent} 推理强度">${['low','medium','high'].map(v=>`<option ${v===s.effort?'selected':''}>${v}</option>`).join('')}</select></td><td><label><input type="checkbox" data-hidden="${i}" ${s.hidden?'checked':''}> 隐藏</label></td></tr>`).join('')}</tbody></table></div><p class="at-settings-note">每行配置对应 Agent；默认均不隐藏。隐藏后不出现在该类任务的启动选项中。</p><div class="at-actions"><button data-act="close">取消</button><button data-act="save" class="at-primary">保存设置</button></div>`);}
root.querySelector('#at-search').addEventListener('input',filter);
root.addEventListener('change',e=>{if(e.target.id==='at-agent')cur().agent=e.target.value;});
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.kind){state.kind=b.dataset.kind;render();return;}if(b.dataset.settings){settingKind=b.dataset.settings;settings();return;}if(b.dataset.scene){const c=cur();c.phase=b.dataset.scene;c.external=false;if(c.phase==='idle'){c.records=[];c.queue=[...items];}if(c.phase==='running'){c.records=make().records;c.queue=make().queue;}if(c.phase==='done')c.records.forEach(r=>{if(r.result==='running')r.result='done';});render();return;}const c=cur();const act=b.dataset.act||b.dataset.action;switch(act){case 'settings':settingKind=state.kind;settings();break;case 'save':modal.querySelectorAll('[data-model]').forEach(el=>{const i=Number(el.dataset.model),s=state[settingKind].settings[i];s.model=el.value;s.effort=modal.querySelector(`[data-effort="${i}"]`).value;s.hidden=modal.querySelector(`[data-hidden="${i}"]`).checked;});modal.innerHTML='';render();feedback('已保存该类任务的 Agent 配置');break;case 'close':modal.innerHTML='';break;case 'start':c.phase='prepared';render();await copy();break;case 'copy':await copy();break;case 'connect':c.phase='running';if(!c.records.some(r=>r.result==='running')){const r=c.queue.shift();if(r)c.records.unshift({...r,result:'running',attempt:1});}render();break;case 'pause':c.phase=['paused','pausing'].includes(c.phase)?'running':c.records.some(r=>r.result==='running')?'pausing':'paused';render();break;case 'abort':show(`<h3>终止本轮批量${name()}？</h3><p>停止领取后续 ${c.queue.length} 项，保留本轮全部处理记录。</p><div class="at-note">${c.records.some(r=>r.result==='running')?'当前子代理还需要在 '+c.agent+' 会话中手动停止。':'当前没有正在执行的子代理。'}</div><div class="at-actions"><button data-act="close">取消</button><button class="at-danger" data-act="confirm-abort">终止本轮任务</button></div>`);break;case 'confirm-abort':c.external=c.records.some(r=>r.result==='running');c.records.forEach(r=>{if(r.result==='running')r.result='interrupted';});c.phase='aborted';modal.innerHTML='';render();break;case 'stopped':c.external=false;render();break;case 'new':c.phase='idle';c.records=[];c.queue=[...items];render();break;case 'retry':{const r=c.records[Number(b.dataset.index)];c.records.unshift({...r,result:'waiting',attempt:r.attempt+1});if(['done','aborted'].includes(c.phase)){c.phase='prepared';await copy();}else feedback('已加入本轮重试队列，保留原异常记录');render();break;}case 'advance':{const r=c.records.find(r=>r.result==='running');if(r)r.result='done';if(c.phase==='pausing')c.phase='paused';else{const retry=c.records.find(r=>r.result==='waiting');if(retry)retry.result='running';else{const next=c.queue.shift();if(next)c.records.unshift({...next,result:'running',attempt:1});else c.phase='done';}}render();break;}case 'add':c.queue.push({id:'REQ-20260908-029',title:'新增需求：优化任务提示'});render();feedback('已加入本轮候选，队列仍只展示最近 2 条');break;case 'demo-nav':case 'demo-new':feedback('演示仅覆盖任务管理模块');break;}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'density',{label:'列表密度',options:['舒适','紧凑']});}
})();
</script>

</body></html>
